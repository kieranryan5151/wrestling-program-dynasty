const TWO_WEIGHT_RATE=.40;
function generatedWeights(primaryIndex=null){
 let wi=primaryIndex==null?rnd(0,WTS.length-1):clamp(primaryIndex,0,WTS.length-1);
 if(Math.random()>=TWO_WEIGHT_RATE)return [WTS[wi]];
 let adj;
 if(wi===0)adj=1;
 else if(wi===WTS.length-1)adj=wi-1;
 else adj=Math.random()<.5?wi-1:wi+1;
 return [WTS[wi],WTS[adj]].sort((a,b)=>a-b)
}

function genWrestler(team,yr,cls){
 let base=team.prestige-12+rnd(-13,10),
     talentRoll=Math.random();

 // Individual breakout talent exists independently of overall program quality.
 // This lets a weaker room occasionally contain a conference contender / nationally solid wrestler
 // without flattening the large team-strength differences.
 if(talentRoll<.035)base+=rnd(16,24);       // rare elite breakout
 else if(talentRoll<.13)base+=rnd(9,16);   // solid / conference-contender type
 else if(talentRoll>.93)base-=rnd(5,10);   // occasional developmental miss

 base=clamp(base,55,95);
 let a=makeAttrs(base),
     grade=['Freshman','Sophomore','Junior','Senior'][cls],
     pastRS=cls===0?true:Math.random()<.42,
     freeBias=americanFreeBias(),weights=generatedWeights();

 return {
   id:'w'+Math.random().toString(36).slice(2),name:uniqueAmericanName(),flag:'🇺🇸',country:'USA',
   state:team.state,hometown:hometownForState(team.state),
   age:18+cls+(pastRS?1:0),
   year:(pastRS?'RS ':'')+grade,
   redshirtUsed:pastRS,redshirtActive:false,
   weights,attrs:a,folk:calcOvr(a,'folk'),free:clamp(calcOvr(a,'free')-freeBias,45,99),freeBias,
   team:team.id,collegeId:team.id,almaMaterId:team.id,record:{w:0,l:0},history:[]
 }
}

function generateRecruitingClass(year){
 // Keep historical committed/processed recruit records for recruiting-class/history links,
 // but guarantee exactly 350 ACTIVE prospects in each new class.
 G.recruits=G.recruits||[];
 let active=G.recruits.filter(r=>!r.committed&&!r.processedAfterRecruiting&&r.recruitClassYear===year);
 if(active.length>RECRUITING_POOL_SIZE){
   active.sort((a,b)=>(b.folk||0)-(a.folk||0));
   let keep=new Set(active.slice(0,RECRUITING_POOL_SIZE).map(r=>r.id));
   G.recruits=G.recruits.filter(r=>r.committed||r.processedAfterRecruiting||r.recruitClassYear!==year||keep.has(r.id));
   active=G.recruits.filter(r=>!r.committed&&!r.processedAfterRecruiting&&r.recruitClassYear===year)
 }
 while(active.length<RECRUITING_POOL_SIZE){
   let r=genRecruit();r.recruitClassYear=year;G.recruits.push(r);active.push(r)
 }
 G.currentRecruitingYear=year;
 G.recruitPage=1;
 assignRecruitingRanks(year);

 invalidateRecruitRankCache();invalidatePerformanceCaches('universe');
}

function intlDepthTargets(ct){
 let p=Number(ct?.prestige)||60;

 // These are NORMAL depth targets, not hard caps.
 // The original rules remain absolute minimums:
 // full 10-weight U23 coverage, at least six age 18/19, and at least five age 24+ at game start.
 let tier=
   p>=95?{total:[34,40],u20:[11,14],u23:[21,25],senior:[11,14]}:
   p>=90?{total:[30,36],u20:[10,13],u23:[19,23],senior:[10,13]}:
   p>=85?{total:[26,32],u20:[9,12], u23:[17,21],senior:[9,12]}:
   p>=80?{total:[23,29],u20:[8,11], u23:[15,19],senior:[8,11]}:
   p>=75?{total:[20,25],u20:[7,9],  u23:[13,17],senior:[7,9]}:
   p>=70?{total:[17,22],u20:[6,8],  u23:[11,15],senior:[6,8]}:
         {total:[14,18],u20:[6,7],  u23:[10,13],senior:[5,7]};

 let choose=range=>rnd(range[0],range[1]);
 return {
   total:choose(tier.total),
   u20:Math.max(6,choose(tier.u20)),
   u23:Math.max(10,choose(tier.u23)),
   senior:Math.max(5,choose(tier.senior))
 }
}


function collegePipelineShare(country){

function assignIntlCollegeRoster(w){

 let candidates=colleges.filter(c=>(G.wrestlers||[]).filter(x=>x.team===c.id&&!x.graduated).length<25);
 if(!candidates.length)candidates=[...colleges];

 // Foreign college placement is weighted toward stronger programs but remains broadly distributed.
 let pool=candidates.slice().sort((a,b)=>(b.prestige||0)-(a.prestige||0));
 let top=Math.max(12,Math.min(pool.length,Math.round(pool.length*.70))),
     c=pool[rnd(0,top-1)]||pick(pool);
 if(!c)return w;

 w.team=c.id;w.collegeId=c.id;w.almaMaterId=c.id;
 w.year=w.age<=18?'Fr':w.age===19?'So':w.age===20?'Jr':'Sr';
 w.foreignCollegeWrestler=true;
 w.rtcTeamId=null; // nationality rule: foreign wrestlers NEVER join an American RTC.
 if(!(G.wrestlers||[]).some(x=>x.id===w.id))G.wrestlers.push(w);
 return w
}

function addIntlDepthWrestler(list,ct,{ageBand='open',weight=null,tag='depth'}={}){

 else x.age=rnd(18,31);

function ensureInternationalDepthForCountry(list,ct,targets=null){
 targets=targets||intlDepthTargets(ct);
 let own=()=>list.filter(w=>(w.intlTeam===ct.id||w.country===ct.name)&&!w.retired);

 // Hard minimum #1: every U23 weight can be covered.
 WTS.forEach(wt=>{
   if(!own().some(w=>(w.age||99)<23&&(w.weights||[]).map(Number).includes(wt))){
     let x=addIntlDepthWrestler(list,ct,{ageBand:Math.random()<.55?'u20':'u23',weight:wt,tag:'u23-weight-coverage'});
     x.generatedForU23Coverage=true
   }
 });

 // Youth minimum + prestige-driven youth depth.
 while(own().filter(w=>w.age===18||w.age===19).length<targets.u20){
   let x=addIntlDepthWrestler(list,ct,{ageBand:'u20',tag:'u20-depth'});
   if(own().filter(w=>w.age===18||w.age===19).length<=6)x.generatedForYouthMinimum=true
 }

 // U23 depth includes U20 wrestlers.
 while(own().filter(w=>(w.age||99)<23).length<targets.u23){
   addIntlDepthWrestler(list,ct,{ageBand:'u23',tag:'u23-depth'})
 }

 // Established senior depth. Strong countries should have real competition above age 23.
 while(own().filter(w=>(w.age||0)>=24).length<targets.senior){
   let x=addIntlDepthWrestler(list,ct,{ageBand:'senior',tag:'senior-depth'});
   if(own().filter(w=>(w.age||0)>=24).length<=5)x.generatedForSeniorMinimum=true
 }

 // Overall depth target. Fill with a prestige-sensitive mix rather than one age band.
 while(own().length<targets.total){
   let roll=Math.random(),
       band=roll<.30?'u20':roll<.58?'u23':roll<.88?'senior':'open';
   addIntlDepthWrestler(list,ct,{ageBand:band,tag:'overall-depth'})
 }
}

function routeExistingCollegePipelineWrestlers(){
 ['Canada','Puerto Rico','Mexico'].forEach(country=>{
   let ct=intl.find(c=>c.name===country);if(!ct)return;
   let eligible=(G.intlWrestlers||[]).filter(w=>w.country===country&&collegeAgeForIntlPipeline(w.age));

   if(country==='Puerto Rico'){
     eligible.filter(w=>!w.team).forEach(w=>assignIntlCollegeRoster(w));
     return
   }

   // Canada and Mexico: approximately half of college-age wrestlers use the U.S. college pipeline.
   let desired=Math.round(eligible.length*.5),
       currently=eligible.filter(w=>w.team).length,
       need=Math.max(0,desired-currently),
       available=eligible.filter(w=>!w.team).sort(()=>Math.random()-.5);

   available.slice(0,need).forEach(w=>assignIntlCollegeRoster(w))
 })
}

function buildIntlPool(){
 let a=[];
 intl.forEach(ct=>{
   if(ct.name==='USA')return;

   let targets=intlDepthTargets(ct);

   // Seed a balanced initial population rather than creating an arbitrary per-weight count
   // and then having every country land exactly on the youth minimum.
   let initial=Math.max(10,Math.floor(targets.total*.72));
   for(let i=0;i<initial;i++){
     let roll=Math.random(),
         band=roll<.28?'u20':roll<.56?'u23':roll<.86?'senior':'open';
     addIntlDepthWrestler(a,ct,{ageBand:band,weight:pick(WTS),tag:'initial-depth'})
   }

   ensureInternationalDepthForCountry(a,ct,targets)
 });
 return a
}

function normalizeExclusiveDepthChart(chart,teamId=G.school){
 let out=Object.fromEntries(WTS.map(wt=>[wt,[]])),seen=new Set();
 let roster=rosterByTeam(teamId).filter(w=>isCompetitionAvailable(w,'folk'));

 // Preserve the EXACT existing depth order. Only remove invalid/duplicate assignments.
 WTS.forEach(wt=>{
   (chart?.[wt]||[]).forEach(id=>{
     let w=wrestlerById(id);
     if(!w||w.team!==teamId||seen.has(id)||!w.weights?.includes(wt)||!isCompetitionAvailable(w,'folk'))return;
     out[wt].push(id);
     seen.add(id)
   })
 });

 // Wrestlers not yet assigned to a weight are added once, at their primary eligible weight.
 // New additions are appended in OVR order, but EXISTING manual depth order is never changed.
 let unassigned=roster.filter(w=>!seen.has(w.id)).sort((a,b)=>(b.folk||0)-(a.folk||0));
 unassigned.forEach(w=>{
   let opts=(w.weights||[]).filter(wt=>WTS.includes(wt));
   if(!opts.length)return;
   let wt=opts[0];
   out[wt].push(w.id);
   seen.add(w.id)
 });

 return out
}

function optimizeStartingAssignments(pool,style='folk'){
 let wrestlers=(pool||[]).filter(w=>w&&!w.retired);
 let dp=new Map([[0,{score:0,assign:{}}]]);
 wrestlers.forEach(w=>{
   let next=new Map(dp);
   let eligible=(w.weights||[]).map(Number).filter(wt=>WTS.includes(wt));
   dp.forEach((state,mask)=>{
     eligible.forEach((wt,idx)=>{
       let wi=WTS.indexOf(wt),bit=1<<wi;
       if(mask&bit)return;
       let base=effectiveRating(w,style);
       // Tiny natural-weight preference only for ties/near-ties.
       let score=base-(idx===0?0:0.25);
       let nm=mask|bit,ns=state.score+score;
       let prev=next.get(nm);
       if(!prev||ns>prev.score){
         next.set(nm,{score:ns,assign:{...state.assign,[wt]:w.id}})
       }
     })
   });
   dp=next
 });
 let best={score:-1,assign:{}};
 dp.forEach(s=>{if(s.score>best.score)best=s});
 return best.assign
}
function optimizedCollegeStarterMap(teamId){
 let pool=rosterByTeam(teamId).filter(w=>isCompetitionAvailable(w,'folk'));
 return optimizeStartingAssignments(pool,'folk')
}
function optimizedRtcStarterMap(mode,teamId){

 return optimizeStartingAssignments(pool,'free')
}

function aiExclusiveCollegeAssignments(teamId){
 let roster=rosterByTeam(teamId).filter(w=>isCompetitionAvailable(w,'folk'));
 let starters=optimizedCollegeStarterMap(teamId),used=new Set(),
     byWt=Object.fromEntries(WTS.map(wt=>[wt,[]]));

 WTS.forEach(wt=>{
   let id=starters[wt],w=id?wrestlerById(id):null;
   if(w){byWt[wt].push(w);used.add(w.id)}
 });

 // Place non-starters once for depth, preferring their primary eligible weight and shallower rooms.
 roster.filter(w=>!used.has(w.id)).sort((a,b)=>(b.folk||0)-(a.folk||0)).forEach(w=>{
   let opts=(w.weights||[]).filter(x=>WTS.includes(x));
   if(!opts.length)return;
   let wt=[...opts].sort((a,b)=>byWt[a].length-byWt[b].length||opts.indexOf(a)-opts.indexOf(b))[0];
   byWt[wt].push(w);used.add(w.id)
 });
 return byWt
}

function genStartingRtcWrestler(c){
 let wt=pick(WTS),
     base=clamp(Math.round(62+(c.rtcPrestige||c.prestige||70)*.22+rnd(-8,8)),58,94),
     a=makeAttrs(base),
     wi=WTS.indexOf(wt),
     st=c.state||weightedState(),
     freeBias=americanFreeBias();
 return {
   id:'rtc'+Math.random().toString(36).slice(2),
   name:uniqueAmericanName(),
   flag:'🇺🇸',country:'USA',
   state:st,hometown:hometownForState(st),
   age:rnd(24,31),year:null,
   weights:generatedWeights(wi),
   attrs:a,
   folk:calcOvr(a,'folk'),
   free:clamp(calcOvr(a,'free')-Math.max(0,freeBias-2),45,99),
   freeBias,
   team:null,rtcTeamId:c.id,almaMaterId:c.id,
   record:{w:0,l:0},history:[],matchHistory:[],
   startingRtcVeteran:true
 }
}


function ensureRtcVeteranCore(teamId,min=5,max=8){
 let c=colleges.find(x=>String(x.id)===String(teamId));
 if(!c)return;
 G.rtc=G.rtc||[];
 // Direct array scan here is deliberate: this runs during universe mutation, before indexes settle.
 let current=G.rtc.filter(w=>String(w.rtcTeamId)===String(teamId)&&!w.team&&w.country==='USA').length;
 if(current>=min)return;
 let target=rnd(Math.max(min,current),max);
 while(current<target){G.rtc.push(genStartingRtcWrestler(c));current++}
 invalidatePerformanceCaches('universe')
}

function seedStartingRtcVeterans(){

 colleges.filter(c=>c.rtc).forEach(c=>ensureRtcVeteranCore(c.id,5,8));

 invalidatePerformanceCaches('universe')
}

 return `${sy}-${String(sy+1).slice(-2)}`
}

 return seasonStartYearForDate(ev?.year??G.year,ev?.month??G.month,ev?.week??G.wk,G.seasonStartMode)
}

 if(Number.isFinite(Number(m?.seasonStartYear)))return Number(m.seasonStartYear);
 if(Number.isFinite(Number(m?.year)))return Number(m.year);
 return currentSeasonStartYear()
}

function isSeasonFinalWeek(m=G.month,w=G.wk){
 // Event dates are universal. This only answers when the current career has completed
 // both required cycles since its chosen entry point.
 // Folk-start: folk Sep-Mar + freestyle Apr-Aug => closes after Senior Worlds (Aug W1).
 // Freestyle-start: freestyle Apr-Aug + folk Sep-Mar => closes after NCAA (Mar W4).
 return G.seasonStartMode==='folkstyle'?(m===7&&w===1):(m===2&&w===4)
}

function isRecruitingPeriod(m=G.month,w=G.wk){
 // Recruiting window depends on where the dynasty began, not on competition dates.
 // Freestyle-start: Apr W1-May W2 (6 weeks).
 // Folkstyle-start: Aug W2-Sep W3 (6 weeks).
 if(G.seasonStartMode==='freestyle')return (m===3)||(m===4&&w<=2);
 return (m===7&&w>=2)||(m===8&&w<=3)
}

function recruitingWeekNumber(m=G.month,w=G.wk){
 if(G.seasonStartMode==='freestyle'){
   if(m===3)return w;       // Apr W1-W4 = Weeks 1-4
   if(m===4&&w<=2)return w+4; // May W1-W2 = Weeks 5-6
   return 0
 }
 if(m===7&&w>=2)return w-1;
 if(m===8&&w<=3)return w+3;
 return 0
}

function phase(){
 if(isRecruitingPeriod())return 'Recruiting Period • Week '+recruitingWeekNumber()+' of 6 • '+offerSlotsLeft(G.school)+' open offer slots';
 if((G.month>=3&&G.month<=6)||(G.month===7&&G.wk===1))return 'Freestyle Season';
 if(G.month===7&&G.wk>=2)return 'Recruiting / Offseason';
 if(G.month>=8||G.month<=2)return 'College Folkstyle Season';
 return ''
}

function integrityAudit(){
 let issues=[],seen=new Map();
 allWrestlers().forEach(w=>{
   if(!w)return;
   if(seen.has(w.id))issues.push(`Duplicate wrestler ID: ${w.id}`);
   seen.set(w.id,true);
   if(w.team&&w.rtcTeamId&&!w.graduatedYear)issues.push(`${w.name} is simultaneously college + explicit RTC post-college.`);
 });
 colleges.forEach(c=>{
   let n=rosterByTeam(c.id).length;if(n>25)issues.push(`${c.name} college roster is ${n}/25.`);
   let r=rtcPostCollegeRoster(c.id).length;if(r>25)issues.push(`${rtcDisplayName(c)} roster is ${r}/25.`)
 });
 Object.values(G.tournaments||{}).forEach(ev=>{
   if(!ev)return;
   if(ev.id==='ncaa'&&ev.simulated){
     WTS.forEach(wt=>{let f=ncaaFieldForWeight(wt,eventSeasonStartYear(ev));if(f.length!==33)issues.push(`${seasonLabel(eventSeasonStartYear(ev))} NCAA ${wt}: ${f.length}/33 field.`)})
   }
   if(['worlds','u23worlds','u20worlds'].includes(ev.id)&&ev.simulated){
     let need=worldFieldSize(ev.level);
     WTS.forEach(wt=>{let f=worldQualifierField(ev.level,wt,eventSeasonStartYear(ev));if(f.length!==need)issues.push(`${ev.name} ${wt}: ${f.length}/${need} field.`)})
   }
 });
 return issues
}

// v1.121 HOTFIX: restore functions accidentally removed during v1.08 structural patch.
function aiIssueRecruitingOffers(){
 if(!isRecruitingPeriod())return;

 pruneAndRebalanceAIOffers();buildRecruitOfferCountCache();

 // Two passes let teams freed by the market-cap pruning immediately redirect
 // those scholarships/offers toward other good recruits.
 for(let pass=0;pass<2;pass++){
   colleges.forEach(c=>{
     if(c.id===G.school)return;
     if(aiHighSchoolSigningCount(c.id)>=aiRecruitTarget(c))return;

     let slots=offerSlotsLeft(c.id);
     if(slots<=0)return;

     let cand=(G.recruits||[]).filter(r=>{
       if(r.committed||(r.offers||[]).includes(c.id))return false;
       // Do not pile onto a recruit who already has a healthy market unless the team is an exceptional fit.
       let offers=recruitOfferCount(r),goal=recruitOfferGoal(r);
       if(offers<goal)return true;
       return teamWeightNeed(r,c)>=82&&aiRecruitCandidateScore(r,c,true)>=150
     }).sort((a,b)=>aiRecruitCandidateScore(b,c)-aiRecruitCandidateScore(a,c)).slice(0,slots);

     cand.forEach(r=>{r.offers=r.offers||[];r.offers.push(c.id)})
   });
   pruneAndRebalanceAIOffers();buildRecruitOfferCountCache()
 }

 // Late in recruiting, actively rescue starter-caliber wrestlers who are being overlooked.
 // Teams replace their weakest current AI offer when the overlooked recruit is a much better need/quality fit.
 if(recruitingWeekNumber()>=4){
   let rescue=(G.recruits||[]).filter(r=>!r.committed&&minimumLateOfferGoal(r)>0&&recruitOfferCount(r)<minimumLateOfferGoal(r))
     .sort((a,b)=>(b.folk||0)-(a.folk||0)||recruitOfferCount(a)-recruitOfferCount(b));

   rescue.forEach(r=>{
     let wanted=minimumLateOfferGoal(r);
     let teams=colleges.filter(c=>c.id!==G.school&&aiHighSchoolSigningCount(c.id)<aiRecruitTarget(c)&&!(r.offers||[]).includes(c.id))
       .sort((a,b)=>aiRecruitCandidateScore(r,b)-aiRecruitCandidateScore(r,a));

     for(let c of teams){
       if(recruitOfferCount(r)>=wanted)break;
       let active=activeCollegeOffers(c.id);
       if(active.length<6){
         r.offers=r.offers||[];r.offers.push(c.id);continue
       }
       let weakest=[...active].sort((a,b)=>aiRecruitCandidateScore(a,c)-aiRecruitCandidateScore(b,c))[0];
       if(!weakest)continue;
       let newScore=aiRecruitCandidateScore(r,c),oldScore=aiRecruitCandidateScore(weakest,c);
       if(newScore>oldScore+7){
         weakest.offers=(weakest.offers||[]).filter(id=>id!==c.id);
         r.offers=r.offers||[];r.offers.push(c.id)
       }
     }
   });
   pruneAndRebalanceAIOffers();buildRecruitOfferCountCache()
 }

 invalidateRecruitOfferCountCache();
}


function wrestlerCoverageValue(w,teamId,style='folk'){
 if(!w)return -9999;
 let rating=style==='free'?(w.free||0):(w.folk||0),
     flexibility=Math.max(0,(w.weights||[]).length-1)*2.5,
     yearsLeft=w.team?(w.year==='Freshman'||w.year==='RS Freshman'?4:w.year==='Sophomore'||w.year==='RS Sophomore'?3:w.year==='Junior'||w.year==='RS Junior'?2:1):1,
     need=0,c=colleges.find(x=>x.id===teamId);
 if(c&&w.team){
   try{need=teamWeightNeed(w,c)}catch(e){}
 }
 return rating+flexibility+Math.max(0,need-50)*.09+yearsLeft*.6
}

function balanceLateAIRecruitingMarket(){
 if(!isRecruitingPeriod()||recruitingWeekNumber()<5)return;

 let teams=colleges.filter(c=>c.id!==G.school&&aiHighSchoolSigningCount(c.id)<aiRecruitTarget(c));

 // Most under target first, with NO prestige tiebreaker.
 teams.sort((a,b)=>{
   let da=aiRecruitTarget(a)-aiHighSchoolSigningCount(a.id),
       db=aiRecruitTarget(b)-aiHighSchoolSigningCount(b.id);
   return db-da||recruitingYearHash(a.id)-recruitingYearHash(b.id)
 });

 teams.forEach(c=>{
   let target=aiRecruitTarget(c),current=aiHighSchoolSigningCount(c.id);
   if(current>=target)return;

   // Week 5: aggressively issue offers. Week 6: clear the market and actually fill needs.
   let candidates=(G.recruits||[]).filter(r=>!r.committed).sort((a,b)=>{
     let needA=teamWeightNeed(a,c),needB=teamWeightNeed(b,c),
         oppA=startingOpportunity(a,c),oppB=startingOpportunity(b,c);
     // Need/opportunity are as important as raw quality here, which lets weaker programs
     // build big classes from useful average recruits instead of only chasing stars.
     let sa=(a.folk||0)*.80+needA*.72+oppA*.34+stateProximity(c.state,a.state)*.10-recruitOfferCount(a)*1.6+rnd(-2,2);
     let sb=(b.folk||0)*.80+needB*.72+oppB*.34+stateProximity(c.state,b.state)*.10-recruitOfferCount(b)*1.6+rnd(-2,2);
     return sb-sa
   });

   for(let r of candidates){
     if(aiHighSchoolSigningCount(c.id)>=target)break;
     r.offers=r.offers||[];
     if(!r.offers.includes(c.id))r.offers.push(c.id);

     if(recruitingWeekNumber()>=6){
       // Final week market clearing: if a school still needs bodies and the recruit fills
       // a plausible roster/depth need, he signs instead of unnecessarily becoming a free agent.
       let need=teamWeightNeed(r,c),opp=startingOpportunity(r,c);
       let useful=(r.folk||0)>=58 || need>=48 || opp>=42;
       if(useful)commitAIRecruit(r,c)
     }
   }
 });

 invalidateRecruitOfferCountCache()
}

function fillUnderMinimumAIClasses(){
 // Backward-compatible wrapper; the actual late-cycle logic now uses each team's
 // independent 3-8 wrestler class plan rather than a universal prestige-shaped minimum.
 balanceLateAIRecruitingMarket()
}

function aiRecruit(){
 if(!isRecruitingPeriod())return;
 ensureAIRecruitingOffers();

 (G.recruits||[]).forEach(r=>{
  if(r.committed||!(r.offers||[]).length)return;
  if(Math.random()>=recruitDecisionChance(r))return;

  let eligibleOffers=r.offers.filter(id=>{
    let c=colleges.find(x=>x.id===id);
    return c&&aiHighSchoolSigningCount(id)<aiRecruitTarget(c)
  });
  if(r.offers.includes(G.school)&&annualSigningCount(G.school)<8&&!eligibleOffers.includes(G.school))eligibleOffers.push(G.school);
  if(!eligibleOffers.length)return;

  let best=null,bs=-1e9;
  eligibleOffers.forEach(id=>{
    let c=colleges.find(x=>x.id===id);
    if(!c)return;
    let prox=stateProximity(c.state,r.state),opp=startingOpportunity(r,c),need=teamWeightNeed(r,c);
    let prestige=c.prestige||70;
    // Recruits care about program quality, path to the lineup, actual roster need, and geography.
    let sc=prestige*.34+opp*.25+need*.25+prox*.10+rnd(0,12);
    sc*=prestigeFitModifier(r,c);
    // USER ONLY: a recruit far above your program prestige is much harder to land.
    // CPU teams retain the looser upset potential.
    if(c.id===G.school)sc*=userRecruitPrestigeFactor(r,c);
    if(sc>bs){bs=sc;best=id}
  });
  if(!best)return;

  let dest=colleges.find(c=>c.id===best);if(!dest)return;
  if(best===G.school&&!userRecruitCanCommit(r,dest))return;
  if(best!==G.school){
    if(!commitAIRecruit(r,dest))return
  }else{
    if(G.wrestlers.filter(w=>w.team===best).length>=25&&!aiMakeRosterRoom(best,r))return;
    r.committed=best;r.recruitYear=G.currentRecruitingYear||currentSeasonStartYear();
    r.team=best;r.collegeId=best;r.almaMaterId=best;r.year='Freshman';r.record={w:0,l:0};
    if(!(G.wrestlers||[]).some(w=>w.id===r.id))G.wrestlers.push(r);
    addTransaction('COLLEGE SIGNING',`${r.name} signed with ${dest.name}.`,r);
    autoRedshirtAIRecruit(r)
  }

  if(best===G.school){
    initDepthChart();
    let msg=`SIGNED: ${r.name} (#${recruitNationalRank(r)} recruit, ${r.weights.join('/')} lbs, ${r.folk} OVR) committed to ${team().name}. Annual signings: ${myClassCount()}/8.`;
    G.news.unshift(msg);queueNotification(msg)
  }
 })

 balanceLateAIRecruitingMarket();
}




function recruitOfferGoal(r){
 let rank=recruitNationalRank(r),ovr=r.folk||65,goal;
 if(rank<=10)goal=26;
 else if(rank<=25)goal=21;
 else if(rank<=50)goal=15;
 else if(rank<=100)goal=10;
 else if(rank<=175)goal=6;
 else if(rank<=250)goal=3;
 else goal=1;
 if(ovr>=90)goal+=3;
 else if(ovr>=85)goal+=2;
 else if(ovr>=80)goal+=1;
 if(ovr<=66)goal=Math.max(1,goal-1);
 return clamp(goal,1,30)
}

let RECRUIT_AI_CACHE={key:null,weightNeed:new Map(),opportunity:new Map()};
function recruitAICacheKey(){
 return `${G?.year||0}:${G?.month||0}:${G?.wk||0}:${(G?.wrestlers||[]).length}:${(G?.recruits||[]).length}`
}
function ensureRecruitAICache(){
 let key=recruitAICacheKey();
 if(RECRUIT_AI_CACHE.key===key)return RECRUIT_AI_CACHE;
 let weightNeed=new Map(),opportunity=new Map();

 colleges.forEach(c=>{
   let roster=(G.wrestlers||[]).filter(w=>w.team===c.id&&!w.retired);
   WTS.forEach(wt=>{
     let room=roster.filter(w=>w.weights?.includes(wt));
     let returning=room.filter(w=>!String(w.year||'').includes('Senior'));
     let seniors=room.filter(w=>String(w.year||'').includes('Senior'));
     let top=[...returning].sort((a,b)=>(b.folk||0)-(a.folk||0)).slice(0,2);
     let top1=top[0]?.folk||0,top2=top[1]?.folk||0;
     let need=!returning.length?100:returning.length===1?86:clamp(82-(top1*.55+top2*.45),18,78);
     if(seniors.length)need+=Math.min(18,seniors.length*8);
     weightNeed.set(`${c.id}:${wt}`,{need:clamp(need,0,100),top1,returning});
   })
 });
 RECRUIT_AI_CACHE={key,weightNeed,opportunity};return RECRUIT_AI_CACHE
}
function invalidateRecruitAICache(){RECRUIT_AI_CACHE={key:null,weightNeed:new Map(),opportunity:new Map()}}

function teamWeightNeed(r,c){
 let cache=ensureRecruitAICache(),best=0;
 (r.weights||[]).forEach(wt=>{
   let x=cache.weightNeed.get(`${c.id}:${wt}`)||{need:50,top1:0};
   let need=x.need;
   if((r.folk||0)>=x.top1+4)need+=14;
   else if((r.folk||0)>=x.top1)need+=8;
   best=Math.max(best,clamp(need,0,100))
 });
 return best||50
}

function teamRecruitPrestigeFit(r,c){
 let diff=(c.prestige||70)-(r.folk||70);
 // Elite recruits prefer stronger brands, but good players will still take offers
 // from schools where they immediately improve the lineup.
 if(diff>=12)return 12;
 if(diff>=5)return 7;
 if(diff<=-20)return -9;
 if(diff<=-12)return -5;
 return 2
}
function minimumLateOfferGoal(r){
 let o=r.folk||0;
 if(o>=88)return 10;
 if(o>=84)return 7;
 if(o>=80)return 5;
 if(o>=76)return 3;
 if(o>=72)return 1;
 return 0
}
function pruneAndRebalanceAIOffers(){
 // Remove dead/full-team offers first.
 (G.recruits||[]).filter(r=>!r.committed).forEach(r=>{
   r.offers=(r.offers||[]).filter(id=>{
     if(id===G.school)return true; // never withdraw the user's offer
     let c=colleges.find(x=>x.id===id);
     return c&&aiHighSchoolSigningCount(id)<aiRecruitTarget(c)
   })
 });

 // Prevent every program from camping on the exact same handful of prospects.
 // If a recruit exceeds his realistic demand band, keep only the best-fit AI offers.
 (G.recruits||[]).filter(r=>!r.committed).forEach(r=>{
   let userOffer=(r.offers||[]).includes(G.school),ai=(r.offers||[]).filter(id=>id!==G.school);
   let cap=Math.max(1,recruitOfferGoal(r)-(userOffer?1:0));
   if(ai.length>cap){
     ai.sort((a,b)=>{
       let ca=colleges.find(c=>c.id===a),cb=colleges.find(c=>c.id===b);
       return aiRecruitCandidateScore(r,cb,true)-aiRecruitCandidateScore(r,ca,true)
     });
     ai=ai.slice(0,cap)
   }
   r.offers=[...(userOffer?[G.school]:[]),...ai]
 })
}

function aiRecruitCandidateScore(r,c,ignoreMarket=false){
 let ovr=r.folk||65,rank=recruitNationalRank(r),need=teamWeightNeed(r,c),
     opp=startingOpportunity(r,c),prox=r.state?stateProximity(c.state,r.state):50,
     offers=recruitOfferCount(r),goal=recruitOfferGoal(r);

 // Talent matters most, but NEED is strong enough that teams do not all chase the same ten wrestlers.
 let quality=ovr*1.35;
 let national=rank<=10?22:rank<=25?17:rank<=50?12:rank<=100?7:rank<=175?3:0;
 let prestigeFit=teamRecruitPrestigeFit(r,c);

 // Market pressure makes an under-recruited good wrestler increasingly attractive.
 // Once a recruit is around his realistic offer goal, that bonus disappears.
 let scarcity=ignoreMarket?0:clamp((goal-offers)*2.6,-24,30);
 let saturation=ignoreMarket?0:(offers>=goal?-(offers-goal+1)*5:0);

 return quality+national+need*.58+opp*.16+prox*.07+prestigeFit+scarcity+saturation+rnd(-3,3)
}


function aiHighSchoolSigningCount(teamId,year=(G.currentRecruitingYear||currentSeasonStartYear())){
 let ids=new Set();
 (G.recruits||[]).forEach(r=>{
   if(r.committed===teamId&&r.recruitYear===year)ids.add(r.id)
 });
 return ids.size
}
function aiRecruitMinimum(){return 3}

function recruitingYearHash(teamId,year=G.year){
 let s=String(teamId)+'|'+String(year),h=2166136261;
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
 return (h>>>0)
}
function aiRecruitClassPlan(c,year=(G.currentRecruitingYear||currentSeasonStartYear())){
 let roster=(G.wrestlers||[]).filter(w=>w.team===c.id);
 let seniors=roster.filter(w=>String(w.year||'').includes('Senior')).length;
 let returning=Math.max(0,roster.length-seniors);
 let naturalOpen=Math.max(0,25-returning);
 let h=recruitingYearHash(c.id,year),roll=(h%1000)/1000;

 // Class size is intentionally NOT prestige-driven.
 // Quiet year / normal year / big year distributions can happen to any program.
 let target=roll<.08?3:
            roll<.25?4:
            roll<.50?5:
            roll<.76?6:
            roll<.92?7:8;

 // Actual roster turnover/holes matter, but prestige does not.
 if(seniors>=6)target++;
 if(seniors<=1&&returning>=23)target--;
 if(naturalOpen>=8)target++;
 if(naturalOpen<=3)target--;

 target=clamp(target,3,8);
 return {target,seniors,returning,naturalOpen,year,roll}
}
function aiRecruitPlanLabel(c){
 let p=aiRecruitClassPlan(c);
 return p.target>=7?'Big class':p.target<=4?'Quiet class':'Normal class'
}
function aiProjectedRosterSpace(teamId){
 let roster=(G.wrestlers||[]).filter(w=>w.team===teamId);
 let seniors=roster.filter(w=>String(w.year||'').includes('Senior')).length;
 return Math.max(0,25-(roster.length-seniors))
}
function commitAIRecruit(r,c){
 if(!r||!c||r.committed)return false;

 // Recruiting is for NEXT year's roster. Seniors currently on the roster are outgoing,
 // so they should not block a school from signing a normal-sized class.
 let projectedSpace=aiProjectedRosterSpace(c.id);
 let signed=aiHighSchoolSigningCount(c.id);
 if(projectedSpace<=signed){
   // Truly overfull beyond graduation turnover: make room only if the recruit improves depth.
   if((G.wrestlers||[]).filter(w=>w.team===c.id).length>=25&&!aiMakeRosterRoom(c.id,r))return false
 }

 r.committed=c.id;
 r.recruitYear=G.currentRecruitingYear||currentSeasonStartYear();
 r.team=c.id;r.collegeId=c.id;r.almaMaterId=c.id;r.year='Freshman';r.record={w:0,l:0};
 if(!(G.wrestlers||[]).some(w=>w.id===r.id))G.wrestlers.push(r);
 addTransaction('COLLEGE SIGNING',`${r.name} signed with ${c.name}.`,r);
 let nr=recruitNationalRank(r);
 if(nr&&nr<=25)addNewsFeed('TOP RECRUIT',`#${nr} recruit ${r.name} committed to ${c.name}.`,{wrestlerId:r.id,teamId:c.id,importance:nr<=10?3:2});
 autoRedshirtAIRecruit(r);
 return true
}

function finalizeRecruitingYear(){
 let y=G.currentRecruitingYear||currentSeasonStartYear();
 if(!(G.recruitingHistory||[]).some(x=>x.year===y)){
  let snapshot=recruitingClassRows(y).map((x,i)=>({rank:i+1,team:x.c.id,score:Math.round(x.score),recruits:x.rs.map(r=>({id:r.id,name:r.name,ovr:r.folk,weights:[...r.weights],nationalRank:recruitNationalRank(r)}))}));
  G.recruitingHistory.push({year:y,classes:snapshot});
  let mine=snapshot.find(x=>x.team===G.school),msg=mine?`Year ${y} recruiting finished: ${team().name} signed ${mine.recruits.length} high-school recruits and finished with the #${mine.rank} recruiting class.`:`Year ${y} recruiting finished: ${team().name} signed 0 high-school recruits.`;
  G.news.unshift(msg);queueNotification(msg)
 }

 // FINAL CPU MARKET CLEARING.
 // Before anybody becomes a free agent, give programs that are still below their planned
 // 3-8 wrestler class size one last chance to fill real roster/depth needs.
 let cpuNeeds=colleges.filter(c=>c.id!==G.school&&aiHighSchoolSigningCount(c.id)<aiRecruitTarget(c))
   .sort((a,b)=>(aiRecruitTarget(b)-aiHighSchoolSigningCount(b.id))-(aiRecruitTarget(a)-aiHighSchoolSigningCount(a.id)));
 for(let c of cpuNeeds){
   let target=aiRecruitTarget(c);
   while(aiHighSchoolSigningCount(c.id)<target){
     let pool=(G.recruits||[]).filter(r=>!r.committed&&!r.processedAfterRecruiting);
     if(!pool.length)break;
     pool.sort((a,b)=>{
       let sa=(a.folk||0)*.72+teamWeightNeed(a,c)*.82+startingOpportunity(a,c)*.36+stateProximity(c.state,a.state)*.08;
       let sb=(b.folk||0)*.72+teamWeightNeed(b,c)*.82+startingOpportunity(b,c)*.36+stateProximity(c.state,b.state)*.08;
       return sb-sa
     });
     let pick=pool[0];
     if(!pick||!commitAIRecruit(pick,c))break
   }
 }

 // Any prospects STILL unsigned after every CPU program has filled its planned class
 // become walk-ons/free agents. Foreign prospects return to their country's freestyle pool.
 let unsigned=(G.recruits||[]).filter(r=>!r.committed&&!r.processedAfterRecruiting);
 let usCount=0,foreignCount=0;
 unsigned.forEach(r=>{
   r.processedAfterRecruiting=true;
   r.offers=[];
   if(!r.country||r.country==='USA'){
     r.country='USA';r.flag=r.flag||'🇺🇸';r.team=null;r.year='Freshman';r.walkonSinceYear=G.year;r.freeAgentSinceYear=G.year;markCollegeFreeAgent(r,'walkon');
     r.record=r.record||{w:0,l:0};r.matchHistory=r.matchHistory||[];
     if(!(G.wrestlers||[]).some(w=>w.id===r.id))G.wrestlers.push(r);
     G.freeAgents=G.freeAgents||[];if(!G.freeAgents.includes(r.id))G.freeAgents.push(r.id);
     usCount++;
   }else{
     r.team=null;r.intlTeam=(intl.find(c=>c.name===r.country)||{}).id||null;r.year=null;
     r.record=r.record||{w:0,l:0};r.matchHistory=r.matchHistory||[];
     if(!(G.intlWrestlers||[]).some(w=>w.id===r.id))G.intlWrestlers.push(r);
     foreignCount++;
   }
 });
 if(usCount||foreignCount){
   let note=`Unsigned prospect processing complete: ${usCount} American recruits entered the Walk-Ons / Free Agents pool${foreignCount?`, and ${foreignCount} foreign prospects returned to their national freestyle pools`:''}.`;
   G.news.unshift(note);queueNotification(note)
 }
}

function simIntlDual(t){
 if(!requireCurrentEventWeek(t))return;
 if(t.simulated)return;

 let ranked=currentCountryRankings('Senior').slice(0,24);
 t.intlDualSeeds=Object.fromEntries(ranked.map((x,i)=>[x.ct.id,i+1]));
 let seedTeam=s=>ranked[s-1]?.ct?.id||null;

 function teamDual(Aid,Bid,roundLabel){
   if(!Aid&&!Bid)return null;
   if(Aid&&!Bid)return {a:Aid,b:null,score:[0,0],winner:Aid,matches:[],round:roundLabel,bye:true};
   if(Bid&&!Aid)return {a:null,b:Bid,score:[0,0],winner:Bid,matches:[],round:roundLabel,bye:true};

   let A=intl.find(x=>x.id===Aid),B=intl.find(x=>x.id===Bid),
       as=0,bs=0,matches=[];

   WTS.forEach(wt=>{
     let a=nationalStarter(A.id,'Senior',wt)||countryTop3(A,wt)[0],
         b=nationalStarter(B.id,'Senior',wt)||countryTop3(B,wt)[0],
         r=simBout(a,b,'free');

     if(r.winner?.country===A.name)as++;
     else if(r.winner?.country===B.name)bs++;

     matches.push({
       wt,a:a?.id||null,b:b?.id||null,winner:r.winner?.id||null,
       loser:r.loser?.id||null,score:r.score,method:r.method,tiebreak:false
     });
     if(r.winner&&r.loser)logBout(t,wt,`${roundLabel} — International Dual`,r,true)
   });

   // A 5-5 dual is settled by randomly selecting one weight and wrestling it again.
   let tiebreak=null;
   if(as===5&&bs===5){
     let wt=pick(WTS),
         a=nationalStarter(A.id,'Senior',wt)||countryTop3(A,wt)[0],
         b=nationalStarter(B.id,'Senior',wt)||countryTop3(B,wt)[0],
         r=simBout(a,b,'free');
     if(r.winner?.country===A.name)as++; else if(r.winner?.country===B.name)bs++;
     tiebreak={
       wt,a:a?.id||null,b:b?.id||null,winner:r.winner?.id||null,
       loser:r.loser?.id||null,score:r.score,method:r.method,tiebreak:true
     };
     matches.push(tiebreak);
     if(r.winner&&r.loser)logBout(t,wt,`${roundLabel} — Dual Tiebreaker`,r,true)
   }

   let winner=as>bs?A.id:B.id,loser=winner===A.id?B.id:A.id;
   return {a:A.id,b:B.id,score:[as,bs],winner,loser,matches,round:roundLabel,tiebreak}
 }

 // Round of 24: #1-#8 receive byes; #9-#24 wrestle.
 // Matchups: 9v24, 10v23, ... 16v17.
 let r24=[],r24w={};
 for(let s=9;s<=16;s++){
   let opp=33-s,g=teamDual(seedTeam(s),seedTeam(opp),'Round of 24');
   r24.push(g);r24w[s]=g.winner
 }

 // Standard seeded 16-team bracket after the opening round.
 let r16Pairs=[
   [seedTeam(1),r24w[16]],
   [seedTeam(8),r24w[9]],
   [seedTeam(5),r24w[12]],
   [seedTeam(4),r24w[13]],
   [seedTeam(3),r24w[14]],
   [seedTeam(6),r24w[11]],
   [seedTeam(7),r24w[10]],
   [seedTeam(2),r24w[15]]
 ];
 let r16=r16Pairs.map(p=>teamDual(p[0],p[1],'Round of 16'));
 let qf=[];
 for(let i=0;i<r16.length;i+=2)qf.push(teamDual(r16[i].winner,r16[i+1].winner,'Quarterfinals'));
 let sf=[];
 for(let i=0;i<qf.length;i+=2)sf.push(teamDual(qf[i].winner,qf[i+1].winner,'Semifinals'));
 let final=teamDual(sf[0].winner,sf[1].winner,'Final');

 let champ=final.winner,runner=final.loser;

 // International Dual Tournament is pure single elimination.
 // Once a nation loses, it is eliminated. There is no UWW repechage
 // and no bronze/fifth-place dual phase.
 t.dualBracket=[r24,r16,qf,sf,[final]];
 t.intlDualMedalMatches=[];
 t.intlDualPlacements=[champ,runner];
 t.simulated=true;
 recordTeamTitle(t);
 saveGame()
}

function rrIndividualGroup(t,wt,ids,label){
 let stats={};
 ids.forEach(id=>stats[id]={id,pts:0,w:0,l:0,dec:0,major:0,tf:0,pf:0});
 let matches=[];

 for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
   let a=wrestlerById(ids[i]),b=wrestlerById(ids[j]),r=simBout(a,b,'folk');
   let wp=boutDualPoints(r),win=stats[r.winner?.id],lose=stats[r.loser?.id];

   if(win){
     win.pts+=wp;win.w++;
     if(wp>=6)win.pf++;
     else if(wp===5)win.tf++;
     else if(wp===4)win.major++;
     else win.dec++
   }
   if(lose)lose.l++;

   matches.push({
     round:`${label} Round Robin`,a:a.id,b:b.id,winner:r.winner?.id,loser:r.loser?.id,
     score:r.score,method:r.method,teamPoints:wp,side:'Group Stage'
   });
   if(r.winner&&r.loser)logBout(t,wt,`${label} Round Robin`,r,false)
 }

 Object.values(stats).forEach(x=>{
   x.undefeatedBonus=(x.l===0&&x.w>0)?2:0;
   x.pts+=x.undefeatedBonus
 });
 let standings=Object.values(stats).sort((a,b)=>
   b.pts-a.pts || b.w-a.w ||
   collegeSeedScore(wrestlerById(b.id))-collegeSeedScore(wrestlerById(a.id))
 );
 return {label,ids,matches,standings}
}

function simulateRoundRobinIndividualWeight(t,wt){
 t.rrWeights=t.rrWeights||{};if(t.rrWeights[wt])return;

 let ids=(allEligibleFolkAssignments(t)[wt]||[])
   .map(wrestlerById).filter(Boolean)
   .sort((a,b)=>collegeSeedScore(b)-collegeSeedScore(a))
   .map(w=>w.id);

 // Four random groups, as even as possible.
 let shuffled=[...ids].sort(()=>Math.random()-.5),
     buckets=[[],[],[],[]];
 shuffled.forEach((id,i)=>buckets[i%4].push(id));

 let groups=buckets.map((arr,i)=>rrIndividualGroup(t,wt,arr,`Group ${String.fromCharCode(65+i)}`)),
     matches=groups.flatMap(g=>g.matches),
     winners=groups.map(g=>wrestlerById(g.standings[0]?.id)).filter(Boolean),
     bracket={semifinals:[],gold:null,bronze:null},
     placements=[];

 // Standard 4-man bracket: A vs D, B vs C.
 if(winners.length===4){
   let sf1=simBout(winners[0],winners[3],'folk'),
       sf2=simBout(winners[1],winners[2],'folk');

   [sf1,sf2].forEach((r,i)=>{
     let rn=`Semifinal ${i+1}`;
     bracket.semifinals.push({
       round:rn,a:r.winner===winners[i===0?0:1]?winners[i===0?0:1].id:(i===0?winners[0].id:winners[1].id),
       b:i===0?winners[3].id:winners[2].id,winner:r.winner.id,loser:r.loser.id,score:r.score,method:r.method
     });
     matches.push({round:rn,a:i===0?winners[0].id:winners[1].id,b:i===0?winners[3].id:winners[2].id,winner:r.winner.id,loser:r.loser.id,score:r.score,method:r.method,side:'Championship Bracket'});
     logBout(t,wt,rn,r,false)
   });

   let gold=simBout(sf1.winner,sf2.winner,'folk'),
       bronze=simBout(sf1.loser,sf2.loser,'folk');

   bracket.gold={round:'Gold Medal Match',a:sf1.winner.id,b:sf2.winner.id,winner:gold.winner.id,loser:gold.loser.id,score:gold.score,method:gold.method};
   bracket.bronze={round:'Bronze Medal Match',a:sf1.loser.id,b:sf2.loser.id,winner:bronze.winner.id,loser:bronze.loser.id,score:bronze.score,method:bronze.method};

   matches.push({round:'Gold Medal Match',a:sf1.winner.id,b:sf2.winner.id,winner:gold.winner.id,loser:gold.loser.id,score:gold.score,method:gold.method,side:'Medal Matches'});
   matches.push({round:'Bronze Medal Match',a:sf1.loser.id,b:sf2.loser.id,winner:bronze.winner.id,loser:bronze.loser.id,score:bronze.score,method:bronze.method,side:'Medal Matches'});
   logBout(t,wt,'Gold Medal Match',gold,false);
   logBout(t,wt,'Bronze Medal Match',bronze,false);

   placements=[gold.winner.id,gold.loser.id,bronze.winner.id,bronze.loser.id]
 }

 t.rrWeights[wt]={groups,matches,placements,bracket};
 t.brackets=t.brackets||{};
 t.brackets[wt]={matches,placements,seeds:Object.fromEntries(ids.map((id,i)=>[id,i+1]))};
 recordTournamentAccolades(t,wt)
}

function rrTeamStandings(t){

 (t.participatingTeams||[]).forEach(id=>score[id]=0);

 Object.entries(t.rrWeights||{}).forEach(([wt,x])=>{
   let stage=rrShownStage(t,Number(wt));

function makeTournamentDualGame(a,b,label){

}
function simulateTournamentDualWeight(t,g,wt){
 if(!g||g.complete||g.matches.some(x=>x.wt===wt))return;
 if(!g.a||!g.b){
   g.winner=g.a||g.b;g.complete=true;return
 }
 let a=wrestlerById(g.lineups?.[g.a]?.[wt]),b=wrestlerById(g.lineups?.[g.b]?.[wt]),
     r=simBout(a,b,'folk'),pts=boutDualPoints(r);
 if(r.winner?.team===g.a)g.scoreA+=pts;
 else if(r.winner?.team===g.b)g.scoreB+=pts;
 g.matches.push({wt,a:a?.id||null,b:b?.id||null,winner:r.winner?.id||null,score:r.score,method:r.method});
 if(r.winner&&r.loser)logBout(t,wt,g.label,r,true);
 if(g.matches.length===WTS.length)finalizeTournamentDualGame(g)
}
function finalizeTournamentDualGame(g){
 if(!g||g.complete)return;
 g.winner=resolveDualWinner(g.a,g.b,g.scoreA,g.scoreB,g.matches);
 g.complete=true;invalidatePerformanceCaches('duals')
}

function currentUnsimulatedTournamentWeight(games){
 let done=new Set();
 WTS.forEach(wt=>{if((games||[]).every(g=>g.complete||g.matches.some(m=>m.wt===wt)))done.add(wt)});
 return WTS.find(wt=>!done.has(wt))
}

function simulateNeutralCollegeDual(t,teamA,teamB,label){
 let rows=[],aPts=0,bPts=0;
 WTS.forEach(wt=>{
   let a=starterFor(teamA,wt),b=starterFor(teamB,wt),r=simBout(a,b,'folk'),pts=boutDualPoints(r);
   if(r.winner?.team===teamA)aPts+=pts;else if(r.winner?.team===teamB)bPts+=pts;
   rows.push({wt,a:a?.id||null,b:b?.id||null,winner:r.winner?.id||null,score:r.score,method:r.method});
   if(r.winner&&r.loser)logBout(t,wt,label,r,true)
 });
 let winner=resolveDualWinner(teamA,teamB,aPts,bPts,rows);
 return {a:teamA,b:teamB,scoreA:aPts,scoreB:bPts,winner,matches:rows,label}
}
function dualPoolStandingPoints(result){
 let d=Math.abs(result.scoreA-result.scoreB);
 return d<=5?1:d<=10?2:d<=15?3:4
}
function roundRobinPairings(ids){
 let arr=[...ids],rounds=[];
 if(arr.length%2)arr.push(null);
 for(let r=0;r<arr.length-1;r++){
   let games=[];
   for(let i=0;i<arr.length/2;i++){
     let a=arr[i],b=arr[arr.length-1-i];
     if(a&&b)games.push([a,b])
   }
   rounds.push(games);
   arr=[arr[0],arr[arr.length-1],...arr.slice(1,-1)]
 }
 return rounds
}

function dualPoolGroups(t){
 return [
   {key:'A',ids:t.poolA||[]},{key:'B',ids:t.poolB||[]},
   {key:'C',ids:t.poolC||[]},{key:'D',ids:t.poolD||[]}
 ]
}
function dualPoolTotalSessions(){return 5}
function dualPoolWinnerSeeds(t){
 let s=poolStatsFromSessions(t),
     winners=['A','B','C','D'].map(k=>s[k]?.[0]).filter(Boolean);
 return winners.sort((a,b)=>
   b.pts-a.pts || b.w-a.w ||
   ((b.pf-b.pa)-(a.pf-a.pa)) || b.pf-a.pf ||
   collegeTeamStrength(b.id)-collegeTeamStrength(a.id)
 )
}
function ensureDualPoolSemifinalSession(t){
 ensureDualPoolSessions(t);
 if(t.dualPoolSessions[3])return;
 let seeds=dualPoolWinnerSeeds(t);
 if(seeds.length<4)return;
 let games=[
   makeTournamentDualGame(seeds[0].id,seeds[3].id,'Championship Semifinal 1'),
   makeTournamentDualGame(seeds[1].id,seeds[2].id,'Championship Semifinal 2')
 ];
 games[0].playoffSeeds=[1,4];games[1].playoffSeeds=[2,3];
 t.dualPoolSessions.push({index:4,type:'semifinal',games,complete:false})
}

function ensureDualPoolFinalSession(t){
 ensureDualPoolSessions(t);
 if(t.dualPoolSessions[4])return;
 ensureDualPoolSemifinalSession(t);
 let semis=t.dualPoolSessions[3];
 if(!semis?.complete)return;
 let g1=semis.games[0],g2=semis.games[1],
     l1=g1.winner===g1.a?g1.b:g1.a,
     l2=g2.winner===g2.a?g2.b:g2.a,
     third=makeTournamentDualGame(l1,l2,'3rd Place Dual'),
     final=makeTournamentDualGame(g1.winner,g2.winner,'1st Place Dual');
 third.placementPair=[3,4];final.placementPair=[1,2];
 // Placement dual before championship dual.
 t.dualPoolSessions.push({index:5,type:'finals',games:[third,final],complete:false})
}

function ensureDualPoolSessions(t){
 if(t.dualPoolSessions)return;
 let groups=dualPoolGroups(t),
     rounds=Object.fromEntries(groups.map(g=>[g.key,roundRobinPairings(g.ids)]));
 t.dualPoolSessions=[];
 for(let r=0;r<3;r++){
   let games=[];
   groups.forEach(g=>{
     games.push(...(rounds[g.key]?.[r]||[]).map(([a,b])=>makeTournamentDualGame(a,b,`Group ${g.key} — Session ${r+1}`)))
   });
   t.dualPoolSessions.push({index:r+1,type:'roundrobin',games,complete:false})
 }
 t.dualPoolCurrentSession=1
}

function poolStatsFromSessions(t){
 let groups=dualPoolGroups(t),
     teamIds=groups.flatMap(g=>g.ids),
     stats=Object.fromEntries(teamIds.map(id=>[id,{id,pts:0,w:0,l:0,pf:0,pa:0}]));
 (t.dualPoolSessions||[]).filter(s=>s.type==='roundrobin').forEach(s=>(s.games||[]).filter(g=>g.complete).forEach(g=>{
   let A=stats[g.a],B=stats[g.b];if(!A||!B)return;
   A.pf+=g.scoreA;A.pa+=g.scoreB;B.pf+=g.scoreB;B.pa+=g.scoreA;
   let win=stats[g.winner],lose=stats[g.winner===g.a?g.b:g.a];
   if(win&&lose){win.w++;lose.l++;win.pts+=dualPoolStandingPoints({scoreA:g.scoreA,scoreB:g.scoreB})}
 }));
 let rank=ids=>ids.map(id=>stats[id]).filter(Boolean).sort((a,b)=>
   b.pts-a.pts||b.w-a.w||((b.pf-b.pa)-(a.pf-a.pa))||b.pf-a.pf||collegeTeamStrength(b.id)-collegeTeamStrength(a.id)
 );
 let out={stats};
 groups.forEach(g=>out[g.key]=rank(g.ids));
 return out
}

function simulateEntireDualPoolTournament(){
 let t=getEvent();if(!t||t.kind!=='dualPoolTournament')return;
 ensureDualPoolSessions(t);
 for(let sessionNo=1;sessionNo<=dualPoolTotalSessions()&&!t.simulated;sessionNo++){
   t.dualPoolCurrentSession=sessionNo;
   if(sessionNo===4)ensureDualPoolSemifinalSession(t);
   if(sessionNo===5)ensureDualPoolFinalSession(t);
   let s=t.dualPoolSessions[sessionNo-1];if(!s)continue;
   WTS.forEach(wt=>(s.games||[]).forEach(g=>simulateTournamentDualWeight(t,g,wt)));
   finalizeDualPoolSession(t,s)
 }
 saveGame();eventPage()
}

function finalizeDualPoolSession(t,session){
 if(!session||session.complete)return;
 if(!(session.games||[]).every(g=>g.complete))return;
 session.complete=true;

 if(session.index===3)ensureDualPoolSemifinalSession(t);
 if(session.index===4)ensureDualPoolFinalSession(t);

 if(session.index===5){
   let places={};
   session.games.forEach(g=>{
     if(!g.placementPair)return;
     places[g.winner]=g.placementPair[0];
     places[g.winner===g.a?g.b:g.a]=g.placementPair[1]
   });
   t.dualPoolData={places};
   t.simulated=true;
   let champ=Object.entries(places).find(([,p])=>p===1)?.[0];
   if(champ)rosterByTeam(champ).forEach(w=>addAccolade(w,{
     year:t.year,month:t.month,week:t.week,event:t.name,
     type:'Team Title',title:`${t.name} Champion`,team:champ
   }))
 }
}

function simulateDualPoolSessionWeight(t,wt){
 ensureDualPoolSessions(t);
 let idx=t.dualPoolCurrentSession||1;
 if(idx===4)ensureDualPoolSemifinalSession(t);if(idx===5)ensureDualPoolFinalSession(t);
 let s=t.dualPoolSessions[idx-1];if(!s)return;
 (s.games||[]).forEach(g=>simulateTournamentDualWeight(t,g,Number(wt)));
 finalizeDualPoolSession(t,s);

 // Synchronize the same session/weight across the other October dual tournaments.
 allCollegeWeekEvents(t.month,t.week,t.year)
   .filter(x=>x.e?.kind==='dualPoolTournament')
   .forEach(item=>{
     let other=ensureCollegeWeekTournament(item,t.month,t.week);
     if(!other||other.key===t.key)return;
     ensureDualPoolSessions(other);
     other.dualPoolCurrentSession=t.dualPoolCurrentSession||1;
     if(other.dualPoolCurrentSession===4)ensureDualPoolSemifinalSession(other);if(other.dualPoolCurrentSession===5)ensureDualPoolFinalSession(other);
     let os=other.dualPoolSessions[other.dualPoolCurrentSession-1];if(!os)return;
     (os.games||[]).forEach(g=>simulateTournamentDualWeight(other,g,Number(wt)));
     finalizeDualPoolSession(other,os)
   });
 saveGame()
}

function sortTable(th){
 let table=th.closest('table'),idx=[...th.parentElement.children].indexOf(th),
     body=table.tBodies.length?table.tBodies[0]:table,
     rows=[...body.rows].filter(r=>r!==th.parentElement),asc=th.dataset.asc!=='1';
 [...th.parentElement.children].forEach(h=>delete h.dataset.asc);th.dataset.asc=asc?'1':'0';
 const gradeRank={'Freshman':1,'RS Freshman':1.5,'Sophomore':2,'RS Sophomore':2.5,'Junior':3,'RS Junior':3.5,'Senior':4,'RS Senior':4.5};
 let val=r=>{
   let cell=r.cells[idx],explicit=cell?.dataset?.sort;
   if(explicit!=null&&explicit!=='')return isNaN(Number(explicit))?explicit.toLowerCase():Number(explicit);
   let t=(cell?.innerText||'').trim();
   if(gradeRank[t]!=null)return gradeRank[t];
   let rec=t.match(/^(\d+)-(\d+)$/);
   if(rec){let w=Number(rec[1]),l=Number(rec[2]);return w*1000+(w/(w+l||1))*100-l}
   let num=t.match(/^-?\d+(\.\d+)?/);
   if(num)return Number(num[0]);
   return t.toLowerCase()
 };
 rows.sort((a,b)=>{
   let x=val(a),y=val(b),d=(typeof x==='number'&&typeof y==='number')?x-y:String(x).localeCompare(String(y));
   return asc?d:-d
 });
 rows.forEach(r=>body.appendChild(r))
}

function escapeRegExpText(s){return String(s??'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function newsEntityLinkText(x){
 let text=String(x?.text||'');
 // Structured IDs are authoritative and are linked first.
 let w=x?.wrestlerId?wrestlerById(x.wrestlerId):null;
 if(w&&w.name){
   text=text.replace(new RegExp(`\\b${escapeRegExpText(w.name)}\\b`),linkW(w))
 }
 let team=x?.teamId?colleges.find(c=>c.id===x.teamId):null;
 if(team&&team.name){
   text=text.replace(new RegExp(`\\b${escapeRegExpText(team.name)}\\b`),linkT(team))
 }

 // Older feed rows often predate structured teamId/wrestlerId metadata.
 // Link exact known names in the remaining plain-text fragments only.
 let parts=text.split(/(<a\b[^>]*>.*?<\/a>)/gi);
 let candidates=[];
 allWrestlers().forEach(q=>{if(q?.name&&q.name.length>=4)candidates.push({name:q.name,html:()=>linkW(q)})});
 colleges.forEach(c=>{if(c?.name)candidates.push({name:c.name,html:()=>linkT(c)})});
 intl.forEach(c=>{if(c?.name)candidates.push({name:c.name,html:()=>nationalTeamLink(c.name)})});
 candidates.sort((a,b)=>b.name.length-a.name.length);

 for(let i=0;i<parts.length;i+=2){
   let seg=parts[i];
   candidates.forEach(c=>{
     if(!seg.includes(c.name))return;
     seg=seg.replace(new RegExp(`\\b${escapeRegExpText(c.name)}\\b`,'g'),c.html())
   });
   parts[i]=seg
 }
 return parts.join('')
}

function ensureRtcSpaceForGraduate(teamId,graduate){
 const cap=25;
 let roster=rtcPostCollegeRoster(teamId);
 if(roster.length<cap)return true;

 // A graduating alumnus is guaranteed a place in his school's RTC.
 // When full, release the weakest current post-college RTC wrestler.
 // Prefer releasing a non-alumnus when ratings are reasonably close,
 // preserving the school's own alumni whenever roster room allows.
 let schoolAlumni=w=>String(w.almaMaterId||w.lastTeamId||'')===String(teamId);
 roster.sort((a,b)=>{
   let aOwn=schoolAlumni(a),bOwn=schoolAlumni(b),
       aScore=(a.free||0)+(aOwn?2.5:0),
       bScore=(b.free||0)+(bOwn?2.5:0);
   return aScore-bScore || (a.age||99)-(b.age||99)
 });

function aiRtcGraduateDecision(w,teamId){
 if(!w||!collegeHasRTC(teamId)||!isAmericanRtcEligible(w))return false;
 const cap=25;
 let roster=rtcPostCollegeRoster(teamId),
     alumni=x=>String(x.almaMaterId||x.lastTeamId||'')===String(teamId),
     c=colleges.find(x=>String(x.id)===String(teamId)),
     rtcPrestige=c?.rtcPrestige??c?.prestige??70,
     acceptChance=Math.max(.84,Math.min(.98,.87+(rtcPrestige-70)*.003));

 // If there is room, AI generally offers its graduate a spot.
 if(roster.length<cap){
   if(Math.random()>acceptChance)return false;
   return enrollGraduateInAlmaMaterRtc(w,teamId)
 }

 // If full, compare the graduate with the weakest current post-college RTC wrestler.
 let ranked=[...roster].sort((a,b)=>
       ((a.free||0)+(alumni(a)?2.5:0))-((b.free||0)+(alumni(b)?2.5:0))
     ),
     weakest=ranked[0],
     graduateScore=(w.free||0)+2.5,
     weakestScore=(weakest?.free||0)+(weakest&&alumni(weakest)?2.5:0);

 if(weakest&&graduateScore>weakestScore&&Math.random()<=acceptChance){
   releaseRtcForRosterSpace(weakest,teamId);
   return enrollGraduateInAlmaMaterRtc(w,teamId)
 }

}

const DUAL_WEEKS=[
 {month:9,week:1},{month:9,week:2},{month:9,week:3},
 {month:10,week:1},{month:10,week:2},{month:10,week:3},
 {month:11,week:1},{month:11,week:2},{month:11,week:3},
 {month:0,week:1},{month:0,week:2},{month:0,week:4},
 {month:1,week:1},{month:1,week:2},{month:1,week:3}
];
function dualWeekIndex(m=G.month,w=G.wk){return DUAL_WEEKS.findIndex(x=>x.month===m&&x.week===w)}
function teamNameById(id){return colleges.find(c=>c.id===id)?.name||id}
function circleRounds(ids){
 let a=[...ids];if(a.length%2)a.push(null);let rounds=[];
 for(let r=0;r<a.length-1;r++){
   let pairs=[];
   for(let i=0;i<a.length/2;i++){let x=a[i],y=a[a.length-1-i];if(x&&y)pairs.push([x,y])}
   rounds.push(pairs);
   a=[a[0],a[a.length-1],...a.slice(1,a.length-1)]
 }
 return rounds
}
function ensureLeagueDualSchedule(seasonYear=currentSeasonStartYear()){
 G.leagueDualSchedules=G.leagueDualSchedules||{};
 if(G.leagueDualSchedules[seasonYear])return G.leagueDualSchedules[seasonYear];

 let weeks=DUAL_WEEKS.map((x,i)=>({slot:i+1,month:x.month,week:x.week,matches:[]}));
 let usedPairs=new Set(),matched=weeks.map(()=>new Set()),pairKey=(a,b)=>[a,b].sort().join('|');
 let confs=[...new Set(colleges.map(c=>c.conf))],confStart={},conferenceGames={};

 // Back-load each conference's complete round robin.
 confs.forEach(conf=>{
   let ids=colleges.filter(c=>c.conf===conf).sort((a,b)=>b.prestige-a.prestige).map(c=>c.id);
   let rounds=circleRounds(ids),start=Math.max(0,weeks.length-rounds.length);
   confStart[conf]=start;
   ids.forEach(id=>conferenceGames[id]=0);
   rounds.forEach((pairs,r)=>{
     let wi=start+r;
     pairs.forEach(([a,b])=>{
       weeks[wi].matches.push({a,b,conference:true,result:null});
       matched[wi].add(a);matched[wi].add(b);usedPairs.add(pairKey(a,b));
       conferenceGames[a]=(conferenceGames[a]||0)+1;conferenceGames[b]=(conferenceGames[b]||0)+1
     })
   })
 });

 // Each program gets enough non-conference duals to reach exactly 12 total.
 let need={};
 colleges.forEach(c=>need[c.id]=Math.max(0,12-(conferenceGames[c.id]||0)));

 for(let wi=0;wi<weeks.length;wi++){
   let candidates=colleges.map(c=>c.id).filter(id=>{
     let c=colleges.find(x=>x.id===id);
     return need[id]>0 && wi<(confStart[c.conf]??weeks.length) && !matched[wi].has(id)
   });

   // Teams with the most remaining games get first priority.
   candidates.sort((a,b)=>need[b]-need[a]||Math.random()-.5);

   while(candidates.length>1){
     let a=candidates.shift(),ca=colleges.find(c=>c.id===a),best=-1,bestScore=-1e9;
     for(let j=0;j<candidates.length;j++){
       let b=candidates[j],cb=colleges.find(c=>c.id===b);
       if(!cb||ca.conf===cb.conf||usedPairs.has(pairKey(a,b))||need[b]<=0)continue;
       if(wi>=(confStart[cb.conf]??weeks.length))continue;
       let score=need[b]*30 - Math.abs((ca.prestige||70)-(cb.prestige||70)) + Math.random()*12;
       if(score>bestScore){bestScore=score;best=j}
     }
     if(best<0)continue;
     let b=candidates.splice(best,1)[0];
     weeks[wi].matches.push({a,b,conference:false,result:null});
     matched[wi].add(a);matched[wi].add(b);usedPairs.add(pairKey(a,b));
     need[a]--;need[b]--
   }
 }

 // Second pass fills any rare greedy misses in earlier legal weeks.
 let guard=0;
 while(Object.values(need).some(n=>n>0)&&guard<5000){
   guard++;
   let a=Object.keys(need).filter(id=>need[id]>0).sort((x,y)=>need[y]-need[x])[0];
   if(!a)break;
   let ca=colleges.find(c=>c.id===a),placed=false;
   for(let wi=0;wi<(confStart[ca.conf]??weeks.length)&&!placed;wi++){
     if(matched[wi].has(a))continue;
     let opts=Object.keys(need).filter(b=>{
       if(b===a||need[b]<=0)return false;
       let cb=colleges.find(c=>c.id===b);
       return cb&&cb.conf!==ca.conf&&wi<(confStart[cb.conf]??weeks.length)&&!matched[wi].has(b)&&!usedPairs.has(pairKey(a,b))
     }).sort((x,y)=>need[y]-need[x]);
     if(!opts.length)continue;
     let b=opts[0];
     weeks[wi].matches.push({a,b,conference:false,result:null});
     matched[wi].add(a);matched[wi].add(b);usedPairs.add(pairKey(a,b));need[a]--;need[b]--;placed=true
   }
   if(!placed)break
 }

 G.dualScheduleWarnings=Object.entries(need).filter(([,n])=>n>0).map(([id,n])=>({id,missing:n}));
 G.leagueDualSchedules[seasonYear]=weeks;
 return weeks
}

function simulateLeagueDualWeight(match,slot,wt){
 if(!match)return;
 if(match.result?.matches?.some(x=>x.wt===wt))return;
 match.partialMatches=match.partialMatches||[];

 if(match.partialMatches.some(x=>x.wt===wt))return;

 let weeks=ensureLeagueDualSchedule(currentSeasonStartYear()),wk=weeks[slot-1],dualId=ensureLeagueDualIdentity(match,currentSeasonStartYear(),slot),
     snap=ensureDualLineupSnapshot(match),
     a=wrestlerById(snap[match.a]?.[Number(wt)]),
     b=wrestlerById(snap[match.b]?.[Number(wt)]),
     r=simBout(a,b,'folk'),pts=boutDualPoints(r),
     boutId=boutPermanentId(dualId,wt,a?.id,b?.id,WTS.indexOf(wt)),
     row={wt,a:a?.id||null,b:b?.id||null,winner:r.winner?.id||null,score:r.score,method:r.method,boutId};

 match.partialMatches.push(row);
 G.universe.bouts[boutId]={id:boutId,parentId:dualId,parentType:'dual',year:currentSeasonStartYear(),month:wk.month,week:wk.week,weight:wt,a:row.a,b:row.b,winner:row.winner,score:r.score,method:r.method,round:'Dual',style:'folk'};

 if(r.winner&&r.loser){
   addMatchResult(r.winner,r.loser,{year:currentSeasonStartYear(),month:wk.month,week:wk.week,event:'College Dual',round:'Dual',score:r.score,style:'folk'});
 }

 if(match.partialMatches.length===WTS.length){
   let aPts=0,bPts=0;
   match.partialMatches.forEach(x=>{
     let winner=wrestlerById(x.winner),v=(x.method==='Fall'||x.method==='Forfeit'||x.method==='MFOR')?6:x.method==='TF'?5:x.method==='Major'?4:3;
     if(winner?.team===match.a)aPts+=v;else if(winner?.team===match.b)bPts+=v
   });
   let winner=resolveDualWinner(match.a,match.b,aPts,bPts,match.partialMatches);
   match.result={scoreA:aPts,scoreB:bPts,matches:[...match.partialMatches],winner,tiebreak:aPts===bPts?dualTieMetrics(match.partialMatches,match.a,match.b):null};
   delete match.partialMatches;invalidatePerformanceCaches('duals');

   if(match.a===G.school||match.b===G.school){
     let e={id:'dual'+slot,name:`College Dual Window #${slot}`,kind:'dual',style:'folk'},
         key=eventKey(e,wk.month,wk.week,G.school),
         ev=G.tournaments[key]||{key,year:currentSeasonStartYear(),seasonStartYear:currentSeasonStartYear(),seasonLabel:seasonLabel(),month:wk.month,week:wk.week,...e,simulated:false,brackets:{},teamPoints:{},dual:null};
     let oriented=match.a===G.school
       ? match.result.matches
       : match.result.matches.map(x=>({...x,a:x.b,b:x.a}));
     let ownA=match.a===G.school?match.result.scoreA:match.result.scoreB,
         ownB=match.a===G.school?match.result.scoreB:match.result.scoreA;
     ev.dual={teams:[G.school,match.a===G.school?match.b:match.a],score:[ownA,ownB],matches:oriented,winner:match.result.winner,tiebreak:match.result.tiebreak};
     ev.simulated=true;
     ensureEventEditionIdentity(ev,G.school);
     G.tournaments[key]=ev
   }
 }
 ensureLeagueDualIdentity(match,currentSeasonStartYear(),slot)
}

function simulateLeagueDualMatch(m,slot){
 if(!m||m.result)return m?.result;
 if(m.partialMatches?.length){WTS.forEach(wt=>simulateLeagueDualWeight(m,slot,wt));return m.result}
 let weeks=ensureLeagueDualSchedule(currentSeasonStartYear()),wk=weeks[slot-1],dualId=ensureLeagueDualIdentity(m,currentSeasonStartYear(),slot);
 let aPts=0,bPts=0,rows=[];
 WTS.forEach((wt,bi)=>{
   let a=starterFor(m.a,wt),b=starterFor(m.b,wt),r=simBout(a,b,'folk'),pts=boutDualPoints(r);
   if(r.winner?.team===m.a)aPts+=pts;else if(r.winner?.team===m.b)bPts+=pts;
   let boutId=boutPermanentId(dualId,wt,a?.id,b?.id,bi);
   let row={wt,a:a?.id||null,b:b?.id||null,winner:r.winner?.id||null,score:r.score,method:r.method,boutId};rows.push(row);
   G.universe.bouts[boutId]={id:boutId,parentId:dualId,parentType:'dual',year:currentSeasonStartYear(),month:wk.month,week:wk.week,weight:wt,a:row.a,b:row.b,winner:row.winner,score:r.score,method:r.method,round:'Dual',style:'folk'};
   if(r.winner&&r.loser){
     let beforeW=(r.winner.matchHistory||[]).length,beforeL=(r.loser.matchHistory||[]).length;
     addMatchResult(r.winner,r.loser,{year:currentSeasonStartYear(),month:wk.month,week:wk.week,event:'College Dual',round:'Dual',score:r.score,style:'folk'});
     if(r.winner.matchHistory?.[beforeW]){r.winner.matchHistory[beforeW].boutId=boutId;r.winner.matchHistory[beforeW].dualId=dualId}
     if(r.loser.matchHistory?.[beforeL]){r.loser.matchHistory[beforeL].boutId=boutId;r.loser.matchHistory[beforeL].dualId=dualId}
   }
 });
 let winner=resolveDualWinner(m.a,m.b,aPts,bPts,rows);
 m.result={scoreA:aPts,scoreB:bPts,matches:rows,winner,tiebreak:aPts===bPts?dualTieMetrics(rows,m.a,m.b):null};invalidatePerformanceCaches('duals');
 ensureLeagueDualIdentity(m,currentSeasonStartYear(),slot);
 return m.result
}

function myRTC(){
 ensureRuntimeIndexes();
 let out=[],seen=new Set(),
     add=w=>{
       if(!w||seen.has(w.id)||!isAmericanRtcEligible(w))return;
       seen.add(w.id);out.push(w)
     };

 // Only the user's actual post-college RTC wrestlers.
 (PERF.rtcRosterIndex.get(String(G.school))||[]).forEach(add);

 // Plus eligible Americans currently on the user's college roster.
 (PERF.rosterIndex.get(String(G.school))||[]).forEach(add);

 return out
}

function lineupPool(mode){
 if(mode==='college')return myRoster().filter(w=>isCompetitionAvailable(w,'folk'));
 let pool=rtcPoolByTeam(G.school).filter(w=>isCompetitionAvailable(w,'free'));
 if(mode==='u20')return pool.filter(w=>(w.age||99)<20);
 if(mode==='u23')return pool.filter(w=>(w.age||99)<23);
 return pool
}
function lineupChart(mode){return mode==='college'?G.depthChart:mode==='u20'?G.rtcU20Lineup:mode==='u23'?G.rtcU23Lineup:G.rtcSeniorLineup}

function rtcModePool(mode,teamId=G.school){
 let pool=rtcPoolByTeam(teamId);
 if(mode==='u20')pool=pool.filter(w=>(w.age||99)<20);
 else if(mode==='u23')pool=pool.filter(w=>(w.age||99)<23);
 return pool.filter(w=>isCompetitionAvailable(w,'free'))
}
function normalizeExclusiveRtcChart(chart,mode,teamId=G.school){
 let out=Object.fromEntries(WTS.map(wt=>[wt,[]])),seen=new Set(),
     pool=rtcModePool(mode,teamId),byId=new Map(pool.map(w=>[w.id,w]));

 // Preserve each wrestler's first valid existing assignment.
 WTS.forEach(wt=>{
   (chart?.[wt]||[]).forEach(id=>{
     let w=byId.get(id);
     if(!w||seen.has(id)||!w.weights?.includes(wt))return;
     out[wt].push(id);seen.add(id)
   })
 });

 // Assign unplaced wrestlers to one eligible weight only, balancing depth a little.
 pool.filter(w=>!seen.has(w.id)).sort((a,b)=>(b.free||0)-(a.free||0)).forEach(w=>{
   let opts=(w.weights||[]).filter(wt=>WTS.includes(wt));
   if(!opts.length)return;
   let wt=[...opts].sort((a,b)=>out[a].length-out[b].length||WTS.indexOf(a)-WTS.indexOf(b))[0];
   out[wt].push(w.id);seen.add(w.id)
 });

 return out
}
function switchRtcLineupWeight(mode,id,currentWt){
 let chart=pendingRtcChart(mode),w=wrestlerById(id);
 if(!w)return;
 let opts=(w.weights||[]).filter(wt=>WTS.includes(wt));
 if(opts.length<2)return;
 currentWt=Number(currentWt);
 let target=opts.find(wt=>wt!==currentWt);
 if(target==null)return;

 // Remove from every RTC weight and move to the alternate eligible weight.
 WTS.forEach(wt=>chart[wt]=(chart[wt]||[]).filter(x=>x!==id));
 let arr=chart[target]||[];
 let insertAt=arr.findIndex(x=>(wrestlerById(x)?.free||0)<(w.free||0));
 if(insertAt<0)arr.push(id);else arr.splice(insertAt,0,id);
 chart[target]=arr;

 G.rtcLineupMode=mode;
 rtcLineup()
}
function rtcWeightSwitchArrow(w,currentWt){
 let opts=(w?.weights||[]).filter(wt=>WTS.includes(wt));
 if(opts.length<2)return '';
 let target=opts.find(wt=>wt!==Number(currentWt));
 if(target==null)return '';
 return WTS.indexOf(target)>WTS.indexOf(Number(currentWt))?'→':'←'
}
function aiExclusiveRtcAssignments(mode,teamId){
 let pool=rtcModePool(mode,teamId),starters=optimizedRtcStarterMap(mode,teamId),
     out=Object.fromEntries(WTS.map(wt=>[wt,[]])),used=new Set();

 WTS.forEach(wt=>{
   let id=starters[wt],w=id?wrestlerById(id):null;
   if(w){out[wt].push(w);used.add(w.id)}
 });

 pool.filter(w=>!used.has(w.id)).sort((a,b)=>(b.free||0)-(a.free||0)).forEach(w=>{
   let opts=(w.weights||[]).filter(wt=>WTS.includes(wt));
   if(!opts.length)return;
   let wt=[...opts].sort((a,b)=>out[a].length-out[b].length||opts.indexOf(a)-opts.indexOf(b))[0];
   out[wt].push(w);used.add(w.id)
 });
 return out
}

function initLineupChart(mode){
 if(mode==='college'){
   initDepthChart();
   return
 }
 let target=lineupChart(mode);
 let normalized=normalizeExclusiveRtcChart(target,mode,G.school);
 WTS.forEach(wt=>target[wt]=[...(normalized[wt]||[])])
}

function releaseCollegePlayer(id){
 let w=wrestlerById(id);
 if(!w||w.team!==G.school)return;
 let c=team();
 if(!confirm(`Release ${w.name} from ${c.name}? He will enter Walk-Ons / Free Agents and can sign elsewhere for up to two years.`))return;

 w.lastTeamId=w.team;
 w.lastTeam=c.name;
 w.almaMaterId=w.almaMaterId||w.collegeId||w.team;
 w.team=null;
 w.redshirtActive=false;
 markCollegeFreeAgent(w,'released');

 G.freeAgents=G.freeAgents||[];
 if(!G.freeAgents.includes(w.id))G.freeAgents.push(w.id);

 // Remove him from the user's college depth chart immediately.
 WTS.forEach(wt=>{
   if(G.depthChart?.[wt])G.depthChart[wt]=G.depthChart[wt].filter(x=>x!==w.id);
   if(G.pendingDepthChart?.[wt])G.pendingDepthChart[wt]=G.pendingDepthChart[wt].filter(x=>x!==w.id)
 });
 initDepthChart();

 addTransaction('COLLEGE RELEASE',`${w.name} was released by ${c.name} and entered the Walk-Ons / Free Agents pool.`,w);
 G.news=G.news||[];
 G.news.unshift(`${c.name} released ${w.name}. He is now a college free agent.`);
 saveGame();
 roster()
}

function cloneDepthChart(chart){
 let out={};WTS.forEach(wt=>out[wt]=[...(chart?.[wt]||[])]);return out
}
function ensurePendingCollegeLineup(){
 if(!G.pendingDepthChart){
   initDepthChart();
   G.pendingDepthChart=cloneDepthChart(G.depthChart)
 }else{
   // Normalize duplicates/invalid entries only; preserve manual ↑/↓ ordering.
   G.pendingDepthChart=normalizeExclusiveDepthChart(G.pendingDepthChart,G.school)
 }
}

function pendingStarterAt(wt){
 let ids=G.pendingDepthChart?.[wt]||[];
 return ids.map(wrestlerById).find(w=>w&&w.team===G.school&&isCompetitionAvailable(w,'folk'))||null
}
function validateCollegeLineup(chart){
 let seen=new Map(),dupes=[];
 WTS.forEach(wt=>{
   let ids=chart?.[wt]||[];
   let w=ids.map(wrestlerById).find(x=>x&&x.team===G.school&&isCompetitionAvailable(x,'folk'));
   if(!w)return;
   if(seen.has(w.id))dupes.push({w,wt1:seen.get(w.id),wt2:wt});
   else seen.set(w.id,wt)
 });
 return dupes
}
function saveCollegeLineup(){

function collegeLineup(){

 let chart=mine?G.pendingDepthChart:null;
 let aiByWt=mine?null:aiExclusiveCollegeAssignments(c.id);
 let startersByWt={};
 WTS.forEach(wt=>{
   if(mine){
     startersByWt[wt]=(chart[wt]||[]).map(wrestlerById)
       .find(x=>x&&x.team===c.id&&isCompetitionAvailable(x,'folk'))||null
   }else{

   }
 });

 let starterHeads=WTS.map(wt=>`<th>${wt}</th>`).join('');

 <p class=small>${mine?'Changes are temporary until you press Save Lineup. Dual-weight wrestlers are assigned to one weight at a time; use the sideways arrow to move them to their other eligible weight. Auto Sort orders each current weight assignment from highest to lowest Folk OVR.':'Each wrestler is assigned to only one weight in this lineup.'}</p>
 <div class=lineupsummarywrap><table class=lineupsummary><tr>${starterHeads}</tr><tr>${starterCells}</tr></table></div>

     ?(chart[wt]||[]).map(wrestlerById).filter(w=>w&&w.team===c.id&&isCompetitionAvailable(w,'folk'))
     :(aiByWt[wt]||[]);
   return `<div class="card c6"><h2>${wt} lbs</h2><table><tr><th>Depth</th><th>Wrestler</th><th>Class</th><th>Folk OVR</th>${mine?'<th>Depth Move</th><th>Weight</th>':''}</tr>${ws.map((w,i)=>{
     let switchArrow=weightSwitchArrow(w,wt);
     let target=(w.weights||[]).find(x=>x!==Number(wt));
     let switchBtn=switchArrow?`<button title="Move to ${target} lbs" onclick="switchCollegeWeight('${w.id}',${wt})">${switchArrow}</button>`:'';
     return `<tr><td>${i===0?'<span class=starterbadge>STARTER</span>':'#'+(i+1)}</td><td>${linkW(w)}</td><td>${w.year||'—'}</td><td>${ovrPill(w.folk)}</td>${mine?`<td class="lineup-depth-controls">${i>0?`<button title="Move up depth chart" onclick="moveLineupDepth('college',${wt},'${w.id}',-1)">↑</button>`:''} ${i<ws.length-1?`<button title="Move down depth chart" onclick="moveLineupDepth('college',${wt},'${w.id}',1)">↓</button>`:''}</td><td class="lineup-weight-controls">${switchBtn}</td>`:''}</tr>`
   }).join('')||`<tr><td colspan=${mine?6:4}>No eligible wrestler</td></tr>`}</table></div>`
 }).join('');

 document.getElementById('view').innerHTML=`${teamViewerBar('collegeLineup','College Program')}<div class=grid>${summary}${cards}</div>`
}

function ensurePendingRtcLineup(mode){

 let key=rtcPendingKey(mode);
 if(!G[key]){
   initLineupChart(mode);
   G[key]=cloneDepthChart(lineupChart(mode))
 }else{
   G[key]=normalizeExclusiveRtcChart(G[key],mode,G.school)
 }
}

function pendingRtcChart(mode){
 ensurePendingRtcLineup(mode);
 return G[rtcPendingKey(mode)]
}
function validateRtcLineup(chart,mode){
 let seen=new Map(),dupes=[];
 WTS.forEach(wt=>{
   let ids=chart?.[wt]||[];
   let pool=rtcPoolByTeam(G.school).filter(w=>mode==='u20'?(w.age||99)<20:mode==='u23'?(w.age||99)<23:true);
   let w=ids.map(wrestlerById).find(x=>x&&pool.some(p=>p.id===x.id)&&x.weights?.includes(wt));
   if(!w)return;
   if(seen.has(w.id))dupes.push({w,wt1:seen.get(w.id),wt2:wt});
   else seen.set(w.id,wt)
 });
 return dupes
}

 G[rtcPendingKey(mode)]=chart;

}

function assignRecruitingRanks(year=G.currentRecruitingYear||currentSeasonStartYear()){
 let classRecruits=(G.recruits||[]).filter(r=>(r.recruitClassYear??year)===year);

 // Stable overall national rank for the recruiting class.
 [...classRecruits]
   .sort((a,b)=>(b.folk||0)-(a.folk||0)||a.name.localeCompare(b.name))
   .forEach((r,i)=>r.nationalRecruitRank=i+1);

 // Stable per-weight ranks. A dual-weight recruit receives a ranking at both eligible weights.
 WTS.forEach(wt=>{
   [...classRecruits]
     .filter(r=>(r.weights||[]).map(Number).includes(Number(wt)))
     .sort((a,b)=>(b.folk||0)-(a.folk||0)||a.name.localeCompare(b.name))
     .forEach((r,i)=>{
       r.recruitWeightRanks=r.recruitWeightRanks||{};

     })
 });
 invalidateRecruitRankCache()
}

let RECRUIT_RANK_CACHE={key:null,order:[],rank:new Map()};
function recruitRankCacheKey(){
 let a=G?.recruits||[];
 // Recruit OVRs do not change during the six-week recruiting window, so length/year is
 // enough for the hot path. generateRecruitingClass() explicitly invalidates this cache.
 return `${G?.currentRecruitingYear||G?.year||0}:${a.length}`
}
function invalidateRecruitRankCache(){RECRUIT_RANK_CACHE={key:null,order:[],rank:new Map()}}
function ensureRecruitRankCache(){
 let key=recruitRankCacheKey();
 if(RECRUIT_RANK_CACHE.key===key)return RECRUIT_RANK_CACHE;

 let year=G.currentRecruitingYear||currentSeasonStartYear();
 let classRecruits=(G.recruits||[]).filter(r=>(r.recruitClassYear??year)===year);
 if(classRecruits.some(r=>!Number.isFinite(r.nationalRecruitRank)))assignRecruitingRanks(year);

 let order=[...classRecruits].sort((a,b)=>
   (a.nationalRecruitRank||9999)-(b.nationalRecruitRank||9999) ||
   (b.folk||0)-(a.folk||0) ||
   a.name.localeCompare(b.name)
 );
 let rank=new Map();
 order.forEach((r,i)=>rank.set(r.id,r.nationalRecruitRank||i+1));
 RECRUIT_RANK_CACHE={key,order,rank};
 return RECRUIT_RANK_CACHE
}

function nationalRecruitOrder(){return ensureRecruitRankCache().order}
function recruitNationalRank(r){
 if(!r)return 9999;
 if(Number.isFinite(r.nationalRecruitRank))return r.nationalRecruitRank;
 let found=ensureRecruitRankCache().rank.get(r.id);
 if(Number.isFinite(found))return found;
 assignRecruitingRanks(r.recruitClassYear??G.currentRecruitingYear??G.year);
 return r.nationalRecruitRank||ensureRecruitRankCache().rank.get(r.id)||9999
}

function classScore(list){
 let vals=[...list].sort((a,b)=>b.folk-a.folk).slice(0,8);
 return vals.reduce((s,r,i)=>{let rank=recruitNationalRank(r),elite=Math.max(0,35-rank)*.32;return s+Math.pow(Math.max(1,r.folk-52),1.22)+elite*(1-i*.04)},0)
}

 return classes
}

function walkonOfferInterest(w,c){
 let prox=w.state?stateProximity(c.state,w.state):50;
 let need=teamWeightNeed(w,c);
 let opp=startingOpportunity(w,c);
 let prestige=c.prestige||70;
 let oldTeam=w.lastTeamId?colleges.find(x=>x.id===w.lastTeamId):null;
 let oldPrestige=oldTeam?.prestige||60;

 // Free agents care about program quality, opportunity, need, geography,
 // and whether the move is an upgrade from their previous situation.
 let score=prestige*.34+opp*.25+need*.20+prox*.13+Math.max(-8,Math.min(10,(prestige-oldPrestige)*.18));
 return score
}
function resolveUserWalkonOffers(){
 let c=team();
 if(!c)return;
 let offered=(G.wrestlers||[]).filter(w=>w.freeAgent&&!w.team&&(w.offers||[]).includes(G.school));

 offered.forEach(w=>{
   // If the user ran out of roster/signing room, leave the offer pending instead of deleting it.
   if(myRoster().length>=25||annualSigningSlots(G.school)<=0)return;

   let interest=walkonOfferInterest(w,c),
       // Free agents can negotiate all season; longer-pending offers become slightly more likely.
       offeredWeeks=Number(w.freeAgentOfferWeeks?.[G.school]||0),
       weekBoost=Math.min(20,offeredWeeks*4),
       chance=Math.max(.08,Math.min(.92,(interest+weekBoost-42)/58));
   w.freeAgentOfferWeeks=w.freeAgentOfferWeeks||{};
   w.freeAgentOfferWeeks[G.school]=offeredWeeks+1;

   // Higher-quality free agents are somewhat more selective.
   if((w.folk||0)>=85)chance*=.78;
   else if((w.folk||0)>=80)chance*=.88;

   if(Math.random()<chance){
     w.lastTeamId=w.lastTeamId||null;
     w.team=G.school;
     w.freeAgent=false;
     w.freeAgentType=null;
     w.freeAgentSinceYear=null;
     w.releasedYear=null;
     w.walkonSinceYear=null;
     w.signedTeamId=G.school;
     w.signedYear=(G.currentRecruitingYear||currentSeasonStartYear());
     w.collegeId=G.school;
     w.almaMaterId=G.school;
     w.recruitYear=G.currentRecruitingYear||currentSeasonStartYear();
     w.offers=[];
     if(w.freeAgentOfferWeeks)delete w.freeAgentOfferWeeks[G.school];
     if(!w.year||w.year==='Recruit')w.year='Freshman';
     G.freeAgents=(G.freeAgents||[]).filter(x=>x!==w.id);
     let msg=`SIGNED FREE AGENT: ${w.name} (${w.weights.join('/')} lbs, ${w.folk} OVR) accepted your offer to join ${c.name}.`;
     G.news.unshift(msg);queueNotification(msg);
     addTransaction('COLLEGE SIGNING',`${w.name} signed with ${c.name} from the free-agent pool.`,w);
     initDepthChart()
   }else{
     // Same rhythm as normal recruiting: most offers remain live week to week.
     // A small percentage explicitly decline and free the offer slot.
     let declineChance=Math.max(.04,Math.min(.35,(55-interest)/90));
     if(Math.random()<declineChance){
       w.offers=(w.offers||[]).filter(id=>id!==G.school);
       if(w.freeAgentOfferWeeks)delete w.freeAgentOfferWeeks[G.school];
       let msg=`${w.name} declined ${c.name}'s free-agent offer.`;
       G.news.unshift(msg);queueNotification(msg)
     }
   }
 })
}


function withdrawWalkonOffer(id){

function offerWalkon(id){

 w.offers=w.offers||[];

 }
 saveGame();walkons()
}

function pathTier(r,c){
 let s=startingOpportunity(r,c);
 if(s>=80)return {label:'Excellent',rank:4,score:s};
 if(s>=60)return {label:'Good',rank:3,score:s};
 if(s>=40)return {label:'Crowded',rank:2,score:s};
 return {label:'Very Crowded',rank:1,score:s}
}

function userRecruitPrestigeFactor(r,c){
 if(!c||c.id!==G.school)return 1;
 let gap=(r.folk||0)-(c.prestige||0);
 if(gap<=2)return 1;
 if(gap<=5)return .90;
 if(gap<=8)return .78;
 if(gap<=12)return .62;
 if(gap<=16)return .45;
 if(gap<=20)return .30;
 if(gap<=25)return .18;
 return .08
}
function userRecruitCanCommit(r,c){
 if(!c||c.id!==G.school)return true;
 let factor=userRecruitPrestigeFactor(r,c);
 if(factor>=1)return true;

 // The mismatch gets somewhat easier late in the cycle, but never becomes automatic.
 let rw=Math.max(1,recruitingWeekNumber());
 let lateBoost=[.72,.78,.84,.90,.96,1][Math.min(5,rw-1)]||1;
 return Math.random()<Math.min(.95,factor*lateBoost)
}

function prestigeFitModifier(r,c){
 let diff=c.prestige-r.folk;
 if(diff<=-22)return .74;
 if(diff<=-15)return .82;
 if(diff<=-8)return .91;
 if(diff>=20)return 1.08;
 if(diff>=12)return 1.05;
 if(diff>=6)return 1.02;
 return 1
}

function interestLabel(r,c){
 let p=pathTier(r,c),fit=prestigeFitModifier(r,c);
 let fitTxt=fit<=.75?' • Prestige mismatch':fit<.95?' • Prestige concern':fit>=1.08?' • Prestige boost':'';
 return p.label+fitTxt
}
function classIndex(y){return {Freshman:0,'RS Freshman':0,Sophomore:1,'RS Sophomore':1,Junior:2,'RS Junior':2,Senior:3,'RS Senior':3}[y]??0}
function startingOpportunity(r,c){
 let cache=ensureRecruitAICache(),best=0;
 (r.weights||[]).forEach(wt=>{
   let key=`${c.id}:${wt}:${r.id}`;
   if(cache.opportunity.has(key)){best=Math.max(best,cache.opportunity.get(key));return}
   let x=cache.weightNeed.get(`${c.id}:${wt}`),returning=x?.returning||[];
   let blockers=returning.filter(w=>classIndex(w.year)<=1)
     .map(w=>w.folk+(w.year==='Freshman'?5:3)).sort((a,b)=>b-a);
   let proj=(r.folk||65)+6,rank=1+blockers.filter(v=>v>proj).length;
   let sc=rank===1?100:rank===2?72:rank===3?42:18;
   cache.opportunity.set(key,sc);best=Math.max(best,sc)
 });
 return best||100
}

function completedCollegeDualGames(seasonYear=currentSeasonStartYear()){
 let cacheKey=`${PERF.dualEpoch}|${seasonYear}`;if(PERF.completedDualGames.has(cacheKey))return PERF.completedDualGames.get(cacheKey);
 let out=[],seen=new Set(),add=(g,meta={})=>{
   if(!g?.complete&&!g?.result)return;
   let a=g.a,b=g.b;if(!a||!b)return;
   let scoreA=g.scoreA??g.result?.scoreA,scoreB=g.scoreB??g.result?.scoreB;if(scoreA==null||scoreB==null)return;
   let winner=g.winner||g.result?.winner||(scoreA>scoreB?a:b),key=meta.key||`${a}|${b}|${scoreA}|${scoreB}|${meta.label||''}`;
   if(seen.has(key))return;seen.add(key);out.push({a,b,scoreA,scoreB,winner,matches:g.matches||g.result?.matches||[],seasonStartYear:seasonYear,...meta})
 };
 let weeks=G.leagueDualSchedules?.[seasonYear]||[];
 weeks.forEach((wk,wi)=>(wk.matches||[]).forEach(m=>{if(m.result){let id=ensureLeagueDualIdentity(m,seasonYear,wi+1);add({a:m.a,b:m.b,result:m.result},{type:'scheduled',month:wk.month,week:wk.week,label:m.conference?'Conference Dual':'Non-Conference Dual',dualId:id,key:`league:${id}`})}}));
 Object.entries(G.tournaments||{}).forEach(([eventKey,ev])=>{
   if(eventSeasonStartYear(ev)!==seasonYear||ev.style!=='folk')return;
   if(ev.kind==='dualPoolTournament')(ev.dualPoolSessions||[]).forEach((s,si)=>(s.games||[]).forEach((g,gi)=>{if(g.complete)add(g,{type:'tournament',eventKey,eventName:ev.name,month:ev.month,week:ev.week,label:g.label||`Session ${si+1}`,key:`${eventKey}:pool:${si}:${gi}`})}));
   else if(ev.id==='dualnat'||ev.kind==='dualTournament')(ev.dualNatState?.rounds||[]).forEach((rd,ri)=>(rd.games||[]).forEach((g,gi)=>{if(g.complete)add(g,{type:'tournament',eventKey,eventName:ev.name,month:ev.month,week:ev.week,label:g.label||rd.label,key:`${eventKey}:dn:${ri}:${gi}`})}))
 });
 PERF.completedDualGames.set(cacheKey,out);return out
}

 let games=completedCollegeDualGames(year).filter(g=>!excludeEventKey||g.eventKey!==excludeEventKey),
