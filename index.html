       let tg=games.filter(g=>g.a===c.id||g.b===c.id),w=0,l=0,pf=0,pa=0;
       tg.forEach(g=>{
         let own=g.a===c.id?g.scoreA:g.scoreB,opp=g.a===c.id?g.scoreB:g.scoreA;
         pf+=own;pa+=opp;if(g.winner===c.id)w++;else l++
       });
       return {id:c.id,w,l,pct:(w+l)?w/(w+l):0,sos:dualStrengthOfSchedule(c.id,tg),ovr:dualGameTeamStrength(c.id),pf,pa}
     });
 rows.sort((a,b)=>{
   if(b.pct!==a.pct)return b.pct-a.pct;
   if(Math.abs(b.sos-a.sos)>.0001)return b.sos-a.sos;
   let h=dualHeadToHeadWinner(a.id,b.id,games);
   if(h)return h===a.id?-1:1;
   if(b.ovr!==a.ovr)return b.ovr-a.ovr;
   return b.w-a.w||a.id.localeCompare(b.id)
 });
 return rows
}

function dualMetricsByTeam(seasonYear=currentSeasonStartYear()){

 });
 m.forEach(r=>{r.pct=(r.w+r.l)?r.w/(r.w+r.l):0;r.sos=r.oppCount?r.oppStrengthSum/r.oppCount:0});

function rankingLevelLabel(level){

function wrestlerFreestyleRankingWeight(w,level){
 if(!w)return null;
 let opts=(w.weights||[]).map(Number).filter(wt=>WTS.includes(wt));
 if(!opts.length)return null;
 let label=rankingLevelLabel(level);

 // USA: use the wrestler's SAVED RTC lineup assignment when one exists.
 if(w.country==='USA'){
   let rtcId=w.rtcTeamId||w.team;
   if(rtcId){
     let chart;
     if(rtcId===G.school){
       chart=level==='u20'?G.rtcU20Lineup:level==='u23'?G.rtcU23Lineup:G.rtcSeniorLineup
     }
     if(chart){
       for(let wt of WTS)if((chart[wt]||[]).includes(w.id)&&opts.includes(wt))return wt
     }
   }
 }

 // Any nation: if he is the officially selected national starter, that assignment wins.
 let ct=intl.find(c=>c.name===w.country);
 if(ct){
   for(let wt of WTS){
     let selected=nationalStarter(ct.id,label,wt,currentSeasonStartYear());
     if(selected?.id===w.id&&opts.includes(wt))return wt
   }
 }

 // Otherwise a dual-weight wrestler has one rankings home: his primary listed weight.
 return opts[0]
}

 return `bout_${uidSlug(parentId)}_${wt}_${wrestlers}_${seq}`

function ensureLeagueDualIdentity(m,seasonYear=currentSeasonStartYear(),slot){
 ensureMatchRegistry();
 seasonYear=Number(seasonYear);
 let weeks=ensureLeagueDualSchedule(seasonYear),
     wk=weeks?.[slot-1],
     month=wk?.month??0,week=wk?.week??slot,
     canonical=dualPermanentId(seasonYear,month,week,m.a,m.b,m.conference?'conference':'nonconference'),
     oldId=m.dualId;

 if(oldId&&oldId!==canonical&&G.universe.duals?.[oldId]){
   let old=G.universe.duals[oldId],cur=G.universe.duals[canonical]||{};
   G.universe.duals[canonical]={...old,...cur,id:canonical,year:seasonYear,seasonStartYear:seasonYear,seasonLabel:seasonLabel(seasonYear),month,week,a:m.a,b:m.b,conference:!!m.conference,type:'college'};
   delete G.universe.duals[oldId]
 }
 m.dualId=canonical;

 let d=G.universe.duals[canonical]||{};
 Object.assign(d,{
   id:canonical,year:seasonYear,seasonStartYear:seasonYear,seasonLabel:seasonLabel(seasonYear),
   month,week,a:m.a,b:m.b,conference:!!m.conference,result:m.result||d.result||null,type:'college'
 });
 // If one side has the result and the other does not, synchronize immediately.
 if(!m.result&&d.result)m.result=d.result;
 if(m.result&&!d.result)d.result=m.result;

 G.universe.duals[canonical]=d;

 if(m.result?.matches){
   m.result.matches.forEach((x,i)=>{
     x.boutId=x.boutId||boutPermanentId(canonical,x.wt,x.a,x.b,i);
     G.universe.bouts[x.boutId]={id:x.boutId,parentId:canonical,parentType:'dual',year:seasonYear,month,week,weight:x.wt,a:x.a,b:x.b,winner:x.winner,score:x.score,method:x.method,style:'folk'}
   })
 }
 return canonical
}

function ensureTournamentBoutIds(t){
 ensureMatchRegistry();ensureEventEditionIdentity(t,t.hostTeamId||G.school);
 Object.entries(t.brackets||{}).forEach(([wt,b])=>(b.matches||[]).forEach((m,i)=>{

function completedSeasonYears(){
 let ys=new Set([currentSeasonStartYear()]);
 Object.values(G.tournaments||{}).forEach(ev=>ys.add(eventSeasonStartYear(ev)));
 allWrestlers().forEach(w=>(w.matchHistory||[]).forEach(m=>{
   let sy=matchSeasonStartYear(m);if(sy!=null)ys.add(sy)
 }));
 Object.values(G.teamSeasons?.college||{}).forEach(by=>Object.keys(by||{}).forEach(y=>ys.add(Number(y))));
 Object.values(G.teamSeasons?.rtc||{}).forEach(by=>Object.keys(by||{}).forEach(y=>ys.add(Number(y))));
 Object.values(G.teamSeasons?.intl||{}).forEach(by=>Object.keys(by||{}).forEach(y=>ys.add(Number(y))));
 return [...ys].filter(Number.isFinite).sort((a,b)=>b-a)
}

function seasonChampionRows(seasonYear){
 if(!PERF.historyBySeason){
   PERF.historyBySeason=new Map();
   Object.values(G.tournaments||{}).forEach(ev=>{
     if(!ev?.simulated)return;
     let sy=eventSeasonStartYear(ev);
     if(!PERF.historyBySeason.has(sy))PERF.historyBySeason.set(sy,[]);
     PERF.historyBySeason.get(sy).push(ev)
   });
   PERF.historyBySeason.forEach(arr=>arr.sort((a,b)=>a.year-b.year||a.month-b.month||a.week-b.week))
 }
 let ts=PERF.historyBySeason.get(seasonYear)||[];
 if(!ts.length)return '<tr><td colspan=3 class=small>No completed tournaments stored for this season yet.</td></tr>';
 return ts.map(ev=>{
   let champs=[];
   if(ev.kind==='tournament'){
     WTS.forEach(wt=>{let id=ev.brackets?.[wt]?.placements?.[0],w=wrestlerById(id);if(w)champs.push(`${wt}: ${linkW(w)}`)})
   }else if(ev.dualBracket?.length){
     let id=ev.dualBracket[ev.dualBracket.length-1]?.[0]?.winner;if(id)champs.push(teamLinkById(id))
   }else if(ev.dual?.teams){
     let wi=ev.dual.score[0]>=ev.dual.score[1]?0:1;champs.push(teamLinkById(ev.dual.teams[wi]))
   }
   return `<tr><td><a class=eventlink onclick="G.currentEventKey='${ev.key}';G.eventMonth=${ev.month};G.eventWeek=${ev.week};G.view='event';render()">${ev.name}</a></td><td>${monthNames[ev.month]} ${seasonLabel(eventSeasonStartYear(ev))} W${ev.week}</td><td>${champs.join('<br>')||'—'}</td></tr>`
 }).join('')
}

function careerRecordLeaders(style){
 let rows=allWrestlers().map(w=>{
   let logs=w.matchHistory||[],x=style==='combined'?logs:logs.filter(m=>matchStyle(m)===style);
   return {w,win:x.filter(m=>m.result==='W').length,loss:x.filter(m=>m.result==='L').length}
 }).filter(x=>x.win||x.loss).sort((a,b)=>b.win-a.win||a.loss-b.loss||a.w.name.localeCompare(b.w.name)).slice(0,20);
 return rows.map((x,i)=>`<tr><td>${i+1}</td><td>${linkW(x.w)}</td><td>${wrestlerAffiliation(x.w)}</td><td><b><a onclick="showCareerRecordStyle('${x.w.id}','${style}')">${x.win}-${x.loss}</a></b></td></tr>`).join('')||'<tr><td colspan=4 class=small>No recorded matches yet.</td></tr>'
}
function countAccolades(w,pred){return (w.accolades||[]).filter(pred).length}
function medalCounts(w,pred){
 let a=(w.accolades||[]).filter(pred);
 return {gold:a.filter(x=>x.place===1).length,silver:a.filter(x=>x.place===2).length,bronze:a.filter(x=>x.place===3).length,total:a.filter(x=>[1,2,3].includes(x.place)).length}
}
function medalTableRows(kind){
 let rows=allWrestlers().map(w=>{
   let m=kind==='folk'
     ?medalCounts(w,a=>a.type==='College Medal'&&[1,2,3].includes(a.place))
     :medalCounts(w,a=>['U.S. Open','World Medal','Continental Medal','Freestyle'].includes(a.type)&&[1,2,3].includes(a.place));
   return {w,...m}
 }).filter(x=>x.total).sort((a,b)=>b.gold-a.gold||b.silver-a.silver||b.bronze-a.bronze||a.w.name.localeCompare(b.w.name)).slice(0,20);
 return rows.map((x,i)=>`<tr><td>${i+1}</td><td>${linkW(x.w)}</td><td>${x.gold}</td><td>${x.silver}</td><td>${x.bronze}</td><td><b>${x.total}</b></td></tr>`).join('')||'<tr><td colspan=6 class=small>No medals recorded yet.</td></tr>'
}
function honorLeaderboardRows(type){
 let pred;
 if(type==='ncaaTitles')pred=a=>a.event==='NCAA Individual Championships'&&a.place===1;
 else if(type==='worldTitles')pred=a=>a.event==='Senior World Championships'&&a.place===1;
 else if(type==='u20WorldMedals')pred=a=>a.event==='U20 World Championships'&&[1,2,3].includes(a.place); else if(type==='u23WorldMedals')pred=a=>a.event==='U23 World Championships'&&[1,2,3].includes(a.place);
 else if(type==='ncaaAA')pred=a=>a.type==='All-American'&&a.event==='NCAA Individual Championships'&&a.place<=8;
 else if(type==='seniorUSAA')pred=a=>a.event==='Senior U.S. Open'&&a.place<=5; // current UWW bracket stores 1,2,3,3,5,5 = top six placers
 else if(type==='u20USAA')pred=a=>a.event==='U20 U.S. Open'&&a.place<=5; else if(type==='u23USAA')pred=a=>a.event==='U23 U.S. Open'&&a.place<=5;
 else if(type==='allWorld')pred=a=>a.event==='Senior World Championships'&&a.place<=5;
 else pred=()=>false;
 let rows=allWrestlers().map(w=>({w,n:countAccolades(w,pred)})).filter(x=>x.n).sort((a,b)=>b.n-a.n||a.w.name.localeCompare(b.w.name)).slice(0,20);
 return rows.map((x,i)=>`<tr><td>${i+1}</td><td>${linkW(x.w)}</td><td>${wrestlerAffiliation(x.w)}</td><td><b>${x.n}</b></td></tr>`).join('')||'<tr><td colspan=4 class=small>No honors recorded yet.</td></tr>'
}
function continentalChampionRows(continent){
 let eventName=continent==='Americas'?'Senior Continental Championships':'Senior Continental Championships';
 let rows=allWrestlers().filter(w=>{
   let ct=intl.find(c=>c.name===w.country);return ct&&ct.continent===continent
 }).map(w=>({w,n:countAccolades(w,a=>a.event===eventName&&a.level==='Senior'&&a.place===1)})).filter(x=>x.n).sort((a,b)=>b.n-a.n||a.w.name.localeCompare(b.w.name)).slice(0,20);
 return rows.map((x,i)=>`<tr><td>${i+1}</td><td>${linkW(x.w)}</td><td>${nationalTeamLink(w.country)}</td><td><b>${x.n}</b></td></tr>`).join('')||'<tr><td colspan=4 class=small>No champions recorded yet.</td></tr>'
}

function rankingRecordLink(w,style,seasonYear=currentSeasonStartYear()){
 let rec=styleSeasonRecord(w,style,seasonYear);
 return `<a onclick="showRecord('${w.id}')">${rec.wins}-${rec.losses}</a>`
}

function recordLink(w){
 let rec=w.record||{w:0,l:0};
 return `<a onclick="showRecord('${w.id}')">${rec.w}-${rec.l}</a>`
}
function recordRowsHTML(w,logs,yr,styleLabel){
 return logs.length?logs.map(m=>{
   let opp=allWrestlers().find(x=>x.id===m.opponentId),oppName=opp?rankedWrestlerRecordLink(opp,m):(m.opponentName||'Unknown');
   let oppTeam;
   if(matchStyle(m)==='folk'){
     let c=m.opponentTeamId?colleges.find(c=>c.id===m.opponentTeamId):null;
     oppTeam=c?rankedOpponentTeamRecordLink(c,m):(m.opponentTeam||'—');
   }else{
     let country=m.opponentCountry||opp?.country||m.opponentTeam||'USA';
     if(country==='USA'){
       let usaLink=nationalTeamLink('USA');
       let rtcId=m.opponentRtcTeamId||freestyleRtcAffiliationId(opp)||null;
       let rtc=rtcId?colleges.find(c=>c.id===rtcId):null;
       let rtcText=rtc?`<a onclick="G.viewRTCId='${rtc.id}';G.view='rtc';render()">${rtcDisplayName(rtc)}</a>`:'Unattached';
       oppTeam=`${usaLink} / ${rtcText}`;
     }else{
       oppTeam=nationalTeamLink(country);
     }
   }
   let bout=findBoutForLog(w,m),matchWt=m.weight||m.wt||bout?.weight||bout?.wt||'—',score=bout?`<a onclick="showBout('${bout.id}')">${m.score||bout.score||'Bout'}</a>`:(m.score||'—');
   let eventText=m.event||'Dual Meet';
   let eventLink=eventText;
   if(m.dualId&&G.universe?.duals?.[m.dualId])eventLink=`<a onclick="showDualById('${m.dualId}')">${eventText}</a>`;
   else if(m.eventEditionId){
     let a=G.universe?.eventEditions?.[m.eventEditionId];
     if(a?.key)eventLink=`<a onclick="G.currentEventKey='${a.key}';G.eventMonth=${a.month};G.eventWeek=${a.week};G.view='event';render()">${eventText}</a>`
   }else if(m.eventSeriesId)eventLink=`<a onclick="showEventSeries('${m.eventSeriesId}')">${eventText}</a>`;

   let snapshot=m.opponentOvr;
   let fallback=snapshot==null&&opp?(matchStyle(m)==='folk'?(opp.folk||0):(opp.free||0)):null;
   let oppOvr=snapshot!=null?ovrPill(snapshot):(fallback!=null?`${ovrPill(fallback)}<span class=small title="Older match: current OVR shown because no historical snapshot was stored">*</span>`:'—');

   let rowClass=m.result==='W'?'record-win-row':m.result==='L'?'record-loss-row':'';
   return `<tr class="${rowClass}"><td>${m.date||monthNames[(m.month??G.month)]+' W'+(m.week??G.wk)}</td><td>${oppName}</td><td>${oppOvr}</td><td>${matchWt}</td><td>${oppTeam}</td><td>${eventLink}</td><td>${m.round||'—'}</td><td>${matchStyle(m)==='folk'?'Folk':'Free'}</td><td><b>${m.result||''}</b></td><td>${score}</td></tr>`
 }).join(''):`<tr><td colspan=10 class=small>No ${styleLabel.toLowerCase()} matches recorded for ${yr}.</td></tr>`
}

function invalidatePerformanceCaches(scope='all'){

   PERF.pendingInvalidations.add(scope);

}
function beginPerformanceBatch(){
 PERF.batchDepth++;
 if(PERF.batchDepth===1){PERF.batchStartedAt=performance.now?.()||Date.now();PERF.metrics.batches++}
}
function flushPerformanceBatchInvalidations(){
 if(!PERF.pendingInvalidations.size)return;
 let scopes=[...PERF.pendingInvalidations];
 PERF.pendingInvalidations.clear();
 if(scopes.includes('all'))applyPerformanceInvalidation('all');
 else scopes.forEach(applyPerformanceInvalidation);
 PERF.metrics.flushes++
}
function endPerformanceBatch(){
 if(PERF.batchDepth<=0){PERF.batchDepth=0;flushPerformanceBatchInvalidations();return}
 PERF.batchDepth--;
 if(PERF.batchDepth===0)flushPerformanceBatchInvalidations()
}
function runPerformanceBatch(fn){

}

function ensureRuntimeIndexes(){
 let all=allWrestlers(),
     sig=`${PERF.sourceSignature}|${PERF.universeEpoch}`;
 if(PERF.rosterIndex&&PERF.rtcRosterIndex&&PERF.countryIndex&&PERF.weightIndex&&PERF.wrestlerMap&&PERF.indexSignature===sig)return;
 let started=performance.now?.()||Date.now(),
     roster=new Map(),rtc=new Map(),countries=new Map(),weights=new Map();

 WTS.forEach(wt=>weights.set(Number(wt),[]));
 colleges.forEach(c=>{roster.set(String(c.id),[]);rtc.set(String(c.id),[])});

 all.forEach(w=>{
   if(!w)return;
   if(w.team){
     let k=String(w.team);if(!roster.has(k))roster.set(k,[]);
     roster.get(k).push(w)
   }
   if(w.rtcTeamId&&!w.team&&isAmericanRtcEligible(w)){
     let k=String(w.rtcTeamId);if(!rtc.has(k))rtc.set(k,[]);
     rtc.get(k).push(w)

   let country=w.country||'USA';

   countries.get(country).push(w);
   (w.weights||[]).forEach(wt=>{
     wt=Number(wt);if(!weights.has(wt))weights.set(wt,[]);
     weights.get(wt).push(w)
   })
 });
 PERF.rosterIndex=roster;PERF.rtcRosterIndex=rtc;PERF.countryIndex=countries;PERF.weightIndex=weights;PERF.indexSignature=sig;
 PERF.metrics.indexBuilds++;
 PERF.metrics.lastIndexBuildMs=(performance.now?.()||Date.now())-started
}

 let seen=new Set(),
     arr=[...(G.wrestlers||[]),...(G.intlWrestlers||[]),...(G.rtc||[]),...(G.retiredWrestlers||[]),...(G.recruits||[])];

}

function addAccolade(w,a){
 if(!w)return;
 w.accolades=w.accolades||[];
 let sy=a.seasonStartYear??currentSeasonStartYear(),
     x={
       year:a.year??currentSeasonStartYear(),
       seasonStartYear:sy,
       seasonLabel:a.seasonLabel||seasonLabel(sy),
       event:a.event||'',
       level:a.level||'',
       weight:a.weight||null,
       place:a.place||null,
       type:a.type||'Achievement',
       title:a.title||'',
       team:a.team||null,
       month:a.month??null,
       week:a.week??null,
       awardMonth:a.awardMonth??null,
       awardWeek:a.awardWeek??null
     };

 // If an event was recorded before month/week were explicitly attached, infer it
 // from the actual saved event. This also helps historical chronology.
 if(x.month==null||x.week==null){
   let target=accoladeEventTarget(x);
   if(target?.kind==='event'){
     x.month=target.ev.month;
     x.week=target.ev.week
   }
 }

 if(!w.accolades.some(q=>accoladeKey(q)===accoladeKey(x)))w.accolades.push(x)
}


function folkPlaceLabel(p){return p===1?'Champion':p===2?'Runner-Up':p===3?'3rd Place':`${p}th Place`}
function freePlaceLabel(p){return p===1?'Gold Medal':p===2?'Silver Medal':p===3?'Bronze Medal':`${p}th Place`}
function recordTournamentAccolades(t,wt){
 let b=t?.brackets?.[wt];if(!b||!b.placements)return;

 if(t.style==='folk'){
   // Everyone who reaches the NCAA bracket is a national qualifier.
   if(t.id==='ncaa'){
     let ids=new Set();
     (b.matches||[]).forEach(m=>{if(m.a)ids.add(m.a);if(m.b)ids.add(m.b)});
     ids.forEach(id=>{let w=wrestlerById(id);if(w)addAccolade(w,{
       year:t.year,month:t.month,week:t.week,awardMonth:2,awardWeek:3,
       event:t.name,weight:wt,type:'NCAA Qualifier',title:'NCAA National Championship Qualifier'
     })});
   }

   b.placements.forEach((id,i)=>{
     let w=wrestlerById(id),p=i+1;if(!w)return;

     if(t.id==='ncaa'){
       // ONE NCAA placement accolade only.
       // Top 8 are All-Americans; the champion distinction is encoded in that same row.
       if(p<=8){
         let title=p===1?'NCAA Champion':`College All-American — ${folkPlaceLabel(p)}`;
         addAccolade(w,{
           year:t.year,month:t.month,week:t.week,event:t.name,weight:wt,place:p,
           type:'College All-American',title
         })
       }
       return
     }

     // Other college tournaments / conference championships: podium medal only.
     if(p<=3){
       let medal=p===1?'Gold':p===2?'Silver':'Bronze';
       addAccolade(w,{
         year:t.year,month:t.month,week:t.week,event:t.name,weight:wt,place:p,
         type:'College Medal',title:`${t.name} — ${medal} Medal`
       })
     }
   })
 }else{
   let level=t.level==='U20'?'U20':t.level==='U23'?'U23':'Senior';

   // Continental championships:
   // DAY 1 is the ONLY actual continental championship and determines medals/titles.
   // Day 2 and Last Chance are qualification-only and never award medals or championship accolades.
   if(['srcont','u23cont','u20cont'].includes(t.id)){
     Object.entries(t.continentBrackets?.[wt]||{}).forEach(([continent,cb])=>{
       let day1=cb?.day1||cb,
           places=[1,2,3,3,5,5];

       (day1?.placements||[]).slice(0,6).forEach((id,i)=>{
         let w=wrestlerById(id),p=places[i];if(!w||p>3)return;
         addAccolade(w,{
           year:t.year,month:t.month,week:t.week,event:t.name,level,weight:wt,place:p,
           type:'Continental Medal',
           title:p===1
             ?`${level} ${continent} Champion`
             :`${level} ${continent} Championships — ${freePlaceLabel(p)}`
         })
       });

       (cb?.qualifiers||[]).forEach(id=>{
         let w=wrestlerById(id);
         if(w)addAccolade(w,{
           year:t.year,month:t.month,week:t.week,event:t.name,level,weight:wt,
           type:'World Qualifier',title:`Qualified for ${level} World Championships`
         })
       })
     });

     // LCQ qualifiers are World Qualifiers only—never medalists.
     (t.lastChance?.[wt]?.qualifiers||[]).forEach(id=>{
       let w=wrestlerById(id);
       if(w)addAccolade(w,{
         year:t.year,month:t.month,week:t.week,event:t.name,level,weight:wt,
         type:'World Qualifier',title:`Qualified for ${level} World Championships`
       })
     });
     return
   }

   let places=[1,2,3,3,5,5];
   b.placements.slice(0,6).forEach((id,i)=>{
     let w=wrestlerById(id),p=places[i];if(!w)return;
     let isWorld=['worlds','u23worlds','u20worlds'].includes(t.id);
     let isUS=['usopen','u23us','u20us'].includes(t.id);
     let type=isWorld?'World Placement':isUS?'U.S. Open':'Freestyle Medal';

     // Preserve one exact chronological result. Ranking Series event names already begin with
     // their single YYYY season-start year, so never prepend another year here.
     let accoladeEvent=t.kind==='rankingSeries'
       ?String(t.name||'').replace(/^(\d{4})\s+\1\s+/,'$1 ')
       :t.name;
     // ONE placement accolade per tournament finish.
     // World finishes use the All-World type directly, so the same row powers both
     // the chronological result and career All-World counts.
     let placementType=isWorld?'All-World':type;
     addAccolade(w,{
       year:t.year,month:t.month,week:t.week,event:accoladeEvent,level,weight:wt,place:p,
       type:placementType,title:`${accoladeEvent} — ${freePlaceLabel(p)}`
     });
     if(isWorld&&p===1){
       G.worldChampionNews=G.worldChampionNews||{};
       let nk=`${eventSeasonStartYear(t)}|${t.id}|${wt}|${w.id}`;
       if(!G.worldChampionNews[nk]){
         addNewsFeed('WORLD CHAMPION',`${w.name} (${countryDisplayName(w.country)}) won the ${level} World Championship at ${wt} lbs.`,{wrestlerId:w.id,eventKey:t.key,importance:3});
         G.worldChampionNews[nk]=true
       }
     }
   })
 }

}

function isInSeasonCollegeEventAccolade(a){
 let ev=String(a?.event||''),
     title=String(a?.title||''),
     type=String(a?.type||'');

 // NCAA-specific career distinctions are always preserved.
 if(type==='NCAA Qualifier'||type==='College All-American'||/NCAA Champion/i.test(title))return true;

 // In-season individual tournaments and Conference Championships count ONLY for actual podium medals.
 let isConference=/Conference Championships/i.test(ev),
     isInSeason=/Round Robin|Invitational|Classic/i.test(ev);
 if(isConference||isInSeason){
   return type==='College Medal' && Number(a?.place)>=1 && Number(a?.place)<=3
 }

 return true
}

function visibleProfileAccolades(w){
 return (w?.accolades||[]).filter(a=>isInSeasonCollegeEventAccolade(a))
}

function accoladeCategory(a){
 let title=String(a.title||''),type=String(a.type||''),ev=String(a.event||'');
 if(/Hodge|Captain America|MVP|Outstanding Wrestler|Freshman of the Year|Ironman/i.test(title)||type==='Individual Award')return 'Major Awards';
 if(/World|Continental|National Team/i.test(title+' '+type+' '+ev))return 'World & International';
 if(type==='College All-American'||type==='NCAA Qualifier'||/NCAA|Conference/i.test(title+' '+ev))return 'College';
 if(type==='Freestyle All-American'||/U\.S\. Open/i.test(ev))return 'Freestyle All-American';
 return 'Other'
}
function aggregateAccolades(w){
 let cats={'Major Awards':new Map(),'World & International':new Map(),'College':new Map(),'Freestyle All-American':new Map(),'Other':new Map()};

 visibleProfileAccolades(w).forEach(a=>{
   let cat=accoladeCategory(a),
       label=a.title||a.type||a.event||'Accolade',
       isCollegeMedal=a.type==='College Medal';

   // For actual college tournament medals, KEEP the medal descriptor.
   // This avoids a Gold Medal being reduced to a bare event-name badge that looks like participation.
   let norm=isCollegeMedal
     ?label
     :label.replace(/\s+—\s+(1st|2nd|3rd|4th|5th|6th|7th|8th).*$/i,'');

   let key=norm,
       cur=cats[cat].get(key)||{
         label:norm,count:0,
         major:cat==='Major Awards'||/World Champion|NCAA Champion|Hodge|Captain America|MVP|Outstanding Wrestler/i.test(norm)
       };
   cur.count++;
   cats[cat].set(key,cur)
 });


 // NCAA placement rows are stored once. Derive summary badges from those single rows.
 let ncaaRows=visibleProfileAccolades(w).filter(a=>
   a.type==='College All-American'&&/NCAA Individual Championships/i.test(a.event||'')
 );
 if(ncaaRows.length){
   cats['College'].set('College All-American',{
     label:'College All-American',count:ncaaRows.length,major:false
   });
   let champs=ncaaRows.filter(a=>Number(a.place)===1).length;
   if(champs)cats['College'].set('NCAA Champion',{
     label:'NCAA Champion',count:champs,major:true
   })
 }

 // U.S. Open placements are the source of Freestyle All-American summary counts.
 let aaCounts={U20:0,U23:0,Senior:0};
 visibleProfileAccolades(w).forEach(a=>{
   if(a.type!=='U.S. Open'&&!/U\.S\. Open/i.test(a.event||''))return;
   let lvl=a.level==='U20'?'U20':a.level==='U23'?'U23':'Senior';
   aaCounts[lvl]++
 });
 Object.entries(aaCounts).forEach(([lvl,count])=>{
   if(count)cats['Freestyle All-American'].set(`${lvl} Freestyle All-American`,{
     label:`${lvl} Freestyle All-American`,count,major:false
   })
 });

 let nt=(w.nationalTeams||[]).length;
 if(nt)cats['World & International'].set('National Team Representative',{
   label:'National Team Representative',count:nt,major:false
 });

 return cats
}

function accoladeMonthWeek(a){
 // Explicit award timing takes precedence when the accolade is granted separately from its linked event.
 let month=Number(a?.awardMonth),week=Number(a?.awardWeek);
 if(Number.isFinite(month)&&Number.isFinite(week))return {month,week};

 month=Number(a?.month);week=Number(a?.week);
 if(Number.isFinite(month)&&Number.isFinite(week)){
   // NCAA qualifier is actually awarded after Conference Championships / selection,
   // not when the NCAA tournament itself is wrestled.
   if(a?.type==='NCAA Qualifier')return {month:2,week:3}; // March W3
   return {month,week}
 }

 let title=String(a?.title||''),type=String(a?.type||''),ev=String(a?.event||'');

 // National Team representative status is decided at Wrestle-Off Week.
 if(type==='National Team'||/National Team Representative/i.test(title))return {month:4,week:2}; // May W2

 // NCAA qualification reveal occurs March W3.
 if(type==='NCAA Qualifier'||/NCAA National Championship Qualifier/i.test(title))return {month:2,week:3};

 let target=accoladeEventTarget(a);
 if(target?.kind==='event'){
   month=Number(target.ev.month);week=Number(target.ev.week);
   if(Number.isFinite(month)&&Number.isFinite(week))return {month,week}
 }

 return {month:null,week:null}
}

function accoladeSeasonOrder(a){
 let {month,week}=accoladeMonthWeek(a);
 if(month==null)return 9999;

 // The game's universal season chronology is always April W1 -> March W4,
 // regardless of whether the dynasty was initially started in freestyle or folkstyle.
 let start=3, // April = month index 3
     relative=(month-start+12)%12;
 return relative*4+(Number(week)||1)-1
}

function chronologicalAccoladeHTML(w){

     // Newest season first; inside each season, earliest event first.
     if(sx!==sy)return sy-sx;
     let ox=accoladeSeasonOrder(x),oy=accoladeSeasonOrder(y);
     if(ox!==oy)return ox-oy;
     return A.i-B.i

 if(!a.length)return '<p class=small>No recorded accolades yet.</p>';
 return `<table class=accolade-history-table><tr><th>Season</th><th>Accolade</th><th>Event</th><th>Weight</th><th>Type</th></tr>${

 }</table>`
}

function seasonStyleRecord(w,year,style){
 let z=(w.matchHistory||[]).filter(m=>m.year===year&&matchStyle(m)===style);
 return {wins:z.filter(m=>m.result==='W').length,losses:z.filter(m=>m.result==='L').length}
}
function awardRecordCompare(a,b,year,style){
 let A=seasonStyleRecord(a,year,style),B=seasonStyleRecord(b,year,style);
 let au=A.losses===0,bu=B.losses===0;
 if(au!==bu)return au?-1:1;                 // undefeated always beats a wrestler with a loss
 if(A.wins!==B.wins)return B.wins-A.wins;  // then most wins
 return A.losses-B.losses;                 // then fewest losses
}
function awardTieGroup(cands,year,style){
 if(!cands.length)return[];
 let s=[...cands].sort((a,b)=>awardRecordCompare(a,b,year,style)),best=s[0],R=seasonStyleRecord(best,year,style);
 return s.filter(w=>{let r=seasonStyleRecord(w,year,style);return (r.losses===0)===(R.losses===0)&&r.wins===R.wins&&r.losses===R.losses})
}
function ncaaPlacement(w,year){
 let a=(w.accolades||[]).filter(x=>x.year===year&&x.event==='NCAA Individual Championships'&&x.place);
 return a.length?Math.min(...a.map(x=>x.place)):999
}
function seniorWorldPlacement(w,year){
 let a=(w.accolades||[]).filter(x=>x.year===year&&x.event==='Senior World Championships'&&x.place);
 return a.length?Math.min(...a.map(x=>x.place)):999
}
function conferenceChampion(w,year){
 return (w.accolades||[]).some(x=>x.year===year&&String(x.event||'').includes('Conference')&&x.place===1)
}

function singleAwardWinner(cands,year,style){
 if(!cands?.length)return null;
 return [...cands].sort((a,b)=>{
   let cmp=awardRecordCompare(a,b,year,style);
   if(cmp)return cmp;
   let ao=style==='folk'?(a.folk||0):(a.free||0),
       bo=style==='folk'?(b.folk||0):(b.free||0);
   if(bo!==ao)return bo-ao;
   return String(a.name||'').localeCompare(String(b.name||''))
 })[0]||null
}

 });

function computeSeasonAwards(year=G.year){
 G.seasonAwards=G.seasonAwards||{};
 G.seasonAwards[year]=G.seasonAwards[year]||{folk:[],free:[]};
 let out=G.seasonAwards[year];

 let ncaa=Object.values(G.tournaments||{}).find(x=>eventSeasonStartYear(x)===year&&x.id==='ncaa'&&x.simulated);
 if(ncaa){
   let champs=allWrestlers().filter(w=>ncaaPlacement(w,year)===1),
       hodge=singleAwardWinner(champs,year,'folk');
   if(hodge)addSeasonAward(hodge,year,'Hodge Trophy');

   let freshmen=allWrestlers().filter(isFreshmanSeason),
       freshmanPlacers=freshmen.filter(w=>ncaaPlacement(w,year)<999),
       nationalFroshPool=freshmanPlacers.length?freshmanPlacers:freshmen,
       froshWinner=singleAwardWinner(nationalFroshPool,year,'folk');
   if(froshWinner)addSeasonAward(froshWinner,year,'Freshman of the Year');

   let conferences=[...new Set(colleges.map(c=>canonicalConference(c.conf)).filter(Boolean))].sort();
   conferences.forEach(conf=>{
     let pool=allWrestlers().filter(w=>w.team&&canonicalConference(colleges.find(c=>c.id===w.team)?.conf)===conf);

     // Conference MVP: always one winner. Prefer NCAA placers / conference champs,
     // but fall back to the best season in the full conference so every conference has the award.
     let placers=pool.filter(w=>ncaaPlacement(w,year)<999),
         confChamps=pool.filter(w=>conferenceChampion(w,year)),
         mvpPool=confChamps.filter(w=>ncaaPlacement(w,year)<999);
     if(!mvpPool.length)mvpPool=placers;
     if(!mvpPool.length)mvpPool=confChamps;
     if(!mvpPool.length)mvpPool=pool;
     let mvp=singleAwardWinner(mvpPool,year,'folk');
     if(mvp)addSeasonAward(mvp,year,`${conf} Conference MVP`,conf);

     // Conference Freshman MVP: also standardized across every conference.
     // If the freshman has no NCAA placement, season record/OVR breaks the comparison.
     let fp=pool.filter(isFreshmanSeason),
         fplacers=fp.filter(w=>ncaaPlacement(w,year)<999),
         fchamps=fp.filter(w=>conferenceChampion(w,year)),
         fmvpPool=fchamps.filter(w=>ncaaPlacement(w,year)<999);
     if(!fmvpPool.length)fmvpPool=fplacers;
     if(!fmvpPool.length)fmvpPool=fchamps;
     if(!fmvpPool.length)fmvpPool=fp;
     let fmvp=singleAwardWinner(fmvpPool,year,'folk');
     if(fmvp)addSeasonAward(fmvp,year,`${conf} Conference Freshman MVP`,conf)
   })
 }

 let sw=Object.values(G.tournaments||{}).find(x=>eventSeasonStartYear(x)===year&&x.id==='worlds'&&x.simulated);
 if(sw){
   let champs=allWrestlers().filter(w=>seniorWorldPlacement(w,year)===1),
       mvp=singleAwardWinner(champs,year,'free');
   if(mvp)addSeasonAward(mvp,year,'Freestyle Season MVP');

   let americans=allWrestlers().filter(w=>w.country==='USA'&&seniorWorldPlacement(w,year)<999),
       cap=singleAwardWinner(americans,year,'free');
   if(cap)addSeasonAward(cap,year,'Captain America Trophy');

   ['Africa','Americas','Europe','Asia'].forEach(continent=>{
     let pool=allWrestlers().filter(w=>
       intl.find(c=>c.name===w.country)?.continent===continent&&seniorWorldPlacement(w,year)<999
     );
     let winner=singleAwardWinner(pool,year,'free');
     if(winner)addSeasonAward(winner,year,`${continent} Continental MVP`,continent)
   })
 }

 ['folk','free'].forEach(style=>{
   let folkNames=['Hodge Trophy','Freshman of the Year','Conference MVP','Conference Freshman MVP'],
       freeNames=['Freestyle Season MVP','Captain America Trophy','Continental MVP'];
   out[style]=allWrestlers().flatMap(w=>(w.accolades||[])
     .filter(a=>accoladeSeasonYear(a)===year&&a.type==='Individual Award'&&
       (style==='folk'?folkNames.some(n=>a.title.includes(n)):freeNames.some(n=>a.title.includes(n))))
     .map(a=>({wrestlerId:w.id,title:a.title})));

   // Old saves may contain tied duplicate winners for a singular award.
   let byTitle=new Map();
   out[style].forEach(row=>{
     if(!byTitle.has(row.title))byTitle.set(row.title,row)
   });
   out[style]=[...byTitle.values()]
 });
 return out
}

function clampPrestige(x){return clamp(Math.round(x),40,99)}
function prestigeRandomModifier(current){
 let r=Math.random();
 // More volatility for smaller programs; elite programs are much stickier.
 let amp=current<65?2:current<85?1.5:current<95?1:.5;
 let raw=r<.16?-1:r<.84?0:1;
 // very occasional stronger swing for lower/mid programs
 if(current<80&&Math.random()<.08)raw*=2;
 return raw*amp
}
function collegeSeasonPerformanceScore(teamId,year){
 let score=0;
 let dual=teamDualRecord(teamId),games=dual.w+dual.l;
 if(games){
   let pct=dual.w/games;
   score+=(pct-.5)*2.0
 }
 let events=Object.values(G.tournaments||{}).filter(t=>t.year===year&&t.simulated&&eventParticipantEntities(t).some(p=>p.type==='college'&&p.id===teamId));
 events.forEach(t=>{
   if(!t.teamPoints||!Object.keys(t.teamPoints).includes(teamId))return;
   let sorted=Object.entries(t.teamPoints).sort((a,b)=>b[1]-a[1]),place=sorted.findIndex(x=>x[0]===teamId)+1;
   if(t.id==='ncaa'){score+=place===1?2.4:place<=3?1.6:place<=8?.9:place<=15?.3:-.2}
   else if(t.id==='conf'){score+=place===1?1.4:place<=3?.8:place<=6?.3:-.2}
   else if(t.id==='ist1'||t.id==='ist2'){score+=place===1?.5:place<=3?.2:0}
 });
 let roster=(G.wrestlers||[]).filter(w=>w.almaMaterId===teamId||w.team===teamId);
 roster.forEach(w=>(w.accolades||[]).filter(a=>a.year===year).forEach(a=>{
   if(a.event==='NCAA Individual Championships'&&a.place===1)score+=.45;
   else if(a.type==='All-American'&&a.place<=8)score+=.12
 }));
 return clamp(score,-3,3)
}
function rtcSeasonPerformanceScore(teamId,year){
 let score=0;
 Object.values(G.tournaments||{}).filter(t=>t.year===year&&t.simulated&&['usopen','u23us','u20us'].includes(t.id)).forEach(t=>{
   if(!t.teamPoints||!Object.keys(t.teamPoints).includes(teamId))return;
   let sorted=Object.entries(t.teamPoints).sort((a,b)=>b[1]-a[1]),place=sorted.findIndex(x=>x[0]===teamId)+1;
   score+=place===1?1.8:place<=3?1.0:place<=6?.4:-.1
 });
 let wrestlers=teamRecordWrestlers('rtc',teamId);
 wrestlers.forEach(w=>(w.accolades||[]).filter(a=>a.year===year).forEach(a=>{
   if(a.type==='World Medal')score+=a.place===1?.7:.35;
   else if(a.type==='U.S. Open'&&a.place===1)score+=.25
 }));
 return clamp(score,-3,3)
}
function intlSeasonPerformanceScore(countryId,year){
 let ct=intl.find(c=>c.id===countryId);if(!ct)return 0;
 let score=0,hist=countryTournamentHistory(ct).filter(h=>h.year===year);
 hist.forEach(h=>{
   if(h.place===1)score+=.28;
   else if([2,3].includes(h.place))score+=.14;
   if(h.teamPlace===1)score+=.8;
   else if(h.teamPlace&&h.teamPlace<=3)score+=.35
 });
 return clamp(score,-2.5,2.5)
}
function prestigeBaseline(kind,id){
 let c=kind==='intl'?intl.find(x=>x.id===id):colleges.find(x=>x.id===id);
 if(!c)return 70;
 c.basePrestige=c.basePrestige??c.prestige;
 c.dynamicPrestigeBaseline=c.dynamicPrestigeBaseline??c.basePrestige;
 return c.dynamicPrestigeBaseline
}
function updatePrestigeBaseline(kind,id,current,perf){
 let c=kind==='intl'?intl.find(x=>x.id===id):colleges.find(x=>x.id===id);
 if(!c)return;
 let base=prestigeBaseline(kind,id);
 // Baseline evolves very slowly after sustained success/failure.
 let drift=perf>1.25?.18:perf<-.9?-.14:0;
 c.dynamicPrestigeBaseline=clamp(base+drift,45,98)
}
function annualPrestigeChange(kind,id,year){
 let entity=kind==='intl'?intl.find(x=>x.id===id):colleges.find(x=>x.id===id);
 if(!entity)return 0;
 let current=entity.prestige,base=prestigeBaseline(kind,id);
 let perf=kind==='college'?collegeSeasonPerformanceScore(id,year):kind==='rtc'?rtcSeasonPerformanceScore(id,year):intlSeasonPerformanceScore(id,year);

 // ~75% success, ~25% controlled variance, plus light mean reversion.
 let success=perf*.72;
 let random=prestigeRandomModifier(current)*.28;
 let gravity=(base-current)*.08;
 let raw=success+random+gravity;

 // top-end diminishing returns
 if(current>=95&&raw>0)raw*=.35;
 else if(current>=90&&raw>0)raw*=.6;
 if(current<=55&&raw<0)raw*=.65;

 let delta=clamp(Math.round(raw),-3,3);
 if(kind==='intl')delta=clamp(delta,-2,2);
 updatePrestigeBaseline(kind,id,current,perf);
 return delta
}
function applyAnnualPrestigeChanges(year){
 G.prestigeHistory=G.prestigeHistory||{college:{},rtc:{},intl:{}};

 colleges.forEach(c=>{
   let old=c.prestige,delta=annualPrestigeChange('college',c.id,year);
   c.prestige=clampPrestige(old+delta);
   G.prestigeHistory.college[c.id]=G.prestigeHistory.college[c.id]||{};
   G.prestigeHistory.college[c.id][year]={year,old,new:c.prestige,change:c.prestige-old,baseline:c.dynamicPrestigeBaseline,performance:collegeSeasonPerformanceScore(c.id,year)};

   if(c.rtc||c.id===G.school){
     c.rtcPrestige=c.rtcPrestige??c.prestige;
     let oldRtc=c.rtcPrestige,rtcDelta=annualPrestigeChange('rtc',c.id,year);
     c.rtcPrestige=clampPrestige(oldRtc+rtcDelta);
     G.prestigeHistory.rtc[c.id]=G.prestigeHistory.rtc[c.id]||{};
     G.prestigeHistory.rtc[c.id][year]={year,old:oldRtc,new:c.rtcPrestige,change:c.rtcPrestige-oldRtc,performance:rtcSeasonPerformanceScore(c.id,year)}
   }
 });

 intl.forEach(ct=>{
   let old=ct.prestige,delta=annualPrestigeChange('intl',ct.id,year);
   ct.prestige=clampPrestige(old+delta);
   G.prestigeHistory.intl[ct.id]=G.prestigeHistory.intl[ct.id]||{};
   G.prestigeHistory.intl[ct.id][year]={year,old,new:ct.prestige,change:ct.prestige-old,baseline:ct.dynamicPrestigeBaseline,performance:intlSeasonPerformanceScore(ct.id,year)}
 });
}

 colleges.forEach(c=>{
   seasonArchivePut('college',c.id,year,collegeSeasonSnapshot(c.id,year));
   if(c.rtc||c.id===G.school)seasonArchivePut('rtc',c.id,year,rtcSeasonSnapshot(c.id,year))
 });
 intl.forEach(ct=>seasonArchivePut('intl',ct.id,year,intlSeasonSnapshot(ct.id,year)));

 let finalRows=dualStandingsRows('ALL','overall');
 finalRows.forEach((x,i)=>{
   let snap=G.teamSeasons?.college?.[x.c.id]?.[year];
   if(snap){
     snap.finalDualRank=i+1;
     snap.finalDualRecord={w:x.r.w,l:x.r.l,pct:x.r.pct,sos:x.r.sos,pf:x.r.pf,pa:x.r.pa};
     snap.startingTenOvr=x.s.avg
   }
 });
 G.teamSeasonArchiveLastCaptured=year
}

function ensureCurrentTeamSeasonSnapshot(kind,id){
 ensureTeamSeasonArchive();
 let sy=currentSeasonStartYear(),
     snap=kind==='college'?collegeSeasonSnapshot(id,sy):kind==='rtc'?rtcSeasonSnapshot(id,sy):intlSeasonSnapshot(id,sy);
 if(snap)seasonArchivePut(kind,id,sy,snap);
 return snap
}

function teamSeasonYears(kind,id){
 ensureTeamSeasonArchive();
 ensureCurrentTeamSeasonSnapshot(kind,id);
 return Object.keys(G.teamSeasons[kind]?.[id]||{}).map(Number).sort((a,b)=>b-a)
}
function seasonYearSelector(kind,id,year){

function showTournamentDualRecordGame(eventKey,key){
 if(!WPD_SKIP_HISTORY)wpdSetRoute('showTournamentDualRecordGame',[eventKey,gameIndex]);
 let ev=G.tournaments?.[eventKey];if(!ev)return;
 let game=null;
 if(ev.kind==='dualPoolTournament'){
   for(let si=0;si<(ev.dualPoolSessions||[]).length&&!game;si++)
     for(let gi=0;gi<(ev.dualPoolSessions[si].games||[]).length;gi++)
       if(`${eventKey}:pool:${si}:${gi}`===key){game=ev.dualPoolSessions[si].games[gi];break}
 }else{
   for(let ri=0;ri<(ev.dualNatState?.rounds||[]).length&&!game;ri++)
     for(let gi=0;gi<(ev.dualNatState.rounds[ri].games||[]).length;gi++)
       if(`${eventKey}:dn:${ri}:${gi}`===key){game=ev.dualNatState.rounds[ri].games[gi];break}
 }
 if(!game)return;
 let cA=colleges.find(c=>c.id===game.a),cB=colleges.find(c=>c.id===game.b);
 document.getElementById('view').innerHTML=`${backButtonHTML()}<div class=card>
   <h2>${linkT(cA)} ${game.scoreA}-${game.scoreB} ${linkT(cB)}</h2>
   <p>${ev.name} • ${game.label||'Dual'}</p>${tournamentDualGameHTML(game)}
 </div>`
}

   let opp=g.a===teamId?g.b:g.a,own=g.a===teamId?g.scoreA:g.scoreB,other=g.a===teamId?g.scoreB:g.scoreA,

function addIntlHistory(entry){
 G.intlHistory=G.intlHistory||[];
 G.intlHistory.push({
   year:entry.year||G.year,countryId:entry.countryId,country:entry.country,event:entry.event||'International Event',
   level:entry.level||'Senior',weight:entry.weight||null,wrestlerId:entry.wrestlerId||null,wrestlerName:entry.wrestlerName||null,
   place:entry.place||null,medal:entry.medal||null,teamPlace:entry.teamPlace||null,teamResult:entry.teamResult||null,dualResult:entry.dualResult||null
 });
}
function countryPool(ct){
 ensureIntlU23Coverage();
 ensureRuntimeIndexes();
 let pool=[...(PERF.countryIndex.get(ct.name)||[])];

 // USA national pool includes RTC wrestlers + enrolled college wrestlers, but not duplicate identities.
 if(ct.name==='USA'){
   let seen=new Set(),out=[];
   pool.forEach(w=>{if(w&&!seen.has(w.id)){seen.add(w.id);out.push(w)}});
   return out
 }
 return pool
}

function countryTop3(ct,wt){
 return countryPool(ct).filter(w=>w.weights&&w.weights.includes(wt)).sort((a,b)=>b.free-a.free).slice(0,3)
}
function countryTournamentHistory(ct){
 return (G.intlHistory||[]).filter(h=>h.countryId===ct.id||h.country===ct.name).sort((a,b)=>(b.year-a.year)||String(a.event).localeCompare(String(b.event)))
}
function countryMedals(ct,level){
 let hist=countryTournamentHistory(ct).filter(h=>!level||h.level===level);
 return hist.filter(h=>h.medal||['Gold','Silver','Bronze'].includes(h.result)||[1,2,3].includes(h.place))
}
function medalText(h){
 if(h.medal)return h.medal;
 if(h.place===1)return 'Gold';if(h.place===2)return 'Silver';if(h.place===3)return 'Bronze';
 return h.result||'—'
}
function countryTeamStats(ct){
 let hist=countryTournamentHistory(ct);
 let worlds=hist.filter(h=>/World/i.test(h.event||''));
 let cont=hist.filter(h=>/Continental|Pan|Europe|Asia|Africa/i.test(h.event||''));
 let medals=countryMedals(ct);
 return {events:new Set(hist.map(h=>`${h.year}-${h.event}`)).size,worldMedals:worlds.filter(h=>h.medal||[1,2,3].includes(h.place)).length,continentalMedals:cont.filter(h=>h.medal||[1,2,3].includes(h.place)).length,golds:medals.filter(h=>medalText(h)==='Gold').length}
}

const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];


const OPENING_RR_NAMES=[
 'Dan Gable Round Robin',
 'Jordan Burroughs Round Robin',
 'Cael Sanderson Round Robin',
 'John Smith Round Robin',
 'Kyle Dake Round Robin',
 'Kyle Snyder Round Robin'
];
const OCTOBER_DUAL_NAMES=[
 'Empire State Duals',
 'Sunshine State Duals',
 'Lone Star State Duals',
 'Golden State Duals'
];
const DECEMBER_CLASSIC_NAMES=[
 'Cliff Keen Las Vegas Classic',
 'Bill Farrell Classic',
 'Fargo Classic',
 'Ironman Classic'
];


function shuffledCollegeIds(){return colleges.map(c=>c.id).sort(()=>Math.random()-.5)}
function ensureSpecialCollegeAssignments(seasonYear=currentSeasonStartYear()){
 G.specialCollegeAssignments=G.specialCollegeAssignments||{};
 if(G.specialCollegeAssignments[seasonYear])return G.specialCollegeAssignments[seasonYear];

 let rrIds=shuffledCollegeIds(),
     decIds=shuffledCollegeIds(),
     rrSizes=[11,11,11,11,10,10],
     at=0;

 let openingRR=OPENING_RR_NAMES.map((name,i)=>{
   let participants=rrIds.slice(at,at+rrSizes[i]);at+=rrSizes[i];
   return {groupId:`openingrr-g${i}`,name:`${seasonLabel(seasonYear)} ${name}`,participants,seasonStartYear:seasonYear}
 });

 // October Duals: each named state event is guaranteed at least one team from that state.
 // One team is reserved first, then the remaining 60 programs are randomly split 15/15/15/15.
 let stateRequirements=['NY','FL','TX','CA'],
     reserved=[],
     used=new Set();

 stateRequirements.forEach(state=>{
   let choices=colleges.filter(c=>c.state===state&&!used.has(c.id));
   let chosen=pick(choices);
   if(!chosen)throw new Error(`No ${state} college is available for the October Duals state requirement.`);
   reserved.push(chosen.id);used.add(chosen.id)
 });

 let remaining=shuffledCollegeIds().filter(id=>!used.has(id)),
     octoberDuals=OCTOBER_DUAL_NAMES.map((name,i)=>{
       let participants=[reserved[i],...remaining.slice(i*15,(i+1)*15)],
           shuffled=[...participants].sort(()=>Math.random()-.5);
       return {
         groupId:`octduals-g${i}`,name:`${seasonLabel(seasonYear)} ${name}`,participants,
         requiredState:stateRequirements[i],requiredStateTeam:reserved[i],
         poolA:shuffled.slice(0,4),poolB:shuffled.slice(4,8),
         poolC:shuffled.slice(8,12),poolD:shuffled.slice(12,16),
         seasonStartYear:seasonYear
       }
     });

 let decemberClassics=DECEMBER_CLASSIC_NAMES.map((name,i)=>({

function rankingSeriesWeightAssignments(t){
 if(t.rsWeightAssignments)return t.rsWeightAssignments;

 let byWt=Object.fromEntries(WTS.map(wt=>[wt,[]]));
 let entrants=[],seen=new Set();

 // Every eligible wrestler is pre-assigned to exactly one A/B Ranking Series.
 rankingSeriesAssignedEntrants(t).forEach(w=>{
   if(w&&!seen.has(w.id)){seen.add(w.id);entrants.push(w)}
 });

 // Then every actual entrant is assigned to exactly ONE weight in this event.
 // Single-weight entrants are fixed.
 let dual=[];
 entrants.forEach(w=>{
   let opts=(w.weights||[]).map(Number).filter(wt=>WTS.includes(wt));
   if(!opts.length)return;
   if(opts.length===1)byWt[opts[0]].push(w.id);
   else dual.push(w)
 });

 // Dual-weight entrants prefer their ranking/primary weight, unless their other
 // weight is substantially thinner. Either way, assignment is made once.
 dual.sort((a,b)=>(b.free||0)-(a.free||0)).forEach(w=>{
   let opts=(w.weights||[]).map(Number).filter(wt=>WTS.includes(wt));
   let levelKey=t.level==='U23'?'u23':'senior';
   let preferred=wrestlerFreestyleRankingWeight(w,levelKey);
   if(!opts.includes(preferred))preferred=opts[0];

   let choice=preferred;
   let alternatives=opts.filter(x=>x!==preferred);
   if(alternatives.length){
     let thinnest=[...alternatives].sort((a,b)=>byWt[a].length-byWt[b].length)[0];
     if(byWt[preferred].length-byWt[thinnest].length>=3)choice=thinnest
   }
   byWt[choice].push(w.id)
 });

 t.rsWeightAssignments=byWt;
 return byWt
}

function rankingSeriesGroups(t,wt){
 t.rsGroups=t.rsGroups||{};

 let entrants=rankingSeriesEntrants(t,wt),
     seedMap=rankingSeriesSeedMap(t,wt),
     expected=Array.from({length:16},()=>[]);

 // GROUPS ARE DETERMINED ONLY BY ORIGINAL TOURNAMENT SEED.
 // 16-group snake:
 // A = 1,32,33,64,65,96...
 // B = 2,31,34,63,66,95...
 // ...
 // P = 16,17,48,49,80,81...
 entrants
   .slice()
   .sort((a,b)=>(seedMap[a.id]||99999)-(seedMap[b.id]||99999))
   .forEach(w=>{
     let seed=seedMap[w.id];
     if(!seed)return;
     let zero=seed-1,
         row=Math.floor(zero/16),
         pos=zero%16,
         gi=(row%2===0)?pos:(15-pos);
     expected[gi].push(w.id)
   });

 expected.forEach(ids=>ids.sort((a,b)=>(seedMap[a]||99999)-(seedMap[b]||99999)));

 // Never trust a stale/randomized cached group layout.
 // If the stored groups do not exactly match the seed formula, rebuild this weight.
 let stored=t.rsGroups[wt];
 let valid=Array.isArray(stored)&&stored.length===16&&stored.every((g,i)=>{
   let a=(g.ids||[]).slice().sort(),
       b=expected[i].slice().sort();
   return a.length===b.length&&a.every((id,j)=>id===b[j])
 });

 if(!valid){
   t.rsGroups[wt]=expected.map((ids,i)=>({
     name:String.fromCharCode(65+i),
     ids:[...ids],
     results:[],standings:[],complete:false
   }));

   // A bad group layout means any knockout/progress for this weight is also invalid.
   t.rsKnockout=t.rsKnockout||{};
   delete t.rsKnockout[wt];
   t.progress=t.progress||{};
   delete t.progress[wt]
 }

 return t.rsGroups[wt]
}

function rankingSeriesGroupWinPoints(method){
 let m=String(method||'').toLowerCase();
 if(m.includes('fall')||m.includes('forfeit')||m==='mfor'||m.includes('mfor'))return 6;
 if(m==='tf'||m.includes('tech'))return 5;
 return 4
}
function rankingSeriesGroupWinBucket(method){
 let m=String(method||'').toLowerCase();
 if(m.includes('fall')||m.includes('forfeit')||m==='mfor'||m.includes('mfor'))return 'pf';
 if(m==='tf'||m.includes('tech'))return 'tf';
 return 'reg'
}

function rsRoundRobinGroup(t,wt,g){
 if(g.complete)return;
 let ws=g.ids.map(wrestlerById).filter(Boolean),stats={};
 ws.forEach(w=>stats[w.id]={w,win:0,loss:0,pfWins:0,tfWins:0,regWins:0,points:0,pf:0,pa:0});

 for(let i=0;i<ws.length;i++)for(let j=i+1;j<ws.length;j++){
   let r=simBout(ws[i],ws[j],'free');
   logBout(t,wt,`Ranking Series Group ${g.name}`,r,false);

   let a=stats[ws[i].id],b=stats[ws[j].id],winnerStat,loserStat;
   if(r.winner?.id===ws[i].id){a.win++;b.loss++;winnerStat=a;loserStat=b}
   else if(r.winner?.id===ws[j].id){b.win++;a.loss++;winnerStat=b;loserStat=a}

   if(winnerStat){
     let pts=rankingSeriesGroupWinPoints(r.method),
         bucket=rankingSeriesGroupWinBucket(r.method);
     winnerStat.points+=pts;
     if(bucket==='pf')winnerStat.pfWins++;
     else if(bucket==='tf')winnerStat.tfWins++;
     else winnerStat.regWins++
   }

   let nums=String(r.score||'').match(/\d+/g)||[];
   let x=+(nums[0]||0),y=+(nums[1]||0);
   if(r.winner?.id===ws[i].id){
     a.pf+=Math.max(x,y);a.pa+=Math.min(x,y);b.pf+=Math.min(x,y);b.pa+=Math.max(x,y)
   }else if(r.winner?.id===ws[j].id){
     b.pf+=Math.max(x,y);b.pa+=Math.min(x,y);a.pf+=Math.min(x,y);a.pa+=Math.max(x,y)
   }

   g.results.push({a:ws[i].id,b:ws[j].id,winner:r.winner?.id||null,score:r.score,method:r.method})
 }

 g.standings=Object.values(stats)
   .sort((a,b)=>
     b.points-a.points ||
     b.win-a.win ||
     b.pfWins-a.pfWins ||
     b.tfWins-a.tfWins ||
     ((b.pf-b.pa)-(a.pf-a.pa)) ||
     freeSeedScore(b.w)-freeSeedScore(a.w)
   )
   .map((x,i)=>({
     id:x.w.id,place:i+1,w:x.win,l:x.loss,
     pfWins:x.pfWins,tfWins:x.tfWins,regWins:x.regWins,
     points:x.points,pf:x.pf,pa:x.pa
   }));
 g.complete=true
}


function rankingSeriesSecondGroups(t,wt){
 t.rsSecondGroups=t.rsSecondGroups||{};
 let first=rankingSeriesGroups(t,wt);
 first.forEach(g=>rsRoundRobinGroup(t,wt,g));

 let qualifiers=first.flatMap(g=>(g.standings||[]).slice(0,2).map(x=>x.id)).filter(Boolean),
     stored=t.rsSecondGroups[wt];

 // Keep the random draw fixed once created. Rebuild only if the qualifier set changes.
 let qSet=[...qualifiers].sort(),
     valid=Array.isArray(stored)&&stored.length===8&&
       stored.every(g=>Array.isArray(g.ids)&&g.ids.length===4)&&
       stored.flatMap(g=>g.ids).slice().sort().join('|')===qSet.join('|');

 if(!valid){
   let shuffled=[...qualifiers];
   for(let i=shuffled.length-1;i>0;i--){
     let j=Math.floor(Math.random()*(i+1));
     [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]
   }
   t.rsSecondGroups[wt]=Array.from({length:8},(_,i)=>({
     name:String.fromCharCode(65+i),
     stage:2,
     ids:shuffled.slice(i*4,(i+1)*4),
     results:[],standings:[],complete:false
   }));
   t.rsKnockout=t.rsKnockout||{};
   delete t.rsKnockout[wt]
 }
 return t.rsSecondGroups[wt]
}

function rsBuildEightManKnockout(t,wt){
 let groups=rankingSeriesSecondGroups(t,wt);
 groups.forEach(g=>rsRoundRobinGroup(t,wt,g));

 // Exactly one winner from each second-stage group advances.
 let winners=groups.map(g=>wrestlerById(g.standings?.[0]?.id)).filter(Boolean);

 // Random 8-man draw, fixed once created for this weight.
 t.rsFinalEightDraw=t.rsFinalEightDraw||{};
 let stored=t.rsFinalEightDraw[wt],
     ids=[...winners].map(w=>w.id).sort(),
     valid=Array.isArray(stored)&&stored.length===8&&
       [...stored].sort().join('|')===ids.join('|');

 if(!valid){
   let draw=[...winners].map(w=>w.id);
   for(let i=draw.length-1;i>0;i--){
     let j=Math.floor(Math.random()*(i+1));
     [draw[i],draw[j]]=[draw[j],draw[i]]
   }
   t.rsFinalEightDraw[wt]=draw
 }
 return (t.rsFinalEightDraw[wt]||[]).map(wrestlerById).filter(Boolean)
}

function rsBuildKnockout(t,wt){
 let groups=rankingSeriesGroups(t,wt);
 groups.forEach(g=>rsRoundRobinGroup(t,wt,g));

 // Group winners inherit fixed knockout path seeds:
 // Group A winner = #1 path, B = #2 ... P = #16.
 let pathSeedToWrestler={};
 groups.forEach((g,i)=>{
   let winner=wrestlerById(g.standings?.[0]?.id);
   if(winner)pathSeedToWrestler[i+1]=winner
 });

 // Standard seeded 16-person bracket.
 // If path seeds hold: R16 1v16, 8v9, 4v13, 5v12, 2v15, 7v10, 3v14, 6v11.
 let bracketOrder=[
   1,16, 8,9,
   4,13, 5,12,
   2,15, 7,10,
   3,14, 6,11
 ];

 return bracketOrder.map(seed=>pathSeedToWrestler[seed]).filter(Boolean)
}

function simulateRankingSeriesWeight(t,wt){
 t.progress=t.progress||{};if(t.progress[wt]?.complete)return;

 // Stage 1 only: 16 groups. ONLY each group winner advances.
 let groups=rankingSeriesGroups(t,wt);
 groups.forEach(g=>rsRoundRobinGroup(t,wt,g));

 // The 16 group winners enter a fixed, seeded Round-of-16 bracket.
 let entrants=rsBuildKnockout(t,wt),
     rounds=[],cur=entrants;

 while(cur.length>1){
   let rd=[],next=[];
   for(let i=0;i<cur.length;i+=2){
     if(!cur[i+1]){next.push(cur[i]);continue}
     let roundName=cur.length===16?'Ranking Series Round of 16':
                   cur.length===8?'Ranking Series Quarterfinal':
                   cur.length===4?'Ranking Series Semifinal':'Ranking Series Final',
         r=simBout(cur[i],cur[i+1],'free');
     logBout(t,wt,roundName,r,false);
     rd.push({a:cur[i].id,b:cur[i+1].id,winner:r.winner.id,score:r.score,method:r.method});
     next.push(r.winner)
   }
   rounds.push(rd);cur=next
 }

 let champion=cur[0]||null,
     final=rounds.at(-1)?.[0],
     runner=final?wrestlerById(final.a===champion?.id?final.b:final.a):null;

 t.rsKnockout=t.rsKnockout||{};
 t.rsKnockout[wt]=rounds;
 t.progress[wt]={complete:true,champion:champion?.id||null,runnerUp:runner?.id||null};

 if(champion)addAccolade(champion,{year:G.year,event:t.name,type:'Ranking Series Champion',place:1,style:'free',level:t.level,weight:wt});
 if(runner)addAccolade(runner,{year:G.year,event:t.name,type:'Ranking Series Medal',place:2,style:'free',level:t.level,weight:wt})
}

function eventForWeek(m,w){
 // UNIVERSAL DYNASTY CALENDAR.

 // APRIL W1-W2 = freestyle preseason / roster setup / rankings window.
 if(m===3&&w===3)return {id:'u20us',name:seasonEventName('U20 U.S. Open'),kind:'tournament',style:'free',level:'U20'};

 if(m===7&&w===1)return {id:'worlds',name:seasonEventName('Senior World Championships'),kind:'tournament',style:'free',level:'Senior'};

 // AUG W2–SEP W3 = six-week recruiting/offseason window.

 // COLLEGE FOLKSTYLE — SEP W4 THROUGH MAR
 if(m===8&&w===4)return specialCollegeEventForTeam('openingRR',G.school,currentSeasonStartYear());

 return null
}

function allCollegeWeekEvents(m=G.eventMonth??G.month,w=G.eventWeek??G.wk,seasonYear=currentSeasonStartYear()){
 let out=[],push=(e,key,teamId=null,kind='event')=>{if(e)out.push({e,key,teamId,kind,label:e.name})};

     push(e,invitationalKey(e.id,g.groupId,m,w,seasonYear),g.participants[0])
   });
   return out
 }

 // Four October dual tournaments.
 if(m===9&&w===4){
   let sets=ensureSpecialCollegeAssignments(seasonYear).octoberDuals||[];
   sets.forEach(g=>{
     let e={id:'octduals',name:g.name,kind:'dualPoolTournament',style:'folk',participatingTeams:[...g.participants],
         poolA:[...(g.poolA||[])],poolB:[...(g.poolB||[])],poolC:[...(g.poolC||[])],poolD:[...(g.poolD||[])],
         invitationalGroupId:g.groupId};
     push(e,invitationalKey(e.id,g.groupId,m,w,seasonYear),g.participants[0])
   });
   return out
 }

 // Four December Classics.
 if(m===11&&w===4){
   let sets=ensureSpecialCollegeAssignments(seasonYear).decemberClassics||[];
   sets.forEach(g=>{
     let e={id:'decclassic',name:g.name,kind:'tournament',style:'folk',participatingTeams:[...g.participants],invitationalGroupId:g.groupId,entryCap:15};
     push(e,invitationalKey(e.id,g.groupId,m,w,seasonYear),g.participants[0])
   });
   return out
 }

 // Eight invitationals in each invitational week.
 let invSlot=(m===10&&w===4)?'ist1':(m===0&&w===3)?'ist2':null;
 if(invSlot){
   (ensureInvitationalAssignments(seasonYear)[invSlot]||[]).forEach(g=>{
     let e={id:invSlot,name:g.name,kind:'tournament',style:'folk',hostTeamId:g.host,participatingTeams:[...g.participants],invitationalGroupId:g.groupId};
     push(e,invitationalKey(e.id,g.groupId,m,w,seasonYear),g.host)
   });
   return out
 }

 // Every conference championship is its own event in March W2.
 if(m===2&&w===2){
   [...new Set(colleges.map(c=>c.conf))].sort().forEach(conf=>{
     let teams=colleges.filter(c=>c.conf===conf).map(c=>c.id),
         e={id:'conf',name:`${conf} Conference Championships`,kind:'tournament',style:'folk',conference:conf,participatingTeams:teams,invitationalGroupId:`conf-${String(conf).replace(/[^A-Za-z0-9]/g,'_')}`};
     push(e,invitationalKey('conf',e.invitationalGroupId,m,w,seasonYear),teams[0])
   });
   return out
 }

 // Every normal dual in that week's league slot.
 let di=dualWeekIndex(m,w);
 if(di>=0){
   let wk=ensureLeagueDualSchedule(seasonYear)[di];
   (wk?.matches||[]).forEach(match=>{
     let id=ensureLeagueDualIdentity(match,seasonYear,di+1);
     let e={id:`dual${di+1}`,name:`${teamNameById(match.a)} vs ${teamNameById(match.b)}`,kind:'leagueDualView',style:'folk',dualId:id};
     push(e,`DUAL:${id}`,match.a,'dual')
   });
   return out
 }

 // Single college-wide postseason events.
 if(m===1&&w===4){let e={id:'dualnat',name:'Dual Meet National Championships',kind:'dualTournament',style:'folk'};push(e,`S${seasonYear}-M${m}-W${w}-dualnat`)}
 if(m===2&&w===4){let e={id:'ncaa',name:'NCAA Individual Championships',kind:'tournament',style:'folk'};push(e,`S${seasonYear}-M${m}-W${w}-ncaa`)}
 return out
}

function currentUserDualEventShell(m=G.month,w=G.wk){
 let sy=currentSeasonStartYear();
 let candidates=Object.values(G.tournaments||{}).filter(ev=>
   ev?.kind==='dual' &&
   Number(ev.month)===Number(m) &&
   Number(ev.week)===Number(w) &&
   eventSeasonStartYear(ev)===sy &&
   ev.dual?.teams?.includes(G.school)
 );
 if(!candidates.length)return null;
 // Prefer a completed shell with a full 10-bout result.
 candidates.sort((a,b)=>
   Number(!!b.simulated)-Number(!!a.simulated) ||
   Number((b.dual?.matches||[]).length)-Number((a.dual?.matches||[]).length)
 );
 return candidates[0]
}

function repairUserDualScheduleFromShell(m=G.month,w=G.wk){
 let di=dualWeekIndex(m,w);if(di<0)return null;
 let sy=currentSeasonStartYear(),
     weeks=ensureLeagueDualSchedule(sy),
     wk=weeks?.[di];
 if(!wk)return null;

 let existing=wk.matches?.find(x=>x.a===G.school||x.b===G.school);
 if(existing){
   let id=ensureLeagueDualIdentity(existing,sy,di+1);
   return {slot:di+1,match:existing,id,dual:G.universe?.duals?.[id]}
 }

 let shell=currentUserDualEventShell(m,w);
 if(!shell?.dual?.teams?.includes(G.school))return null;
 let teams=shell.dual.teams,
     a=teams[0],b=teams[1];
 if(!a||!b)return null;

 // If this recovered matchup conflicts with a stale generated matchup,
 // remove those stale rows before restoring the actually played user dual.
 wk.matches=wk.matches||[];
 wk.matches=wk.matches.filter(x=>x.a!==G.school&&x.b!==G.school&&x.a!==a&&x.b!==a&&x.a!==b&&x.b!==b);

 let sameOrientation=teams[0]===a,
     result=shell.simulated&&shell.dual?.matches?.length
       ?{
          scoreA:shell.dual.score?.[0]??0,
          scoreB:shell.dual.score?.[1]??0,
          matches:[...(shell.dual.matches||[])],
          winner:shell.dual.winner||null,
          tiebreak:shell.dual.tiebreak||null
        }
       :null,
     ca=colleges.find(c=>c.id===a),cb=colleges.find(c=>c.id===b),
     match={a,b,conference:!!(ca&&cb&&ca.conf===cb.conf),result};

 wk.matches.push(match);
 let id=ensureLeagueDualIdentity(match,sy,di+1),
     dual=G.universe?.duals?.[id];
 if(result&&dual)dual.result=result;
 invalidatePerformanceCaches('duals');
 return {slot:di+1,match,id,dual}
}

function userDualForWeek(m=G.month,w=G.wk){
 let di=dualWeekIndex(m,w);if(di<0)return null;
 let sy=currentSeasonStartYear(),
     match=leagueDualMatchForTeam(G.school,di+1,sy);

 if(!match){
   let repaired=repairUserDualScheduleFromShell(m,w);
   if(repaired)return repaired
 }

 let actual=match||leagueDualMatchForTeam(G.school,di+1,sy);
 if(!actual)return null;
 let id=ensureLeagueDualIdentity(actual,sy,di+1),
     d=G.universe?.duals?.[id];
 if(d?.result&&!actual.result)actual.result=d.result;
 if(actual.result&&d&&!d.result)d.result=actual.result;
 return {slot:di+1,match:actual,id,dual:d}
}

function eventWrestlerIds(t){

   (b.placements||[]).forEach(id=>id&&ids.add(id));

 });
 (t.rsGroups?Object.values(t.rsGroups):[]).flat().forEach(g=>(g.ids||[]).forEach(id=>ids.add(id)));
 Object.values(t.rsDelegations||{}).forEach(a=>(a||[]).forEach(id=>ids.add(id)));

function eventParticipantEntities(t){
 let out=new Map();
 if(t.participatingTeams) t.participatingTeams.forEach(id=>{
   let c=colleges.find(x=>x.id===id);if(c)out.set(`college:${id}`,{type:'college',id,name:c.name})
 });
 if(t.rsDelegations)Object.keys(t.rsDelegations).forEach(id=>{
   let ct=intl.find(x=>x.id===id);if(ct)out.set(`country:${id}`,{type:'country',id,name:ct.name,flag:ct.flag})
 });
 eventWrestlerIds(t).map(wrestlerById).filter(Boolean).forEach(w=>{
   if(t.style==='folk'&&w.team){
     let c=colleges.find(x=>x.id===w.team);if(c)out.set(`college:${c.id}`,{type:'college',id:c.id,name:c.name})
   }else if(['usopen','u23us','u20us'].includes(t.id)){
     let rid=rtcScoreTeamId(w);
     if(rid){let c=colleges.find(x=>x.id===rid);if(c)out.set(`rtc:${rid}`,{type:'rtc',id:rid,name:rtcDisplayName(c)})}
   }else{
     let ct=intl.find(x=>x.id===w.intlTeam)||intl.find(x=>x.name===w.country);
     if(ct)out.set(`country:${ct.id}`,{type:'country',id:ct.id,name:ct.name,flag:ct.flag})
   }
 });
 if(t.dual?.teams)(t.dual.teams||[]).forEach(id=>{let c=colleges.find(x=>x.id===id);if(c)out.set(`college:${id}`,{type:'college',id,name:c.name})});
 (t.dualBracket||[]).flat().forEach(g=>[g.a,g.b].forEach(id=>{
   let c=colleges.find(x=>x.id===id),ct=intl.find(x=>x.id===id);
   if(c)out.set(`college:${id}`,{type:'college',id,name:c.name});

}

function eventTeamWinner(t){
 if(t.teamPoints&&Object.keys(t.teamPoints).length){
   let top=Object.entries(t.teamPoints).sort((a,b)=>b[1]-a[1])[0];
   if(!top)return null;
   if(['usopen','u23us','u20us'].includes(t.id)){
     return {type:'rtc',id:top[0],name:rtcDisplayName(top[0]),points:top[1]}
   }
   let c=colleges.find(x=>x.id===top[0]),ct=intl.find(x=>x.id===top[0]);
   if(c)return {type:'college',id:c.id,name:c.name,points:top[1]};
   if(ct)return {type:'country',id:ct.id,name:ct.name,points:top[1]}
 }
 if(t.dual?.teams&&t.simulated){
   let i=t.dual.score[0]>=t.dual.score[1]?0:1,id=t.dual.teams[i],c=colleges.find(x=>x.id===id);
   return c?{type:'college',id,name:c.name,points:null}:null
 }
 if(t.dualBracket?.length){
   let g=t.dualBracket[t.dualBracket.length-1]?.[0],id=t.dualPlacements?.[0]||g?.winner;
   let c=colleges.find(x=>x.id===id),ct=intl.find(x=>x.id===id);
   if(c)return {type:'college',id,name:c.name,points:null};

 }
 return null
}

 return a

function freestyleAffiliationLabel(w,ev=null){
 if(!w)return '—';

     let n=intl.find(x=>x.id===w.intlTeam);
     if(n)return ev?.style==='free'?rankedCountryLink(n,ev.level):countryLink(n)
   }
   let n=intl.find(x=>x.name===w.country);
   return n?(ev?.style==='free'?rankedCountryLink(n,ev.level):countryLink(n)):(w.country||'Independent')
 }
 let rtcId=freestyleRtcAffiliationId(w),
     rtc=rtcId?colleges.find(x=>x.id===rtcId):null;
 return rtc?rankedRtcLink(rtc,ev?.level):'Unattached'

function wrestlerAffiliation(w){
 if(!w)return '—';
 let ev=G.currentEventKey?G.tournaments?.[G.currentEventKey]:null,
     freeEvent=G.view==='event'&&ev?.style==='free';

 // In freestyle, USA wrestlers are represented by RTC affiliation when available.
 if(freeEvent)return freestyleAffiliationLabel(w,ev)

 if(w.team){
   let c=colleges.find(x=>x.id===w.team);
   if(c)return linkT(c)
 }
 if(w.rtcTeamId){
   let c=colleges.find(x=>x.id===w.rtcTeamId);
   if(c)return rankedRtcLink(c,ev?.level)
 }
 if(w.country==='USA'&&w.intlTeam){
   let c=colleges.find(x=>x.id===w.intlTeam);
   if(c)return rankedRtcLink(c,ev?.level)
 }
 if(w.country==='USA'&&!w.team&&!w.rtcTeamId)return 'Unattached';

 if(w.intlTeam){
   let n=intl.find(x=>x.id===w.intlTeam);
   if(n)return freeEvent?rankedCountryLink(n,ev.level):countryLink(n)
 }
 if(w.country){
   let n=intl.find(x=>x.name===w.country);
   if(n)return freeEvent?rankedCountryLink(n,ev.level):countryLink(n)
 }
 return 'Independent'
}

 WTS.forEach(wt=>{
   let starters=colleges.map(c=>collegeRankStarterForTeam(c.id,wt)).filter(Boolean)
     .sort((a,b)=>collegeSeedScore(b)-collegeSeedScore(a))

function currentEventSuppressesFolkRanks(){

 return ev?.id==='ncaa'

function normalizeFreeLevel(level,w=null){
 let x=String(level||'').toLowerCase();
 if(x.includes('u20'))return 'u20';
 if(x.includes('u23'))return 'u23';
 if(x.includes('senior'))return 'senior';
 if(w)return (w.age||99)<20?'u20':(w.age||99)<23?'u23':'senior';
 return 'senior'
}
function freestyleEventRankMap(level,wt){
 let lvl=normalizeFreeLevel(level),
     key=`EVFREE_ROLL45|${performanceWeekKey()}|${lvl}|${wt}`;
 if(PERF.freeRank.has(key))return PERF.freeRank.get(key);
 let pool=freestyleRankingPool(lvl)
   .filter(w=>Number(wrestlerFreestyleRankingWeight(w,lvl))===Number(wt))
   .sort((a,b)=>freeSeedScore(b)-freeSeedScore(a));
 let map=new Map(pool.map((w,i)=>[w.id,i+1]));
 PERF.freeRank.set(key,map);
 return map
}


function freestyleEventRank(w,wt,level=null){

function rtcFreestyleStrength(teamId,level=currentFreeEventLevel()){

 WTS.forEach(wt=>{
   let best=pool.filter(w=>Number(wrestlerFreestyleRankingWeight(w,lvl))===Number(wt))
     .sort((a,b)=>freeSeedScore(b)-freeSeedScore(a))[0];
   if(best)vals.push(freeSeedScore(best))

}

function numericBoutPoints(score){
 let m=String(score||'').match(/(\d+)\s*-\s*(\d+)/);
 return m?[Number(m[1]),Number(m[2])]:[0,0]
}
function dualTieMetrics(rows,teamA,teamB){
 let winsA=0,winsB=0,indA=0,indB=0,lastWinner=null;
 (rows||[]).forEach(r=>{
   let a=wrestlerById(r.a),b=wrestlerById(r.b),w=wrestlerById(r.winner);
   if(w?.team===teamA)winsA++; else if(w?.team===teamB)winsB++;
   let [x,y]=numericBoutPoints(r.score);
   // Rows are always stored A-side then B-side for the dual.
   indA+=x;indB+=y;
   if(r.method==='Fall'||r.method==='MFOR'){
     if(w?.team===teamA)indA+=15;else if(w?.team===teamB)indB+=15
   }
   if(w)lastWinner=w.team
 });
 return {winsA,winsB,indA,indB,lastWinner}
}
function resolveDualWinner(teamA,teamB,scoreA,scoreB,rows){
 if(scoreA!==scoreB)return scoreA>scoreB?teamA:teamB;
 let x=dualTieMetrics(rows,teamA,teamB);
 if(x.winsA!==x.winsB)return x.winsA>x.winsB?teamA:teamB;
 if(x.indA!==x.indB)return x.indA>x.indB?teamA:teamB;
 if(x.lastWinner===teamA||x.lastWinner===teamB)return x.lastWinner;
 return teamA
}
function maybeTournamentInjury(w){

 let inj={name:pick(['Knee injury','Shoulder injury','Rib injury','Ankle injury','Concussion']),weeks:rnd(2,6),out:true,penalty:0,tournamentInjury:true};
 w.injury=inj;
 addTransaction('INJURY',`${w.name} suffered a ${inj.name} during competition and will medical-forfeit any remaining matches.`,w)
}
function boutDualPoints(r){
 return r.method==='Double Forfeit'?0:(r.method==='Fall'||r.method==='Forfeit'||r.method==='MFOR')?6:r.method==='TF'?5:r.method==='Major'?4:3
}

function simBout(a,b,style){
 if(!a&&!b)return {winner:null,loser:null,score:'DOUBLE FORFEIT',method:'Double Forfeit'};
 if(!a)return {winner:b,loser:null,score:'FORFEIT',method:'Forfeit'};
 if(!b)return {winner:a,loser:null,score:'FORFEIT',method:'Forfeit'};
 if(a.injury?.out&&!b.injury?.out)return {winner:b,loser:a,score:'MFOR',method:'MFOR'};
 if(b.injury?.out&&!a.injury?.out)return {winner:a,loser:b,score:'MFOR',method:'MFOR'};
 if(a.injury?.out&&b.injury?.out)return {winner:null,loser:null,score:'DOUBLE MFOR',method:'Double Forfeit'};
 let ra=effectiveRating(a,style),rb=effectiveRating(b,style);
 let p=1/(1+Math.exp(-(ra-rb)/6.0)),aw=Math.random()<p,w=aw?a:b,l=aw?b:a,d=Math.abs(ra-rb),roll=Math.random();
 if(style==='free'){
   let method=roll<.055+d/500?'Fall':roll<.25+d/170?'TF':'Decision';
   let ls=method==='Fall'?rnd(0,7):method==='TF'?rnd(0,5):rnd(0,8),ws=method==='TF'?ls+10:method==='Fall'?rnd(Math.max(ls,2),Math.max(ls+1,10)):ls+rnd(1,6);
   return {winner:w,loser:l,score:method==='Fall'?pinTime('free'):`${ws}-${ls}`,method}
 }else{
   let method=roll<.045+d/450?'Fall':roll<.16+d/230?'TF':roll<.34+d/170?'Major':'Decision';
   let ls=method==='Fall'?rnd(0,6):method==='TF'?rnd(0,5):method==='Major'?rnd(1,7):rnd(0,8);
   let ws=method==='TF'?ls+15:method==='Major'?ls+rnd(8,12):method==='Fall'?rnd(Math.max(2,ls),Math.max(8,ls+3)):ls+rnd(1,7);
   return {winner:w,loser:l,score:method==='Fall'?pinTime('folk'):`${ws}-${ls}`,method}
 }
}



function freestyleRtcAffiliationId(w){
 if(!w||w.country!=='USA')return null;

 // Explicit post-college / signed RTC assignment always wins.
 if(w.rtcTeamId){
   let rtc=colleges.find(x=>x.id===w.rtcTeamId);
   if(rtc&&(rtc.rtc||rtc.id===G.school))return rtc.id
 }

 // College-aged Americans represent their school's RTC ONLY if that college actually has one.
 if(w.team&&(w.age||99)<23){
   let c=colleges.find(x=>x.id===w.team);
   if(c&&(c.rtc||c.id===G.school))return c.id
 }

 // A wrestler from a college without an RTC is Unattached in U.S. freestyle competition.
 return null
}


function cachedFreestyleRankSnapshot(w,level,wt){
 if(!w)return null;
 let lvl=normalizeFreeLevel(level,w),
     exactKey=`EVFREE_ROLL45|${performanceWeekKey()}|${lvl}|${Number(wt)}`;
 let exact=PERF.freeRank.get(exactKey);
 if(exact&&exact.has(w.id))return exact.get(w.id);

 // Fall back to already-built general level ranking cache, without constructing it.
 let generalKey=`ROLL45|${performanceWeekKey()}|${lvl}`;
 let general=PERF.freeRank.get(generalKey),
     row=general?.get(w.id);
 return row?.rank??null
}

 winner.matchHistory=winner.matchHistory||[];loser.matchHistory=loser.matchHistory||[];
 winner.record=winner.record||{w:0,l:0};loser.record=loser.record||{w:0,l:0};
