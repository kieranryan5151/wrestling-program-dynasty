function finalizeDualNatRound(t){
 let st=t.dualNatState,r=st.rounds[st.roundIndex];
 if(!r||(r.games||[]).some(g=>!g.complete))return;
 r.complete=true;

 let add=(label,games)=>{
   st.rounds.push({label,games,complete:false});
   st.roundIndex++
 };

 switch(st.roundIndex){
   case 0:{
     // R16 winners advance to QF; R16 losers enter wrestleback.
     let cw=dualNatWinners(r.games,'Championship R16'),
         cl=dualNatLosers(r.games,'Championship R16');
     add('Quarterfinals + Wrestleback 1',[
       ...dualNatPairGames(cw,'QF','Championship Quarterfinal'),
       ...dualNatPairGames(cl,'WB1','Wrestleback 1')
     ]);return
   }

   case 1:{
     // QF losers cross with WB1 winners. This is the 12 -> 8 Blood Round.
     st.qfLosers=dualNatLosers(r.games,'Championship Quarterfinal');
     let cw=dualNatWinners(r.games,'Championship Quarterfinal'),
         wb=dualNatWinners(r.games,'Wrestleback 1');
     add('Semifinals + Blood Round',[
       ...dualNatPairGames(cw,'SF','Championship Semifinal'),
       ...dualNatCrossGames(wb,st.qfLosers||[],'Blood Round')
     ]);return
   }

   case 2:{
     st.sfWinners=dualNatWinners(r.games,'Championship Semifinal');
     st.sfLosers=dualNatLosers(r.games,'Championship Semifinal');

     // Four Blood Round winners are guaranteed top eight; two survive toward 3rd/5th.
     let wb=dualNatWinners(r.games,'Blood Round');
     add('Wrestleback 3',dualNatPairGames(wb,'WB3','Wrestleback 3'));return
   }

   case 3:{
     st.wb3Losers=dualNatLosers(r.games,'Wrestleback 3');
     let wb=dualNatWinners(r.games,'Wrestleback 3');
     add('Wrestleback 4 — Consolation Semifinals',
       dualNatCrossGames(wb,st.sfLosers||[],'Wrestleback 4'));return
   }

   case 4:{
     let wb4w=dualNatWinners(r.games,'Wrestleback 4'),
         wb4l=dualNatLosers(r.games,'Wrestleback 4');
     st.wb4Winners=wb4w;st.wb4Losers=wb4l;
     add('Placement Duals — 7th, 5th, 3rd',[
       makeTournamentDualGame(st.wb3Losers?.[0],st.wb3Losers?.[1],'7th Place Dual'),
       makeTournamentDualGame(wb4l[0],wb4l[1],'5th Place Dual'),
       makeTournamentDualGame(wb4w[0],wb4w[1],'3rd Place Dual')
     ]);return
   }

   case 5:{
     add('Championship Final',[
       makeTournamentDualGame(st.sfWinners?.[0],st.sfWinners?.[1],'Championship Final')
     ]);return
   }

   case 6:{
     let final=r.games[0],
         placementRound=st.rounds[5],
         seventh=placementRound.games.find(g=>g.label==='7th Place Dual'),
         fifth=placementRound.games.find(g=>g.label==='5th Place Dual'),
         third=placementRound.games.find(g=>g.label==='3rd Place Dual'),
         champ=final.winner,
         runner=final.winner===final.a?final.b:final.a;

     t.dualPlacements=[
       champ,runner,
       third?.winner,third?(third.winner===third.a?third.b:third.a):null,
       fifth?.winner,fifth?(fifth.winner===fifth.a?fifth.b:fifth.a):null,
       seventh?.winner,seventh?(seventh.winner===seventh.a?seventh.b:seventh.a):null
     ].filter(Boolean);

     t.dualPlacementMatches=placementRound.games;
     t.dualBracket=st.rounds.map(x=>x.games);
     t.simulated=true;
     recordTeamTitle(t);
     awardDualNationalsHonors(t);
     return
   }
 }
}

function annualMovementRoll(age,currentOvr=70,older=false){
 age=Number(age)||20;

 // Age sets the CENTER of the distribution, not a hard direction.
 let base;
 if(age<=18)base=1.55;
 else if(age===19)base=1.25;
 else if(age===20)base=.95;
 else if(age===21)base=.70;
 else if(age<=23)base=.45;
 else if(age<=25)base=.20;
 else if(age<=27)base=.02;
 else if(age===28)base=-.12;
 else if(age===29)base=-.28;
 else if(age===30)base=-.42;
 else if(age===31)base=-.62;
 else if(age<=33)base=-.90;
 else if(age<=35)base=-1.30;
 else if(age<=37)base=-1.80;
 else base=-2.35;

 // High OVR has less room to improve, but never a hard "potential" ceiling.
 if(currentOvr>=94&&base>0)base*=.35;
 else if(currentOvr>=90&&base>0)base*=.58;
 else if(currentOvr<=58&&base>0)base*=1.15;

 // Ordinary annual variance: most guys remain around the age expectation.
 let noise=(Math.random()+Math.random()+Math.random()+Math.random()-2)*.75,
     delta=base+noise,
     r=Math.random();

 // Moderate surprise years.
 if(r<.16){
   delta+=(Math.random()<.5?-1:1)*(.65+Math.random()*1.15)
 }

 // Strong breakout/slump.
 if(r<.055){
   delta+=(Math.random()<.5?-1:1)*(1.35+Math.random()*1.75)
 }

 // Rare extreme year. This is where genuine +4/+5 or -4/-5 movement can come from.
 if(r<.012){
   delta+=(Math.random()<.5?-1:1)*(2.8+Math.random()*2.0)
 }

 // Explicit "against the age curve" chance:
 // young wrestler can regress; older wrestler can have a renaissance.
 if(age<=23&&Math.random()<.075)delta-=1.2+Math.random()*1.8;
 if(age>=30&&Math.random()<.075)delta+=1.4+Math.random()*2.0;

 return clamp(delta,-5.25,5.25)
}

function applyAnnualMovementToAttrs(w,targetDelta,{veteran=false}={}){
 if(!w?.attrs)return;
 let mental=new Set(['Technique','MatIQ','Composure','Clutch','TakedownDefense','TopControl']),
     physical=new Set(['Speed','Explosiveness','Agility','Endurance','Strength']);

 Object.keys(w.attrs).forEach(k=>{
   let bias=0;

   // Veteran positive years tend to be technical/mental; veteran bad years hit physicals harder.
   if(veteran){
     if(targetDelta>0&&mental.has(k))bias=.22;
     if(targetDelta>0&&physical.has(k))bias=-.12;
     if(targetDelta<0&&physical.has(k))bias=-.28;
     if(targetDelta<0&&mental.has(k))bias=.12
   }

   let skillNoise=(Math.random()+Math.random()-1)*.55,
       d=targetDelta+bias+skillNoise;
   w.attrs[k]=clamp(Math.round((Number(w.attrs[k])+d)*10)/10,40,99)
 });
 recomputeWrestlerOvrs(w)
}

function developOne(w){
 if(!w?.attrs)return;
 let age=w.age||18,
     before=(Number(w.folk||0)+Number(w.free||0))/2,
     delta=annualMovementRoll(age,before,false);

 // No fixed potential and no permanent hidden ceiling.
 // Age only shifts the average; yearly randomness can move a wrestler either direction.
 applyAnnualMovementToAttrs(w,delta,{veteran:false});
 w.lastAnnualDevelopmentDelta=delta
}

function retireExpiredWalkons(){
 let ids=new Set(G.freeAgents||[]),retired=[];
 (G.wrestlers||[]).forEach(w=>{

 });

function recomputeWrestlerOvrs(w){
 if(!w||!w.attrs)return;
 w.folk=calcOvr(w.attrs,'folk');w.free=calcOvr(w.attrs,'free')
}
function agingRegression(w){
 if(!w?.attrs)return 0;
 let age=w.age||20;
 if(age<30)return 0;

 let before=(Number(w.folk||0)+Number(w.free||0))/2,
     delta=annualMovementRoll(age,before,true);

 // Older wrestlers usually decline, but this is deliberately not deterministic.
 // Rare veteran breakout years and severe collapse years are both possible.
 applyAnnualMovementToAttrs(w,delta,{veteran:true});
 w.lastAnnualDevelopmentDelta=delta;
 return delta
}

function countryTop3AtAnyWeight(w){
 if(!w||!w.country||w.country==='USA')return false;
 let pool=(G.intlWrestlers||[]).filter(x=>x.country===w.country&&!x.retired);
 return (w.weights||[]).some(wt=>{
   let ranked=pool.filter(x=>x.weights&&x.weights.includes(wt))
     .sort((a,b)=>(b.free||0)-(a.free||0));
   return ranked.slice(0,3).some(x=>x.id===w.id)
 })
}
function hadEliteSeason(w){
 let y=G.year-1;
 let acc=(w.accolades||[]).filter(a=>a.year===y||a.year===String(y));
 // Major placement resets retirement pressure.
 return acc.some(a=>{
   let p=Number(a.place||a.placement||99);
   let txt=((a.event||'')+' '+(a.title||'')+' '+(a.name||'')).toLowerCase();
   return p<=6&&(txt.includes('world')||txt.includes('continental')||txt.includes('u.s. open')||txt.includes('us open')||txt.includes('u23'))
 })
}
function rtcActiveThisSeason(w){
 if(!w||w.country!=='USA'||w.team)return false;
 // RTC membership counts as being chosen to continue training/competing for an RTC.
 if(w.rtcTeamId)return true;
 // Also count actual RTC-affiliated competition in the prior season if present in match history.
 let y=G.year-1;
 return (w.matchHistory||[]).some(m=>(m.year===y||m.year===String(y))&&(m.rtcTeamId||String(m.event||'').toLowerCase().includes('rtc')))
}
function retirementChanceByAge(age){
 if(age<34)return 0;
 if(age===34)return .03;
 if(age===35)return .08;
 if(age===36)return .18;
 if(age===37)return .35;
 if(age===38)return .58;
 if(age===39)return .82;
 return 1
}
function retireCareerWrestler(w,reason){
 if(!w||w.retired)return false;
 w.retired=true;w.retiredYear=G.year;w.retirementReason=reason;addTransaction('RETIREMENT',`${w.name} retired at age ${w.age||'—'} — ${reason}.`,w);
 G.retiredWrestlers=G.retiredWrestlers||[];
 if(!G.retiredWrestlers.some(x=>x.id===w.id))G.retiredWrestlers.push(w);
 return true
}
function processCareerAgingAndRetirement(){
 let retired=[],all=[...(G.rtc||[]),...(G.intlWrestlers||[])];
 let seen=new Set();
 all=all.filter(w=>w&&!seen.has(w.id)&&seen.add(w.id));

 all.forEach(w=>{
   if(w.retired)return;
   let age=w.age||20;

   // Regression is applied before the new season begins.
   agingRegression(w);

   // Absolute ceiling: nobody competes beyond 40.
   if(age>=40){
     if(retireCareerWrestler(w,'Mandatory retirement at age 40'))retired.push(w);
     return
   }

   if(w.country==='USA'){
     // College wrestlers are governed by college eligibility, not senior retirement logic.
     if(w.team)return;
     if(age>=26){
       if(rtcActiveThisSeason(w)||hadEliteSeason(w)){
         w.rtcInactiveSeasons=0
       }else{
         w.rtcInactiveSeasons=(w.rtcInactiveSeasons||0)+1
       }
       if(w.rtcInactiveSeasons>=2){
         // Truly elite wrestlers get one survival roll and may remain unattached.
         let elite=(w.free||0)>=88;
         if(!elite||Math.random()<.65){
           if(retireCareerWrestler(w,'Two straight seasons without RTC selection'))retired.push(w);
           return
         }
         w.rtcInactiveSeasons=1
       }
     }
   }else{
     if(age>=27){
       if(countryTop3AtAnyWeight(w)||hadEliteSeason(w)){
         w.outsideNationalTop3Seasons=0
       }else{
         w.outsideNationalTop3Seasons=(w.outsideNationalTop3Seasons||0)+1
       }
       if(w.outsideNationalTop3Seasons>=2){
         let elite=(w.free||0)>=90;
         if(!elite||Math.random()<.7){
           if(retireCareerWrestler(w,'Two straight seasons outside national top 3'))retired.push(w);
           return
         }
         w.outsideNationalTop3Seasons=1
       }
     }
   }

   // Independent late-career retirement chance, increasingly strong after 34.
   let chance=retirementChanceByAge(age);
   // Elite wrestlers are somewhat more likely to continue, but 40 remains mandatory.
   if((w.free||0)>=90)chance*=.55;
   else if((w.free||0)>=85)chance*=.75;
   if(chance>0&&Math.random()<chance){
     if(retireCareerWrestler(w,'Age-related retirement'))retired.push(w)
   }
 });

 if(retired.length){
   let ids=new Set(retired.map(w=>w.id));
   G.rtc=(G.rtc||[]).filter(w=>!ids.has(w.id));
   G.intlWrestlers=(G.intlWrestlers||[]).filter(w=>!ids.has(w.id));
   let note=`${retired.length} senior wrestler${retired.length===1?'':'s'} retired during the offseason.`;
   G.news.unshift(note);queueNotification(note)
 }
 // Retirement can never leave an international country without U20 representation.
 ensureIntlU20Coverage()
}


function nextWeightUp(wt){
 let i=WTS.indexOf(wt);
 return (i>=0&&i<WTS.length-1)?WTS[i+1]:wt
}
function offseasonWeightEligibilityChange(w){
 if(!w||!w.weights||!w.weights.length)return false;
 let age=w.age||18;
 let chance=age<=21?.10:.01;
 if(Math.random()>=chance)return false;

 let old=[...new Set(w.weights)].sort((a,b)=>WTS.indexOf(a)-WTS.indexOf(b));
 if(old.every(x=>x===285))return false;

 // Never allow more than two eligible weights.
 let shifted=false,newWeights=[...old];

 if(old.length===1){
   let up=nextWeightUp(old[0]);
   if(up===old[0])return false;
   // Roughly half gain a second option, half fully move up.
   if(Math.random()<.5)newWeights=[old[0],up];
   else newWeights=[up];
   shifted=true
 }else{
   // Two-weight wrestlers shift the whole window up by one class.
   let a=nextWeightUp(old[0]),b=nextWeightUp(old[1]);
   newWeights=[a,b].filter((x,i,arr)=>arr.indexOf(x)===i);
   shifted=newWeights.join(',')!==old.join(',')
 }

 if(!shifted)return false;
 w.weights=newWeights.sort((a,b)=>WTS.indexOf(a)-WTS.indexOf(b));

 // Keep current/primary weight legal. If old primary disappears, move it up one.
 if(w.currentWeight&&!w.weights.includes(w.currentWeight)){
   let up=nextWeightUp(w.currentWeight);
   w.currentWeight=w.weights.includes(up)?up:w.weights[0]
 }else if(!w.currentWeight){
   w.currentWeight=w.weights[0]
 }
 return true
}
function processOffseasonWeightChanges(){
 let pools=[
   ...(G.wrestlers||[]),
   ...(G.rtc||[]),
   ...(G.intlWrestlers||[])
 ];
 let seen=new Set(),changed=[];
 pools.forEach(w=>{
   if(!w||seen.has(w.id)||w.retired)return;
   seen.add(w.id);
   // College and freestyle wrestlers all use the same age-based odds.
   if(offseasonWeightEligibilityChange(w)){changed.push(w);addTransaction('WEIGHT CHANGE',`${w.name} changed eligibility to ${w.weights.join('/')} lbs.`,w)}
 });
 if(changed.length){
   G.news.unshift(`Offseason weight changes: ${changed.length} wrestlers changed or expanded weight-class eligibility.`)
 }
}

function annualDevelopment(){
 processOffseasonWeightChanges();
 graduateAndProgressCollege();
 processAIRedshirtDecisions();
 let before={};
 G.wrestlers.forEach(w=>before[w.id]=w.folk);

 // College-age development remains intact, including redshirt fifth-year seniors.
 G.wrestlers.forEach(w=>{if((w.age||18)<30)developOne(w);w.age=(w.age||18)+1});

 // Senior/international development is strongest before 30. Aging regression handles 30+.
 (G.intlWrestlers||[]).forEach(w=>{
   if((w.age||20)<30)developOne(w);
   w.age=(w.age||20)+1
 });
 let collegePoolIds=new Set((G.wrestlers||[]).map(w=>w.id));
 (G.rtc||[]).forEach(w=>{
   if(collegePoolIds.has(w.id))return;
   if(!w.team&&(w.age||22)<30)developOne(w);
   if(!w.team)w.age=(w.age||22)+1
 });

 processCareerAgingAndRetirement();
 ensureIntlU20Coverage();

 let mine=myRoster(),avg=mine.length?mine.reduce((s,w)=>s+(w.folk-(before[w.id]||w.folk)),0)/mine.length:0;
 invalidatePerformanceCaches('all');
 G.news.unshift(`Offseason development complete. ${team().name} average Folkstyle OVR change: ${avg>=0?'+':''}${avg.toFixed(1)}.`)
}



function fullySimulateDualPoolEvent(t){
 if(!requireCurrentEventWeek(t))return;
 if(!t||t.kind!=='dualPoolTournament'||t.simulated)return;
 ensureDualPoolSessions(t);
 for(let sessionNo=1;sessionNo<=8&&!t.simulated;sessionNo++){
   t.dualPoolCurrentSession=sessionNo;
   if(sessionNo===8)ensurePlacementSession(t);
   let s=t.dualPoolSessions[sessionNo-1];if(!s)continue;
   WTS.forEach(wt=>(s.games||[]).forEach(g=>simulateTournamentDualWeight(t,g,wt)));
   finalizeDualPoolSession(t,s)
 }
}

function resolveAllCollegeWorldEventsForWeek(m,w,seasonYear=currentSeasonStartYear()){
 // Regular scheduled dual week: every dual in the NCAA is completed before the week closes.
 let di=dualWeekIndex(m,w);
 if(di>=0)simulateLeagueDualWeek(di+1);

 // Multi-event college weeks: complete every sibling event, not just the user's event.
 let items=allCollegeWeekEvents(m,w,seasonYear);
 items.forEach(item=>{
   if(item.kind==='dual')return; // handled by league dual schedule above
   let ev=ensureCollegeWeekTournament(item,m,w);
   if(!ev||ev.simulated)return;

   if(ev.kind==='roundRobinIndividual')simulateRoundRobinIndividual(ev);
   else if(ev.kind==='dualPoolTournament')fullySimulateDualPoolEvent(ev);
   else if(ev.kind==='tournament')simTournament(ev);
   else if(ev.kind==='dualTournament')simDualTournament(ev);

   if(ev.simulated)archiveEventEdition(ev)
 });

 saveGame()
}

function seasonWorldChampions(sy,level=null){
 let rows=[],seenW=new Set();

 allWrestlers().forEach(w=>{
   if(!w||seenW.has(w.id))return;
   seenW.add(w.id);

   (w.accolades||[]).forEach(a=>{
     if(accoladeSeasonYear(a)!==sy)return;
     if(!/World Championships/i.test(a.event||''))return;
     if(Number(a.place)!==1)return;

     let lvl=a.level||(
       /U20/i.test(a.event||'')?'U20':
       /U23/i.test(a.event||'')?'U23':'Senior'
     );
     if(level&&lvl!==level)return;

     rows.push({
       wrestlerId:w.id,name:w.name,country:w.country,
       level:lvl,weight:Number(a.weight)||a.weight
     })
   })
 });

 // One champion per level/weight. This also repairs old-save duplicate accolade rows.
 let unique=new Map();
 rows.forEach(x=>{
   let key=`${x.level}|${x.weight}`;
   if(!unique.has(key))unique.set(key,x)
 });
 return [...unique.values()].sort((a,b)=>
   (a.level||'').localeCompare(b.level||'') ||
   Number(a.weight)-Number(b.weight)
 )
}

function _advanceWeekCore(){
 try{
   let priorView=G.view||'dashboard';
   let priorState={
     view:priorView,viewTeamId:G.viewTeamId,viewRTCId:G.viewRTCId,viewIntlId:G.viewIntlId,
     scheduleMode:G.scheduleMode,rtcLineupMode:G.rtcLineupMode,rankingsSection:G.rankingsSection,
     collegeRankMode:G.collegeRankMode,freeRankMode:G.freeRankMode,freeRankLevel:G.freeRankLevel,
     recruitStateFilter:G.recruitStateFilter,recruitWeightFilter:G.recruitWeightFilter,
     recruitPathFilter:G.recruitPathFilter,recruitOfferFilter:G.recruitOfferFilter,
     walkonStateFilter:G.walkonStateFilter,walkonWeightFilter:G.walkonWeightFilter
   };

   // You cannot leave a week containing an unfinished required competition.
   let cur=eventForWeek(G.month,G.wk);
   if(cur){
     if(cur.kind==='dual'){
       let ud=userDualForWeek(G.month,G.wk),
           dual=ud?.dual||null,
           match=ud?.match||null,
           shell=currentUserDualEventShell(G.month,G.wk);

       // A completed event shell is authoritative evidence the user finished the dual.
       // If the schedule lost the matchup, restore it automatically.
       if(!ud&&shell?.simulated&&shell.dual?.matches?.length===10){
         ud=repairUserDualScheduleFromShell(G.month,G.wk);
         dual=ud?.dual||null;match=ud?.match||null
       }
       if(ud&&!match?.result&&shell?.simulated&&shell.dual?.matches?.length===10){
         match.result={
           scoreA:shell.dual.score?.[0]??0,
           scoreB:shell.dual.score?.[1]??0,
           matches:[...(shell.dual.matches||[])],
           winner:shell.dual.winner||null,
           tiebreak:shell.dual.tiebreak||null
         };
         ensureLeagueDualIdentity(match,currentSeasonStartYear(),ud.slot);
         dual=G.universe.duals[ud.id]
       }

       let complete=!!match?.result || !!(shell?.simulated&&shell.dual?.matches?.length===10);
       if(!complete){
         showAdvanceBlocker(`Finish ${cur.name} before advancing to the next week.`);
         openUserDualForWeek(G.month,G.wk);
         return
       }
     }else{
       let key=eventKey(cur),existing=G.tournaments[key];
       if(!existing||!existing.simulated){
         showAdvanceBlocker(`Finish ${cur.name} before advancing to the next week.`);
         openEvent(key,G.month,G.wk);
         return
       }
     }
   }

   // Once the user's required event is finished, close out the entire college world
   // for this week before moving the calendar forward. This guarantees that non-user
   // duals/tournaments cannot remain unsimulated in past weeks.
   resolveAllCollegeWorldEventsForWeek(G.month,G.wk,currentSeasonStartYear());

   // Resolve pending walk-on/free-agent offers and normal recruit decisions for the week.
   resolveUserWalkonOffers();
   aiRecruit();
   tickInjuries();
   rollWeeklyInjuries();

   // Universal calendar: freestyle always begins when leaving March W4 for April W1.
   let enteringFreestyleStart=(G.month===2&&G.wk===4);
   if(enteringFreestyleStart)processRTCMovement();

   if(isSeasonFinalWeek(G.month,G.wk)){performSeasonEnd();nextSeasonScreen();return}

   let seasonBeforeAdvance=currentSeasonStartYear();
   G.wk++;
   if(G.wk>4){
     G.wk=1;G.month++;
     if(G.month>11){
       G.month=0;G.year++;
       // Internal calendar rollover only. All gameplay identity remains on the active dynasty season.
     }
   }

   invalidatePerformanceCaches('matches');
   invalidatePerformanceCaches('events');
   PERF.freeRank.clear();
   if(G.month===3&&G.wk===1)saveSeasonStart();

   // Close recruiting immediately after the mode-specific final recruiting week.
   let recruitingJustClosed=(G.month===8&&G.wk===4); // advanced out of Sep W3 into Sep W4
   if(recruitingJustClosed){
     if(!(G.recruitingHistory||[]).some(x=>x.year===(G.currentRecruitingYear||currentSeasonStartYear()))){
       finalizeRecruitingYear()
     }
   }

   invalidateRecruitAICache();
   invalidateRecruitOfferCountCache();

   // NCAA Selection Week is a dedicated non-competition week between conferences and NCAAs.
   if(G.month===2&&G.wk===3){
     showNcaaSeedingAnnouncement(currentSeasonStartYear());
     return
   }

   // If we just entered a scheduled competition week, open it during normal one-week advance.
   // Fast multi-week simulation intentionally stays headless unless a real decision is required.
   let nextEvent=eventForWeek(G.month,G.wk);
   if(nextEvent&&!WPD_SKIP_AUTO_OPEN){
     if(['u23worlds','worlds'].includes(nextEvent.id)){
       showWorldSeedingAnnouncement(nextEvent.level,currentSeasonStartYear());
       return
     }
     if(nextEvent.kind==='dual'&&userDualForWeek(G.month,G.wk)){
       openUserDualForWeek(G.month,G.wk);
       return
     }
     let key=eventKey(nextEvent,G.month,G.wk);
     openEvent(key,G.month,G.wk);
     return
   }

   // Otherwise stay on the same screen.
   Object.entries(priorState).forEach(([k,v])=>{if(v!==undefined)G[k]=v});
   if(userDualForWeek(G.month,G.wk)){openUserDualForWeek(G.month,G.wk);return}
 render()
 }catch(err){
   console.error('WPD advanceWeek error',err);
   showAdvanceBlocker(`The game could not advance: ${err?.message||err}`,'Advance Week Error')
 }
}

function fastSimDecisionNeeded(){
 // Season-end RTC graduate choices are genuine user decisions.
 if(typeof pendingUserRtcGraduateDecisions==='function'&&pendingUserRtcGraduateDecisions().length){
   nextSeasonScreen();
   return true
 }

 let cur=eventForWeek(G.month,G.wk);
 if(!cur)return false;

 // Entry/squad selection is a real decision. Do not auto-pick the user's entries.
 if(cur.kind!=='dual'){
   let ev=G.tournaments?.[eventKey(cur,G.month,G.wk)]||ensureCollegeWeekTournament(cur,G.month,G.wk);
   if(ev&&tournamentAllowsMultiple(ev)&&!ev.squadSubmitted){
     G.currentEventKey=ev.key;
     G.view='event';
     eventPage();
     showAdvanceBlocker(`Choose and submit your squad for ${cur.name}. "Sim Two Weeks" stopped because your input is required.`,'Decision Required');
     return true
   }
 }
 return false
}

function fastResolveCurrentWeek(){
 let cur=eventForWeek(G.month,G.wk);
 if(!cur)return true;
 if(fastSimDecisionNeeded())return false;

 if(cur.kind==='dual'){
   // A fast sim must preserve the user's weekly league-dual identity.
   // Resolve/repair that matchup BEFORE bulk-simming the rest of the college world.
   let ud=userDualForWeek(G.month,G.wk);
   if(!ud){
     ud=repairUserDualScheduleFromShell(G.month,G.wk)
   }
   if(!ud){
     // Last-resort schedule repair: regenerate this season's dual schedule, then re-read the slot.
     // This prevents Sim Two Weeks from advancing into a week with a missing user matchup.
     if(typeof ensureLeagueDualSchedule==='function')ensureLeagueDualSchedule(currentSeasonStartYear(),true);
     ud=userDualForWeek(G.month,G.wk)
   }
   if(!ud)return false;

   let shell=currentUserDualEventShell(G.month,G.wk);
   if(!ud.match?.result){
     if(shell?.simulated&&shell.dual?.matches?.length===10){
       let repaired=repairUserDualScheduleFromShell(G.month,G.wk);
       if(repaired)ud=repaired
     }
     if(!ud.match?.result){
       let d=ud.dual||G.universe?.duals?.[ud.id];
       if(d&&typeof simDual==='function')simDual(d);
       if(d?.result)ud.match.result=d.result
     }
   }
 }

 // Resolve all other college competition in the week after the user's schedule row is safe.
 resolveAllCollegeWorldEventsForWeek(G.month,G.wk,currentSeasonStartYear());

 if(cur.kind!=='dual'){
   let key=eventKey(cur,G.month,G.wk),ev=G.tournaments?.[key];
   if(ev&&!ev.simulated){
     if(ev.kind==='roundRobinIndividual')simulateRoundRobinIndividual(ev);
     else if(ev.kind==='dualPoolTournament')fullySimulateDualPoolEvent(ev);
     else if(ev.kind==='tournament')simTournament(ev);
     else if(ev.kind==='dualTournament')simDualTournament(ev);
     else if(ev.kind==='rankingSeries')simulateRankingSeriesEvent(ev);
     else if(ev.kind==='intlDual'&&typeof simulateIntlDualTournament==='function')simulateIntlDualTournament(ev)
   }
 }
 return true
}
function simTwoWeeks(){
 if(G._simTwoWeeksRunning)return;
 G._simTwoWeeksRunning=true;
 let startLabel=`${monthNames[G.month]} W${G.wk}`,advanced=0;
 try{
   for(let i=0;i<2;i++){
     if(fastSimDecisionNeeded())break;
     if(!fastResolveCurrentWeek()){
       showAdvanceBlocker(`Sim Two Weeks stopped because the current week's competition could not be safely resolved.`,'Sim Two Weeks Stopped');
       break
     }

     let before=`${G.year}-${G.month}-${G.wk}`;
     WPD_SKIP_AUTO_OPEN=true;
     _advanceWeekCore();
     WPD_SKIP_AUTO_OPEN=false;
     let after=`${G.year}-${G.month}-${G.wk}`;

     if(after===before)break;
     advanced++;

     // Validate the new dual week immediately. Repair now, not later when the dashboard renders.
     let nxt=eventForWeek(G.month,G.wk);
     if(nxt?.kind==='dual'&&!userDualForWeek(G.month,G.wk)){
       if(typeof ensureLeagueDualSchedule==='function')ensureLeagueDualSchedule(currentSeasonStartYear(),true);
       userDualForWeek(G.month,G.wk)
     }

     if(fastSimDecisionNeeded())break
   }
 }catch(err){
   WPD_SKIP_AUTO_OPEN=false;
   console.error('WPD Sim Two Weeks error',err);
   showAdvanceBlocker(`Sim Two Weeks stopped: ${err?.message||err}`,'Sim Two Weeks Error')
 }finally{
   WPD_SKIP_AUTO_OPEN=false;
   G._simTwoWeeksRunning=false
 }

 if(advanced>0&&!pendingUserRtcGraduateDecisions?.().length){
   G.view='dashboard';
   render();
   toast(`Simmed ${advanced} week${advanced===1?'':'s'} from ${startLabel}.`)
 }
}

}

const SAVE_DB_NAME='WPD_DYNASTY_SAVES';
const SAVE_DB_VERSION=1;
const SAVE_STORE='slots';

function openSaveDB(){
 return new Promise((resolve,reject)=>{
   let req=indexedDB.open(SAVE_DB_NAME,SAVE_DB_VERSION);
   req.onupgradeneeded=()=>{
     let db=req.result;
     if(!db.objectStoreNames.contains(SAVE_STORE))db.createObjectStore(SAVE_STORE,{keyPath:'slot'})
   };
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error||new Error('Could not open save database'))
 })
}
async function idbGetSlot(n){
 let db=await openSaveDB();
 return new Promise((resolve,reject)=>{
   let tx=db.transaction(SAVE_STORE,'readonly'),req=tx.objectStore(SAVE_STORE).get(n);
   req.onsuccess=()=>resolve(req.result||null);
   req.onerror=()=>reject(req.error)
 })
}
async function idbPutSlot(record){
 let db=await openSaveDB();
 return new Promise((resolve,reject)=>{
   let tx=db.transaction(SAVE_STORE,'readwrite');
   tx.objectStore(SAVE_STORE).put(record);
   tx.oncomplete=()=>resolve(true);
   tx.onerror=()=>reject(tx.error||new Error('Save transaction failed'));
   tx.onabort=()=>reject(tx.error||new Error('Save transaction aborted'))
 })
}
async function idbDeleteSlot(n){
 let db=await openSaveDB();
 return new Promise((resolve,reject)=>{
   let tx=db.transaction(SAVE_STORE,'readwrite');
   tx.objectStore(SAVE_STORE).delete(n);
   tx.oncomplete=()=>resolve(true);
   tx.onerror=()=>reject(tx.error)
 })
}
async function idbAllSlots(){
 let db=await openSaveDB();
 return new Promise((resolve,reject)=>{
   let tx=db.transaction(SAVE_STORE,'readonly'),req=tx.objectStore(SAVE_STORE).getAll();
   req.onsuccess=()=>resolve(req.result||[]);
   req.onerror=()=>reject(req.error)
 })
}

       <div><h2>Saved Dynasties</h2>
       <p class=small>Manual saves use IndexedDB. Exported JSON files are portable between browsers/computers and can be sent to other players using the same or newer compatible WPD build.</p>
       <p><button onclick="exportCurrentDynasty()">Export Current Dynasty</button> <button onclick="importCurrentDynasty()">Import Current Dynasty</button></p>${status}</div>
       <button onclick="closeSaveManager()">Close</button>
     </div></div>${rows}</div>`
 }catch(e){
   overlay.innerHTML=`<div style="width:min(800px,96vw);margin:0 auto"><div class=card><h2>Save Database Error</h2><p>${e.message}</p><button onclick="closeSaveManager()">Close</button></div></div>`
 }
}


function closeSaveManager(){
 let x=document.getElementById('saveManager');if(x)x.remove();
 if(window.WPD_RETURN_TO_START_AFTER_SAVE_MANAGER){
   window.WPD_RETURN_TO_START_AFTER_SAVE_MANAGER=false;
   let chooser=document.getElementById('schoolChooser');
   if(chooser)chooser.style.display='flex';
   else chooseSchool()
 }
}

async function saveToSlot(n){
 try{
   await requestPersistentStorage();
   G.lastManualSave=new Date().toLocaleString();
   let sizeBytes=estimateSaveBytes(G);
   // IndexedDB uses structured clone, avoiding the localStorage string-size ceiling.
   await idbPutSlot({slot:n,game:G,savedAt:G.lastManualSave,sizeBytes,formatVersion:133});
   await openSaveManager()
 }catch(e){
   alert('Could not save this dynasty: '+(e?.message||e))
 }
}
async function loadSlot(n){
 try{
   let rec=await idbGetSlot(n);if(!rec)return;
   if(!confirm(`Load Dynasty Slot ${n}? Unsaved progress in the current dynasty will be lost.`))return;
   G=rec.game;WPD_SCREEN_HISTORY.length=0;updateGlobalBackControl();
   invalidatePerformanceCaches('all');
   migrate();
   window.WPD_RETURN_TO_START_AFTER_SAVE_MANAGER=false;
   let chooser=document.getElementById('schoolChooser');if(chooser)chooser.remove();
   closeSaveManager();
   render()
 }catch(e){alert('Could not load this save: '+(e?.message||e))}
}

async function deleteSlot(n){
 if(!confirm(`Delete Dynasty Slot ${n}?`))return;
 try{await idbDeleteSlot(n);await openSaveManager()}
 catch(e){alert('Could not delete this save: '+(e?.message||e))}
}
async function copySlot(n){
 try{
   let rec=await idbGetSlot(n);if(!rec)return;
   let dest=Number(prompt(`Copy Slot ${n} to which slot? Enter 1-5.`));
   if(!Number.isInteger(dest)||dest<1||dest>5||dest===n)return;
   let existing=await idbGetSlot(dest);
   if(existing&&!confirm(`Slot ${dest} already contains a dynasty. Overwrite it?`))return;
   let cloned=structuredClone?structuredClone(rec.game):JSON.parse(JSON.stringify(rec.game));
   let savedAt=new Date().toLocaleString();
   cloned.lastManualSave=savedAt;
   await idbPutSlot({slot:dest,game:cloned,savedAt,sizeBytes:estimateSaveBytes(cloned),formatVersion:133});
   await openSaveManager()
 }catch(e){alert('Could not copy this save: '+(e?.message||e))}
}
async function exportSlot(n){
 try{
   let rec=await idbGetSlot(n);if(!rec)return;
   let payload={wpdSave:true,formatVersion:133,exportedAt:new Date().toISOString(),game:rec.game};
   let blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
   let url=URL.createObjectURL(blob),a=document.createElement('a');
   let school=colleges.find(c=>c.id===rec.game.school)?.name||'Dynasty';
   a.href=url;a.download=`WPD_${uidSlug(school)}_${rec.game.year}_slot${n}.json`;
   document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)
 }catch(e){alert('Could not export this save: '+(e?.message||e))}
}
async function importToSlot(n){
 try{
   let input=document.createElement('input');input.type='file';input.accept='.json,application/json';
   input.onchange=async()=>{
     let file=input.files?.[0];if(!file)return;
     try{
       let obj=JSON.parse(await file.text()),game=obj?.wpdSave?obj.game:obj;
       if(!game||typeof game!=='object'||game.year==null||!game.school)throw new Error('This is not a valid WPD dynasty save.');
       let existing=await idbGetSlot(n);
       if(existing&&!confirm(`Slot ${n} already contains a dynasty. Overwrite it?`))return;
       let savedAt=new Date().toLocaleString();game.lastManualSave=savedAt;
       await idbPutSlot({slot:n,game,savedAt,sizeBytes:estimateSaveBytes(game),formatVersion:133});
       await openSaveManager()
     }catch(err){alert('Could not import this dynasty: '+(err?.message||err))}
   };
   input.click()
 }catch(e){alert('Could not import this dynasty: '+(e?.message||e))}
}



function restartSeason(){
 let raw=G&&G.seasonStartState;
 if(!raw){alert('No season-start snapshot is available for this dynasty.');return}
 if(!confirm('Restart this season from April Week 1? All unsaved progress since April Week 1 will be lost.'))return;
 try{
   let savedSnapshot=raw;
   G=JSON.parse(raw);
   G.seasonStartState=savedSnapshot;
   migrate();
   render()
 }catch(e){alert('Could not restart the season: '+e.message)}
}
function resetGame(){
  if(!confirm('Start a new dynasty? Any progress not manually saved to a dynasty slot will be lost.'))return;
  G=null;
  init()
}
// Manual-save model: opening the game always starts a fresh dynasty unless the user manually loads an IndexedDB slot.
init();

document.addEventListener('DOMContentLoaded',()=>{
 const v=document.getElementById('view');
 if(v){
   let busy=false;
   new MutationObserver(()=>{
     if(busy)return;busy=true;
     requestAnimationFrame(()=>{applyUniversalMatchResultColors();busy=false})
   }).observe(v,{childList:true,subtree:true});
   scheduleUniversalMatchResultColors()
 }
});
document.addEventListener('click',()=>scheduleUniversalMatchResultColors());

</script></body></html>
