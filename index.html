function logBout(t,wt,round,res,champSide=true){
 if(!res.winner||!res.loser)return;
 ensureMatchRegistry();ensureEventEditionIdentity(t,t.hostTeamId||G.school);
 t._boutSeqByWeight=t._boutSeqByWeight||{};
 let seq=t._boutSeqByWeight[wt];
 if(seq==null){
   // Pay the historical lookup cost once per event/weight, never once per bout.
   seq=0;
   Object.values(G.universe.bouts).forEach(b=>{if(b.parentId===t.editionId&&Number(b.weight)===Number(wt))seq++});
 }
 t._boutSeqByWeight[wt]=seq+1;
 let boutId=boutPermanentId(t.editionId,wt,res.winner.id,res.loser.id,seq);
 let bw=(res.winner.matchHistory||[]).length,bl=(res.loser.matchHistory||[]).length;
 let winnerRankSnapshot=t.style==='free'
     ?cachedFreestyleRankSnapshot(res.winner,t.level,wt)
     :cachedFolkRankSnapshot(res.winner,wt,eventSeasonStartYear(t),t.month,t.week),
     loserRankSnapshot=t.style==='free'
     ?cachedFreestyleRankSnapshot(res.loser,t.level,wt)
     :cachedFolkRankSnapshot(res.loser,wt,eventSeasonStartYear(t),t.month,t.week);
 addMatchResult(res.winner,res.loser,{
   year:t.year,month:t.month,week:t.week,event:t.name,round,score:res.score,style:t.style,weight:wt,
   winnerRankSnapshot,loserRankSnapshot
 });
 if(res.winner.matchHistory?.[bw]){res.winner.matchHistory[bw].boutId=boutId;res.winner.matchHistory[bw].eventEditionId=t.editionId;res.winner.matchHistory[bw].eventSeriesId=t.seriesId}
 if(res.loser.matchHistory?.[bl]){res.loser.matchHistory[bl].boutId=boutId;res.loser.matchHistory[bl].eventEditionId=t.editionId;res.loser.matchHistory[bl].eventSeriesId=t.seriesId}
 G.universe.bouts[boutId]={id:boutId,parentId:t.editionId,parentType:'event',eventKey:t.key,seriesId:t.seriesId,year:t.year,month:t.month,week:t.week,weight:wt,a:res.winner.id,b:res.loser.id,winner:res.winner.id,score:res.score,method:res.method,round,style:t.style};
 let tm=res.winner.team||(intl.find(x=>x.name===res.winner.country)||{}).id||res.winner.intlTeam;
 if(t.style==='folk'){
   let adv=champSide?1:.5,bonus=(res.method==='Fall'||res.method==='MFOR')?2:res.method==='TF'?1.5:res.method==='Major'?1:0;
   t.teamPoints[tm]=(t.teamPoints[tm]||0)+adv+bonus
 }
 // Newsworthy bout. IMPORTANT: use the pre-bout cached snapshot above;
 // never build an entire world ranking table just to decide whether this one loss was by #1.
 let upsetGap=(t.style==='free'?(res.loser.free||0)-(res.winner.free||0):(res.loser.folk||0)-(res.winner.folk||0)),
     loserRank=loserRankSnapshot;
 if(loserRank===1||upsetGap>=8){
   let tag=loserRank===1?'#1 FALLS':'MAJOR UPSET';
   addNewsFeed(tag,`${res.winner.name} defeated ${loserRank===1?'#1 ':''}${res.loser.name} at ${t.name}, ${wt} lbs (${res.score}).`,{
     wrestlerId:res.winner.id,eventKey:t.key,importance:loserRank===1?3:2
   })
 }
 if(res.winner&&res.method!=='MFOR')maybeTournamentInjury(res.winner);if(res.loser&&res.method!=='MFOR')maybeTournamentInjury(res.loser);
}





function styleSeasonRecord(w,style,seasonYear=currentSeasonStartYear()){
 if(!w)return {matches:[],wins:0,losses:0,total:0,pct:.5};
 style=style==='free'?'free':'folk';
 let key=`${PERF.matchEpoch}|STRICTDISC|${w.id}|${style}|${seasonYear}`;
 if(PERF.styleRecord.has(key))return PERF.styleRecord.get(key);

 let matches=wrestlerSeasonMatches(w,seasonYear).filter(m=>{
   let ms=m.style||'folk';
   return ms===style
 }),
     wins=matches.filter(m=>m.result==='W').length,
     losses=matches.filter(m=>m.result==='L').length,
     total=wins+losses,
     out={matches,wins,losses,total,pct:total?wins/total:.5};

 PERF.styleRecord.set(key,out);
 return out
}

function rankingResumeScore(w,style='folk',year=currentSeasonStartYear()){
 if(!w)return -9999;
 style=style==='free'?'free':'folk';
 let key=`${PERF.matchEpoch}|FASTRESUME1313|${w.id}|${style}|${year}`;
 if(PERF.rankingScore.has(key))return PERF.rankingScore.get(key);

 let rec=styleSeasonRecord(w,style,year),
     score=rec.total ? rec.pct*50 + rec.wins*1.65 - rec.losses*1.35 : 0;

 // IMPORTANT PERFORMANCE RULE:
 // Ranking a wrestler must be O(his own matches), not recursively rank/re-record every opponent.
 // opponentOvr and opponentRankSnapshot are captured when the bout is logged.
 for(let m of rec.matches){
   let oppRating=Number(m.opponentOvr)||70,
       snapRank=Number(m.opponentRankSnapshot)||0,
       scheduleQuality=((oppRating-75)*0.16);

   if(snapRank>0){
     if(snapRank===1)scheduleQuality+=2.0;
     else if(snapRank<=5)scheduleQuality+=1.4;
     else if(snapRank<=10)scheduleQuality+=.9;
     else if(snapRank<=25)scheduleQuality+=.45
   }

   if(m.result==='W'){
     score+=scheduleQuality;
     if(oppRating>=95)score+=2.4;
     else if(oppRating>=90)score+=1.7;
     else if(oppRating>=85)score+=1.0
   }else if(m.result==='L'){
     score+=scheduleQuality*.32;
     if(oppRating<=68)score-=2.6;
     else if(oppRating<=74)score-=1.4
   }
 }

 if(rec.total)score+=Math.min(rec.total,30)*.18;
 PERF.rankingScore.set(key,score);
 return score
}

function collegeSeedScore(w){
 if(!w)return -9999;
 let sy=currentSeasonStartYear(),
     rec=styleSeasonRecord(w,'folk',sy),
     resume=rankingResumeScore(w,'folk',sy),
     // Previous seasons NEVER carry into college rankings.
     // OVR is only a temporary preseason/early-season baseline and disappears after 8 bouts.
     baselineWeight=Math.max(0,1-(rec.total/8)),
     baseline=((w.folk||70)-70)*0.55*baselineWeight;
 return resume+baseline
}


function priorWorldCarryoverBonus(w,seasonYear){
 let prev=seasonYear-1,
     best=(w.accolades||[]).filter(a=>
       accoladeSeasonYear(a)===prev &&
       /World Championships/i.test(a.event||'') &&
       Number(a.place)>=1 && Number(a.place)<=6
     ).sort((a,b)=>Number(a.place)-Number(b.place))[0];
 if(!best)return 0;
 return ({1:16,2:12,3:10,4:8,5:6,6:4})[Number(best.place)]||0
}
function rollingFreestyleResumeScore(w,seasonYear=currentSeasonStartYear()){
 if(!w)return -9999;
 let key=`${PERF.matchEpoch}|ROLLFREE45|${w.id}|${seasonYear}`;
 if(PERF.rankingScore.has(key))return PERF.rankingScore.get(key);
 let current=rankingResumeScore(w,'free',seasonYear),
     previous=rankingResumeScore(w,'free',seasonYear-1),
     score=current+(previous*.45)+priorWorldCarryoverBonus(w,seasonYear);
 PERF.rankingScore.set(key,score);
 return score
}

function freeSeedScore(w){
 return rollingFreestyleResumeScore(w,currentSeasonStartYear())
}

function seedSnakeOrder(n){
 if(n===1)return [1];
 let prev=seedSnakeOrder(n/2),out=[];
 // Expand each prior seed into the mirrored pair that should occupy adjacent bracket slots.
 // Example n=4 => [1,4,2,3]; n=8 => [1,8,4,5,2,7,3,6].
 prev.forEach(s=>{
   out.push(s);
   out.push(n+1-s)
 });
 return out
}


function expectedByeSeedCount(fieldSize,bracketSize=nextPow2(Math.max(2,fieldSize))){
 return Math.max(0,bracketSize-fieldSize)
}
function highSeedByeSeeds(fieldSize,bracketSize=nextPow2(Math.max(2,fieldSize))){
 let n=expectedByeSeedCount(fieldSize,bracketSize);
 return Array.from({length:n},(_,i)=>i+1)
}


function ncaa32BracketSeedOrder(){
 return fixedSeedBracketOrder(32)
}

function fixedSeedBracketOrder(size){
 size=Number(size);
 if(size<2||(size&(size-1))!==0)throw new Error(`Bracket size ${size} is not a power of two`);
 let order=seedSnakeOrder(size);

 // Structural guarantees:
 // - every first-round pair mirrors to size+1
 // - #1 and #2 live in opposite halves
 // - the bracket is a fixed tree, never re-paired/re-seeded after a round
 for(let i=0;i<order.length;i+=2){
   if(order[i]+order[i+1]!==size+1)throw new Error(`Invalid seeded pair in ${size}-man bracket`)
 }
 if(order.indexOf(1)>=size/2||order.indexOf(2)<size/2)throw new Error(`Top two seeds not separated in ${size}-man bracket`);
 return order
}
function firstConsolationDropPermutation(n){
 // Fixed NCAA-style crossover map for the FIRST championship drop-in.
 // This is the round immediately after Wrestleback 1 and is specifically
 // arranged so a wrestler cannot immediately meet his first-round opponent again.
 //
 // Examples:
 //  2 survivors: [1,0]
 //  4 survivors: [2,3,1,0]
 //  8 survivors: [4,5,7,6,2,3,1,0]  <- exact 32-man/NCAA sheet topology
 if(n<=1)return [0];
 if(n===2)return [1,0];
 let half=n/2,prev=firstConsolationDropPermutation(half);
 return [...prev].reverse().map(x=>x+half).concat(prev)
}
function fixedConsolationCrossover(active,incoming,fieldSize=32,crossoverIndex=1){
 active=[...(active||[])];incoming=[...(incoming||[])];
 if(!active.length)return incoming;
 if(!incoming.length)return active;

 let perm;
 if(crossoverIndex===1 && active.length===incoming.length){
   // This is the crucial C1-winner vs next championship-loser crossover.
   // Use the exact fixed bracket map rather than adjacent swapping.
   perm=firstConsolationDropPermutation(active.length)
 }else if(active.length===incoming.length){
   // Later fixed crossovers. These remain deterministic and non-reseeded.
   // The pairwise reversal matches the standard bracket's opposite mini-bracket feed.
   perm=active.map((_,i)=>i^1)
 }else{
   perm=incoming.map((_,i)=>Math.min(i^1,active.length-1))
 }

 let out=[],usedA=new Set(),usedI=new Set();
 for(let ai=0;ai<active.length;ai++){
   let ii=(perm[ai]??ai);
   if(ii>=incoming.length)continue;
   if(active[ai]){out.push(active[ai]);usedA.add(ai)}
   if(incoming[ii]){out.push(incoming[ii]);usedI.add(ii)}
 }
 // Defensive deterministic fill for unusual non-power-of-two fields.
 active.forEach((w,i)=>{if(w&&!usedA.has(i))out.push(w)});
 incoming.forEach((w,i)=>{if(w&&!usedI.has(i))out.push(w)});
 return out
}

function seededTreeChalkRounds(size){
 let cur=fixedSeedBracketOrder(size),rounds=[cur.slice()];
 while(cur.length>2){
   let next=[];
   for(let i=0;i<cur.length;i+=2)next.push(Math.min(cur[i],cur[i+1]));
   rounds.push(next);cur=next
 }
 return rounds
}

function validateNcaaFirstWrestlebackCrossover(){
 // Under chalk in the uploaded 33-man NCAA reference:
 // C1 survivors: 17,24,21,20,19,22,23,18
 // R16 drop-ins: 16,9,13,12,15,10,14,11
 // Required C2 pairings:
 // 17-15, 24-10, 21-11, 20-14, 19-13, 22-12, 23-9, 18-16
 let active=[17,24,21,20,19,22,23,18],
     incoming=[16,9,13,12,15,10,14,11],
     flat=fixedConsolationCrossover(active,incoming,32,1),
     pairs=[];
 for(let i=0;i<flat.length;i+=2)pairs.push(`${flat[i]}-${flat[i+1]}`);
 return pairs.join(',')==='17-15,24-10,21-11,20-14,19-13,22-12,23-9,18-16'
}

function validateSeededTournamentTrees(){
 [4,8,16,32,64].forEach(size=>{
   let rounds=seededTreeChalkRounds(size);
   let finalPair=rounds[rounds.length-1];
   if(finalPair[0]!==1||finalPair[1]!==2)throw new Error(`${size}-man seeded tree does not preserve #1/#2 final separation`);
   // In 16+ fields, 7 and 15 must remain in the #2 half and cannot reach #1 before the final.
   if(size>=16){
     let opening=rounds[0],half=size/2;
     [2,7,15].filter(x=>x<=size).forEach(seed=>{
       if(opening.indexOf(seed)<half)throw new Error(`Seed #${seed} incorrectly placed in #1 half of ${size}-man bracket`)
     })
   }
 });
 return true
}

function placeSeeds(entrants,size,scoreFn){
 let seeded=[...entrants].sort((a,b)=>scoreFn(b)-scoreFn(a));
 let bracketSeeds=fixedSeedBracketOrder(size);
 return bracketSeeds.map(seedNo=>seedNo<=seeded.length?seeded[seedNo-1]:null)
}


function seedCollegeWeight(wt,teams=null,limit=32){
 let pool=G.wrestlers.filter(w=>w.team&&w.weights.includes(wt)&&isCompetitionAvailable(w,'folk')&&(teams?teams.includes(w.team):true));
 let by={};
 pool.sort((a,b)=>collegeSeedScore(b)-collegeSeedScore(a)).forEach(w=>{if(!by[w.team])by[w.team]=w});
 return Object.values(by).sort((a,b)=>collegeSeedScore(b)-collegeSeedScore(a)).slice(0,limit)
}
function nationalStarter(countryId,level,wt,seasonYear=currentSeasonStartYear()){
 G.nationalStarters=G.nationalStarters||{};
 let canonical=`${seasonYear}-${countryId}-${level}-${wt}`,
     id=G.nationalStarters[canonical];

 // Legacy recovery: old builds sometimes keyed national teams to calendar year.
 if(!id){
   let legacyKeys=[
     `${G.year}-${countryId}-${level}-${wt}`,
     `${seasonYear+1}-${countryId}-${level}-${wt}`
   ];
   for(let k of legacyKeys){
     if(G.nationalStarters[k]){id=G.nationalStarters[k];G.nationalStarters[canonical]=id;break}
   }
 }
 if(id)return wrestlerById(id);

 let ct=intl.find(c=>c.id===countryId);
 if(!ct)return null;
 return countryPool(ct)
   .filter(w=>w.weights?.includes(wt)&&(level==='U20'?w.age<20:level==='U23'?w.age<23:true))
   .sort((a,b)=>freeSeedScore(b)-freeSeedScore(a))[0]||null
}

function setNationalStarter(countryId,level,wt,w){

}

function bestOfThree(a,b,t,wt,label){
 let wins=new Map([[a.id,0],[b.id,0]]),games=[];
 while(wins.get(a.id)<2&&wins.get(b.id)<2){let r=simBout(a,b,'free');wins.set(r.winner.id,wins.get(r.winner.id)+1);games.push(r);logBout(t,wt,label,r,false)}
 let winner=wins.get(a.id)===2?a:b;return {winner,games}
}

function wrestleOffAgeOK(w,level){
 return level==='U20'?(w.age||99)<20:level==='U23'?(w.age||99)<23:true
}
function countryLevelWrestleOffAssignments(ct,level,poolOverride=null){
 let pool=(poolOverride||countryPool(ct))
   .filter(w=>isCompetitionAvailable(w,'free')&&wrestleOffAgeOK(w,level))
   .filter((w,i,a)=>a.findIndex(x=>x.id===w.id)===i);

 let byWeight=Object.fromEntries(WTS.map(wt=>[wt,[]]));
 let assigned=new Set();

 // 1) Single-weight wrestlers are fixed at their only eligible weight.
 pool.forEach(w=>{
   let opts=(w.weights||[]).map(Number).filter(wt=>WTS.includes(wt));
   if(opts.length===1){
     byWeight[opts[0]].push(w);
     assigned.add(w.id)
   }
 });

 // 2) For dual/multi-weight wrestlers, maximize national coverage first.
 // Primary listed weight wins whenever it is uncovered. If primary is already covered
 // but another eligible weight has nobody, shift there. This prevents a wrestler from
 // doubling up while another national-team weight is left empty.
 let remaining=pool.filter(w=>!assigned.has(w.id))
   .sort((a,b)=>{
     let ao=(a.weights||[]).filter(wt=>WTS.includes(Number(wt))).length,
         bo=(b.weights||[]).filter(wt=>WTS.includes(Number(wt))).length;
     return ao-bo || (b.free||0)-(a.free||0)
   });

 remaining.forEach(w=>{
   let opts=(w.weights||[]).map(Number).filter(wt=>WTS.includes(wt));
   if(!opts.length)return;
   let primary=opts[0];

   let chosen;
   if(byWeight[primary].length===0){
     chosen=primary
   }else{
     let uncovered=opts.filter(wt=>byWeight[wt].length===0);
     if(uncovered.length){
       // Prefer the uncovered weight with the fewest other possible wrestlers,
       // preserving scarce-weight coverage.
       uncovered.sort((a,b)=>{
         let ca=pool.filter(x=>x.id!==w.id&&(x.weights||[]).map(Number).includes(a)).length,
             cb=pool.filter(x=>x.id!==w.id&&(x.weights||[]).map(Number).includes(b)).length;
         return ca-cb || opts.indexOf(a)-opts.indexOf(b)
       });
       chosen=uncovered[0]
     }else{
       // All eligible weights already have representation: keep him at primary weight.
       chosen=primary
     }
   }

   byWeight[chosen].push(w);
   assigned.add(w.id)
 });

 // Rank each resulting bracket naturally.
 WTS.forEach(wt=>byWeight[wt].sort((a,b)=>freeSeedScore(b)-freeSeedScore(a)));
 return byWeight
}


function simulateWrestleOffs(t){
 if(!requireCurrentEventWeek(t))return;
 if(t.simulated)return;

 return runPerformanceBatch(()=>{
   t.wrestleOffs=[];
   t.wrestleOffAssignments=t.wrestleOffAssignments||{};

   ensureIntlU20Coverage();

   // countryPool() used to rebuild/filter the entire world pool three times per country.
   // Build it exactly once per nation for this Wrestle-Off event.
   let countryPools=new Map();
   intl.filter(ct=>ct.name!=='USA').forEach(ct=>countryPools.set(ct.id,countryPool(ct)));

   intl.filter(ct=>ct.name!=='USA').forEach(ct=>{
     let basePool=countryPools.get(ct.id)||[];

     ['U20','U23','Senior'].forEach(level=>{
       let assignKey=`${ct.id}|${level}`,
           assignedPools=t.wrestleOffAssignments[assignKey];

       if(!assignedPools){
         let generated=countryLevelWrestleOffAssignments(ct,level,basePool);
         // Persist IDs only so reopening/rendering never regenerates the field.
         assignedPools=Object.fromEntries(WTS.map(wt=>[wt,(generated[wt]||[]).map(w=>w.id)]));
         t.wrestleOffAssignments[assignKey]=assignedPools
       }

       WTS.forEach(wt=>{
         let pool=(assignedPools[wt]||[]).map(wrestlerById).filter(Boolean);
         if(!pool.length)return;

         let bracketBest=pool[0],
             bracketBestOvr=bracketBest?.free||0;

         if(pool.length===1){
           setNationalStarter(ct.id,level,wt,pool[0]);
           t.wrestleOffs.push({
             countryId:ct.id,level,wt,auto:true,winner:pool[0].id,matches:[],
             entrants:pool.map(w=>w.id),
             bracketBestId:pool[0].id,bracketBestOvr,winnerOvr:pool[0].free||0,upsetDiff:0
           });
           return
         }

         let size=nextPow2(pool.length),cur=seededOrder(pool,size,'free'),allMatches=[],roundNum=0;
         while(cur.filter(Boolean).length>2){
           let next=[],rn=`Round ${++roundNum}`;
           for(let i=0;i<cur.length;i+=2){
             let a=cur[i],b=cur[i+1];
             if(!a&&!b)continue;
             if(!b){next.push(a);continue}
             if(!a){next.push(b);continue}
             let r=simBout(a,b,'free');
             logBout(t,wt,`${level} ${ct.name} Wrestle-Off ${rn}`,r,false);
             allMatches.push({round:rn,a:a.id,b:b.id,winner:r.winner?.id,score:r.score,method:r.method});
             next.push(r.winner)
           }
           cur=next
         }

         let finalists=cur.filter(Boolean).slice(0,2);
         if(finalists.length===1){
           setNationalStarter(ct.id,level,wt,finalists[0]);
           let diff=Math.max(0,bracketBestOvr-(finalists[0].free||0));
           t.wrestleOffs.push({
             countryId:ct.id,level,wt,auto:true,winner:finalists[0].id,matches:allMatches,
             entrants:pool.map(w=>w.id),
             bracketBestId:bracketBest?.id||null,bracketBestOvr,winnerOvr:finalists[0].free||0,upsetDiff:diff
           });
           return
         }

         let series=bestOfThree(finalists[0],finalists[1],t,wt,`${level} ${ct.name} Wrestle-Off Final (Best of 3)`);
         series.games.forEach((g,i)=>allMatches.push({
           round:`Final Match ${i+1}`,a:finalists[0].id,b:finalists[1].id,
           winner:g.winner?.id,score:g.score,method:g.method
         }));

         setNationalStarter(ct.id,level,wt,series.winner);
         let upsetDiff=Math.max(0,bracketBestOvr-(series.winner.free||0));
         t.wrestleOffs.push({
           countryId:ct.id,level,wt,auto:false,finalists:finalists.map(x=>x.id),
           winner:series.winner.id,scores:series.games.map(g=>g.score),matches:allMatches,
           entrants:pool.map(w=>w.id),
           bracketBestId:bracketBest?.id||null,bracketBestOvr,winnerOvr:series.winner.free||0,upsetDiff
         })
       })
     })
   });

   t.simulated=true;
   saveGame()
 })
}

function hydrateWrestleOffUpsetMeta(x){
 if(!x)return x;
 let winner=wrestlerById(x.winner);
 if(x.winnerOvr==null)x.winnerOvr=winner?.free||0;
 if(x.bracketBestOvr==null||!x.bracketBestId){
   let ids=new Set(x.entrants||[]);
   ids.add(x.winner);
   (x.matches||[]).forEach(m=>{if(m.a)ids.add(m.a);if(m.b)ids.add(m.b)});
   let entrants=[...ids].map(wrestlerById).filter(Boolean).sort((a,b)=>(b.free||0)-(a.free||0));
   let best=entrants[0];
   x.bracketBestId=x.bracketBestId||best?.id||x.winner;
   x.bracketBestOvr=x.bracketBestOvr??(best?.free||x.winnerOvr||0)
 }
 x.upsetDiff=Math.max(0,(x.bracketBestOvr||0)-(x.winnerOvr||0));
 return x
}

const WORLD_CONTINENT_SPOTS_U20={Africa:1,Americas:3,Europe:6,Asia:6};
const WORLD_CONTINENT_SPOTS_EXPANDED={Africa:2,Americas:4,Europe:12,Asia:12};
const WORLD_WILD_CARDS_EXPANDED=0;
const CONTINENTAL_DAY1_SPOTS={Africa:1,Americas:3,Europe:6,Asia:6};
const CONTINENTAL_DAY2_SPOTS={Africa:1,Americas:1,Europe:6,Asia:6};
const LAST_CHANCE_WORLD_SPOTS=2;

function worldContinentSpots(level){
 return worldLevelKey(level)==='U20'?WORLD_CONTINENT_SPOTS_U20:WORLD_CONTINENT_SPOTS_EXPANDED
}
function worldFieldSize(level){return worldLevelKey(level)==='U20'?16:32}
function worldWildCardCount(level){return 0}

function uwwRoundDepth(round){
 let s=String(round||'');
 if(/Gold Medal|Final/.test(s))return 7;
 if(/Semifinal/.test(s))return 6;
 if(/Quarter/.test(s))return 5;
 if(/Round of 16/.test(s))return 4;
 if(/Round of 32/.test(s))return 3;
 if(/Round of 64/.test(s))return 2;
 if(/Repechage/.test(s))return 1;
 return 0
}
function continentalQualificationOrder(bracket,entrants){
 let medal=(bracket?.placements||[]).map(wrestlerById).filter(Boolean),
     medalIds=new Set(medal.map(w=>w.id)),
     stats=new Map();

 (entrants||[]).forEach(w=>stats.set(w.id,{w,depth:0,wins:0,lastLossDepth:0}));
 (bracket?.matches||[]).forEach(m=>{
   if(m.winner&&stats.has(m.winner)){
     let x=stats.get(m.winner);x.wins++;x.depth=Math.max(x.depth,uwwRoundDepth(m.round))
   }
   if(m.loser&&stats.has(m.loser)){
     let x=stats.get(m.loser);x.lastLossDepth=Math.max(x.lastLossDepth,uwwRoundDepth(m.round));
     x.depth=Math.max(x.depth,x.lastLossDepth)
   }
 });

 let rest=[...stats.values()].filter(x=>!medalIds.has(x.w.id))
   .sort((a,b)=>b.depth-a.depth||b.wins-a.wins||freeSeedScore(b.w)-freeSeedScore(a.w))
   .map(x=>x.w);

 let seen=new Set();
 return [...medal,...rest].filter(w=>w&&!seen.has(w.id)&&seen.add(w.id))
}

   });

   let entrants=intl.filter(ct=>ct.continent===continent)
     .map(ct=>nationalStarter(ct.id,level,wt)).filter(Boolean)
     .filter((w,i,a)=>a.findIndex(x=>x.country===w.country)===i)
     .sort((a,b)=>freeSeedScore(b)-freeSeedScore(a));

   let fake={...t,teamPoints:t.teamPoints,brackets:t.brackets},
       day1=simulateUWWBracket(fake,wt,entrants),
       order1=continentalQualificationOrder(day1,entrants),
       n1=CONTINENTAL_DAY1_SPOTS[continent],
       q1=order1.slice(0,n1);

   q1.forEach((w,i)=>{
     qualifiedIds.add(w.id);
     qualifierRows.push({wrestlerId:w.id,country:w.country,continent,status:'Automatic',path:`${continent} Day 1 AQ #${i+1}`,continentalRank:i+1})
   });

   // DAY 2: remove Day 1 AQs and wrestle the continent again.
   let day2Entrants=entrants.filter(w=>!qualifiedIds.has(w.id)),
       day2=simulateUWWBracket(fake,wt,day2Entrants),
       order2=continentalQualificationOrder(day2,day2Entrants),
       n2=CONTINENTAL_DAY2_SPOTS[continent],
       q2=order2.slice(0,n2);

   q2.forEach((w,i)=>{
     qualifiedIds.add(w.id);
     qualifierRows.push({wrestlerId:w.id,country:w.country,continent,status:'Automatic',path:`${continent} Day 2 AQ #${i+1}`,continentalRank:n1+i+1})
   });

   remaining.push(...day2Entrants.filter(w=>!qualifiedIds.has(w.id)));
   t.continentBrackets[wt][continent]={
     day1,day2,
     qualifiers:[...q1,...q2].map(w=>w.id),
     day1Qualifiers:q1.map(w=>w.id),
     day2Qualifiers:q2.map(w=>w.id),
     spots:n1+n2
   }
 }

 // DAY 3: all remaining world-team reps, regardless of continent, enter one Last Chance Qualifier.
 let lcqEntrants=remaining.filter((w,i,a)=>a.findIndex(x=>x.country===w.country)===i)
   .sort((a,b)=>freeSeedScore(b)-freeSeedScore(a)),
     fake={...t,teamPoints:t.teamPoints,brackets:t.brackets},
     lcq=simulateUWWBracket(fake,wt,lcqEntrants),
     lcqOrder=continentalQualificationOrder(lcq,lcqEntrants),
     lcqQualifiers=lcqOrder.slice(0,LAST_CHANCE_WORLD_SPOTS);

 lcqQualifiers.forEach((w,i)=>qualifierRows.push({
   wrestlerId:w.id,country:w.country,
   continent:intl.find(c=>c.name===w.country)?.continent||'',
   status:'Last Chance Qualifier',path:`Last Chance Qualifier #${i+1}`,continentalRank:null
 }));

 // 16 Day-1 + 14 Day-2 + 2 LCQ = 32. No wild cards.
 let ids=qualifierRows.map(x=>x.wrestlerId).slice(0,32);
 G.worldQualifiers[seasonYear][level]=G.worldQualifiers[seasonYear][level]||{};
 G.worldQualifiers[seasonYear][level][wt]=ids;
 setWorldQualifierMeta(seasonYear,level,wt,qualifierRows.slice(0,32));

 t.lastChance=t.lastChance||{};
 t.lastChance[wt]={...lcq,qualifiers:lcqQualifiers.map(w=>w.id),entrants:lcqEntrants.map(w=>w.id)};
 t.brackets[wt]={
   matches:[
     ...Object.values(t.continentBrackets[wt]).flatMap(x=>[...(x.day1?.matches||[]),...(x.day2?.matches||[])]),
     ...(lcq.matches||[])
   ],
   placements:ids.slice(0,8),seeds:{}
 }
}

const US_OPEN_RTC_ENTRY_LIMIT=25;


function usOpenAgeOK(w,t){
 return t.level==='U20'?(w.age||99)<20:t.level==='U23'?(w.age||99)<23:true
}
function usOpenRtcTeams(){
 return colleges.filter(c=>c.rtc||c.id===G.school)
}
function usOpenRtcPool(c,t){
 return rtcPoolByTeam(c.id).filter(w=>w.country==='USA'&&usOpenAgeOK(w,t)&&isCompetitionAvailable(w,'free'))
}
function usOpenBestWeightFor(w,counts){
 let eligible=(w.weights||[]).filter(wt=>WTS.includes(wt));
 if(!eligible.length)return null;
 // Prefer the weight where this RTC currently has fewer entries, then the wrestler's primary weight.
 return [...eligible].sort((a,b)=>(counts[a]||0)-(counts[b]||0)||WTS.indexOf(a)-WTS.indexOf(b))[0]
}

function usOpenFastSeedScore(t,w){
 t._usOpenSeedScores=t._usOpenSeedScores||{};
 if(t._usOpenSeedScores[w.id]!=null)return t._usOpenSeedScores[w.id];

 // Resume ranking is still the primary seed signal. OVR is only a microscopic deterministic
 // tiebreaker when early-season resumes are identical.
 let score=rollingFreestyleResumeScore(w,eventSeasonStartYear(t)) + ((w.free||0)/10000);
 t._usOpenSeedScores[w.id]=score;
 return score
}

function buildUsOpenRtcDelegation(c,t){
 t.usOpenDelegations=t.usOpenDelegations||{};
 if(t.usOpenDelegations[c.id])return t.usOpenDelegations[c.id];

 let pool=usOpenRtcPool(c,t).sort((a,b)=>usOpenFastSeedScore(t,b)-usOpenFastSeedScore(t,a)),
     counts=Object.fromEntries(WTS.map(w=>[w,0])),entries=[],used=new Set();

 // First pass: try to cover every weight with the best available wrestler.
 WTS.forEach(wt=>{
   let w=pool.find(x=>!used.has(x.id)&&x.weights?.includes(wt));
   if(w&&entries.length<US_OPEN_RTC_ENTRY_LIMIT){
     entries.push({wrestlerId:w.id,weight:wt});used.add(w.id);counts[wt]++
   }
 });

 // Second pass: fill remaining delegation spots with best available wrestlers,
 // distributing extras toward thinner weights.
 pool.forEach(w=>{
   if(entries.length>=US_OPEN_RTC_ENTRY_LIMIT||used.has(w.id))return;
   let wt=usOpenBestWeightFor(w,counts);if(wt==null)return;
   entries.push({wrestlerId:w.id,weight:wt});used.add(w.id);counts[wt]++
 });

 t.usOpenDelegations[c.id]=entries;
 return entries
}


function collegeHasRTC(teamId){
 let c=colleges.find(x=>x.id===teamId);
 return !!(c?.rtc||String(teamId)===String(G.school))
}

function highLevelUnattachedAmericans(t){
 // A college wrestler at a program with NO RTC is allowed to pursue freestyle unattached
 // if his freestyle OVR is above 88. Age eligibility is checked separately for each division.
 let college=(G.wrestlers||[]).filter(w=>
   w.country==='USA'&&w.team&&!collegeHasRTC(w.team)&&!w.rtcTeamId&&(w.free||0)>88&&
   usOpenAgeOK(w,t)&&isCompetitionAvailable(w,'free')
 );
 let trueFA=(G.wrestlers||[]).filter(w=>
   w.country==='USA'&&!w.team&&!w.rtcTeamId&&(w.free||0)>88&&
   usOpenAgeOK(w,t)&&isCompetitionAvailable(w,'free')
 );
 let seen=new Set();
 return [...college,...trueFA].filter(w=>!seen.has(w.id)&&seen.add(w.id))
   .sort((a,b)=>freeSeedScore(b)-freeSeedScore(a))
}

function unattachedUsOpenEntries(t){
 t.usOpenUnattached=t.usOpenUnattached||{};
 if(t.usOpenUnattached[t.level])return t.usOpenUnattached[t.level];

 let pool=highLevelUnattachedAmericans(t),
     counts=Object.fromEntries(WTS.map(w=>[w,0])),entries=[];

 pool.forEach(w=>{
   let wt=usOpenBestWeightFor(w,counts);if(wt==null)return;
   entries.push({wrestlerId:w.id,weight:wt,source:'Unattached',rtcId:null,rtcName:'Unattached'});
   counts[wt]++
 });
 t.usOpenUnattached[t.level]=entries;
 return entries
}


function allUsOpenEntries(t){
 if(t._usOpenAllEntriesCache&&t._usOpenAllEntriesCacheVersion===3){
   return t._usOpenAllEntriesCache
 }
 let entries=[];
 usOpenRtcTeams().forEach(c=>{
   let name=rtcDisplayName(c);
   entries.push(...buildUsOpenRtcDelegation(c,t).map(x=>({...x,rtcId:c.id,rtcName:name})))
 });
 entries.push(...unattachedUsOpenEntries(t).map(x=>({...x,rtcId:null,rtcName:'Unattached'})));

 if(t.squadSubmitted){
   entries=entries.filter(x=>String(x.rtcId)!==String(G.school));
   let c=colleges.find(x=>String(x.id)===String(G.school)),name=rtcDisplayName(c||G.school);
   Object.entries(t.squad||{}).forEach(([wt,ids])=>(ids||[]).forEach(id=>
     entries.push({wrestlerId:id,weight:Number(wt),rtcId:G.school,rtcName:name})
   ))
 }

 // Once the event field has been prepared/locked, affiliation lookups must be O(1)-cacheable.
 if(t.squadSubmitted||t._usOpenFieldPrepared){
   t._usOpenAllEntriesCache=entries;
   t._usOpenAllEntriesCacheVersion=3
 }
 return entries
}




function prepareUsOpenField(t){
 if(!t||!['usopen','u23us','u20us'].includes(t.id))return;

 // If the by-weight field already exists, preparation is complete. Do not invalidate it.
 if(t._usOpenFieldPrepared&&t._usOpenFieldByWeight){
   return
 }

 let started=performance.now?.()||Date.now();

 // Build one immutable event entry ledger, then one by-weight ID map.
 delete t._usOpenEntryRtcMapCache;
 let entries=allUsOpenEntries(t);

 t._usOpenFieldByWeight=Object.fromEntries(WTS.map(wt=>[wt,[]]));
 entries.forEach(x=>{
   let wt=Number(x.weight);
   if(t._usOpenFieldByWeight[wt])t._usOpenFieldByWeight[wt].push(x.wrestlerId)
 });

 // Defensive de-duplication by wrestler ID within each weight.
 WTS.forEach(wt=>{
   let seen=new Set();
   t._usOpenFieldByWeight[wt]=(t._usOpenFieldByWeight[wt]||[]).filter(id=>
     id&&!seen.has(id)&&(seen.add(id),true)
   )
 });

 t._usOpenFieldPrepared=true;
 PERF.metrics.lastUsOpenFieldBuildMs=(performance.now?.()||Date.now())-started
}

function usOpenFieldForWeight(t,wt){
 prepareUsOpenField(t);
 let ids=t._usOpenFieldByWeight?.[Number(wt)]||[],
     seen=new Set();
 return ids.map(wrestlerById).filter(w=>w&&!seen.has(w.id)&&seen.add(w.id))
   .sort((a,b)=>usOpenFastSeedScore(t,b)-usOpenFastSeedScore(t,a))
}


function usOpenFieldSummary(t){
 if(!t._usOpenFieldPrepared){
   let own=Object.values(t.squad||{}).reduce((s,a)=>s+(a?.length||0),0);
   return `<div class=notice><b>U.S. Open:</b> your RTC squad is locked (${own} entries). The full national field is generated lazily when the first bracket is created.</div>`
 }
 let entries=allUsOpenEntries(t),
     counts=Object.fromEntries(WTS.map(wt=>[wt,0]));
 entries.forEach(x=>{if(counts[Number(x.weight)]!=null)counts[Number(x.weight)]++});
 let unattached=entries.filter(x=>!x.rtcId).length,
     rtcEntries=entries.length-unattached;
 return `<div class=notice><b>U.S. Open field:</b> ${entries.length} total entries — ${rtcEntries} RTC entries + ${unattached} unattached/non-RTC college entries. ${WTS.map(wt=>`${wt}: ${counts[wt]}`).join(' • ')}</div>`
}

function seedFreeWeight(t,wt){
 let pool=[];
 if(['usopen','u23us','u20us'].includes(t.id)){
   // Senior, U23 and U20 U.S. Opens use the SAME entry rules:
   // RTC delegations + high-level unattached/non-RTC-college Americans.
   pool=usOpenFieldForWeight(t,wt)
 }else if(['worlds','u23worlds','u20worlds'].includes(t.id)){
   pool=worldQualifierField(t.level,wt,t.year)
 }else{
   intl.forEach(ct=>{let selected=nationalStarter(ct.id,t.level,wt);if(selected)pool.push(selected)})
 }
 let seen=new Set();pool=pool.filter(w=>w&&!seen.has(w.id)&&seen.add(w.id)).sort((a,b)=>freeSeedScore(b)-freeSeedScore(a));
 return ['worlds','u23worlds','u20worlds'].includes(t.id)?pool.slice(0,worldFieldSize(t.level)):pool
}



function validateNcaaSeedTree(){
 let r32=ncaa32BracketSeedOrder(),
     winners1=[];
 for(let i=0;i<r32.length;i+=2)winners1.push(Math.min(r32[i],r32[i+1]));
 let winners2=[];
 for(let i=0;i<winners1.length;i+=2)winners2.push(Math.min(winners1[i],winners1[i+1]));
 let winners3=[];
 for(let i=0;i<winners2.length;i+=2)winners3.push(Math.min(winners2[i],winners2[i+1]));
 return {
   r16:winners1,
   qf:winners2,
   sf:winners3,
   valid:
     winners1.join(',')==='1,16,8,9,4,13,5,12,2,15,7,10,3,14,6,11' &&
     winners2.join(',')==='1,8,4,5,2,7,3,6' &&
     winners3.join(',')==='1,4,2,3'
 }
}

function simulateFolkBracket(t,wt,entrants,isNcaa=false){
 if(isNcaa&&!validateNcaaSeedTree().valid)throw new Error('NCAA seed tree configuration invalid');
 let matches=[],players=[...entrants];

 // NCAA 33-man pigtail/outbracket remains outside the double-elimination field.
 // Per game rule, its loser is eliminated and does not enter wrestlebacks.
 if(isNcaa&&players.length>=33){
   let a=players[31],b=players[32],r=simBout(a,b,'folk');
   matches.push({round:'Outbracket (33 vs 32)',a:a.id,b:b.id,winner:r.winner.id,loser:r.loser.id,score:r.score,method:r.method,side:'Championship'});
   logBout(t,wt,'Outbracket',r,true);
   players=players.slice(0,31).concat([r.winner])
 }

 let size=nextPow2(Math.max(2,players.length));if(isNcaa)size=32;
 // NCAA entrants arrive already ordered by their official NCAA seeds 1-33.
 // Never re-sort them by national ranking / résumé / OVR inside the NCAA bracket.
 // After the #32 vs #33 outbracket, its winner inherits the #32 bracket position.
 let cur=isNcaa
   ?fixedSeedBracketOrder(32).map(seedNo=>players[seedNo-1]||null)
   :seededOrder(players.slice(0,size),size,'folk'),
     roundNames=size===64?['Round of 64','Round of 32','Round of 16','Quarterfinal','Semifinal','Final']:
                size===32?['Round of 32','Round of 16','Quarterfinal','Semifinal','Final']:
                size===16?['Round of 16','Quarterfinal','Semifinal','Final']:
                size===8?['Quarterfinal','Semifinal','Final']:
                size===4?['Semifinal','Final']:['Final'],
     lossesByRound=[];

 // ---------------- Championship bracket ----------------
 for(let ri=0;cur.length>1;ri++){
   let next=[],loss=[],rn=roundNames[ri]||`Championship Round ${ri+1}`;
   for(let i=0;i<cur.length;i+=2){
     let a=cur[i],b=cur[i+1],r=simBout(a,b,'folk');
     let champNode=`CH-${ri}-${Math.floor(i/2)}`;
     matches.push({nodeId:champNode,round:rn,a:a?.id||null,b:b?.id||null,winner:r.winner?.id||null,loser:r.loser?.id||null,score:r.score,method:r.method,side:'Championship'});
     if(r.loser)loss.push(r.loser);
     if(r.winner)next.push(r.winner);
     logBout(t,wt,rn,r,true)
   }
   lossesByRound.push(loss);
   cur=next
 }

 let champ=cur[0],
     finalStored=matches.find(m=>m.side==='Championship'&&m.round==='Final'),
     runner=finalStored?resW(finalStored.loser):null,
     openingRoundHadByes=players.length<size;

 // ---------------- NCAA-style wrestlebacks ----------------
 // Real folkstyle wrestlebacks alternate:
 //   1) an "internal" consolation round among earlier championship losers,
 //   2) a crossover round where those survivors meet the NEXT championship drop-ins,
 //   3) another internal consolation round,
 //   4) next crossover, etc.
 //
 // Example, 32-man field:
 // R32 losers -> C1
 // C1 winners vs R16 losers -> C2
 // C2 winners vs each other -> C3
 // C3 winners vs QF losers -> C4
 // C4 winners vs each other -> C5
 // C5 winners vs SF losers -> C6 (consolation semifinals)
 //
 // If an opening championship round contains byes, losers from that preliminary
 // bye-containing round are eliminated per this game's established rule. The
 // wrestleback ladder begins with the first full power-of-two championship round.
 let feeds=[];
 lossesByRound.forEach((ls,ri)=>{
   // Championship Final loser is runner-up, never a consolation entrant.
   if(ri===lossesByRound.length-1)return;
   if(ri===0&&openingRoundHadByes)return;
   let clean=ls.filter(w=>w&&w.id!==runner?.id);
   if(clean.length)feeds.push(clean)
 });

 let conRoundNo=1,active=[],conRounds=[];

 function runConRound(wrestlers,label){
   let next=[],roundMatches=[],roundLosers=[];
   for(let i=0;i<wrestlers.length;i+=2){
     if(!wrestlers[i+1]){next.push(wrestlers[i]);continue}
     let a=wrestlers[i],b=wrestlers[i+1],r=simBout(a,b,'folk'),
         row={nodeId:`WB-${conRoundNo}-${Math.floor(i/2)}`,round:label,a:a.id,b:b.id,winner:r.winner.id,loser:r.loser.id,score:r.score,method:r.method,side:'Wrestlebacks'};
     matches.push(row);roundMatches.push(row);roundLosers.push(r.loser);
     logBout(t,wt,label,r,false);next.push(r.winner)
   }
   conRounds.push({label,matches:roundMatches,losers:roundLosers,winners:[...next]});
   return next
 }

 if(feeds.length){
   // First eligible championship losers form Consolation Round 1.
   active=runConRound(feeds[0],`Wrestleback ${conRoundNo++}`);

   for(let fi=1;fi<feeds.length;fi++){
     // Crossover: each prior consolation survivor meets a wrestler newly dropping
     // from the championship bracket.
     let incoming=[...feeds[fi]],
         // Fixed bracket topology: each prior consolation survivor has a
         // predetermined crossover destination against the NEXT championship drop-in.
         // We do not pair survivors by rank, OVR, or array order after results occur.
         cross=fixedConsolationCrossover(active,incoming,size,fi);
     let wbLabel=(t.id==='ncaa'&&fi===2)?'Blood Round':`Wrestleback ${conRoundNo++}`;
     if(wbLabel==='Blood Round')conRoundNo++;
     active=runConRound(cross,wbLabel);

     // Unless this was the semifinal drop-in (the final crossover), survivors now
     // wrestle one another before the next set of championship losers enters.
     if(fi<feeds.length-1){
       active=runConRound(active,`Wrestleback ${conRoundNo++}`)
     }
   }
 }

 // ---------------- Placement matches ----------------
 // For normal 8/16/32/64 brackets, the LAST consolation crossover produces four
 // wrestlers: two winners for the 3rd-place match and two losers for the 5th-place
 // match. The immediately previous internal consolation round supplies the two
 // wrestlers for 7th place.
 let placements=[champ,runner],r3=null,r5=null,r7=null;

 if(conRounds.length){
   let last=conRounds[conRounds.length-1];

   if(last.matches.length>=2){
     let thirdPool=last.matches.map(m=>resW(m.winner)).filter(Boolean),
         fifthPool=last.matches.map(m=>resW(m.loser)).filter(Boolean);
     if(thirdPool.length>=2)r3=simBout(thirdPool[0],thirdPool[1],'folk');
     if(fifthPool.length>=2)r5=simBout(fifthPool[0],fifthPool[1],'folk');

     if(!t.noSeventhPlace&&conRounds.length>=2){
       let prev=conRounds[conRounds.length-2],
           seventhPool=prev.matches.map(m=>resW(m.loser)).filter(Boolean);
       if(seventhPool.length>=2)r7=simBout(seventhPool[0],seventhPool[1],'folk')
     }
   }else if(last.matches.length===1){
     // Tiny 4-man field: the only consolation bout directly determines 3rd/4th.
     placements.push(resW(last.matches[0].winner),resW(last.matches[0].loser))
   }
 }

 // Championship Final must always be the final match displayed/wrestled.
 matches=matches.filter(m=>!(m.side==='Championship'&&m.round==='Final'));

 // Classification order: 7th, then 5th, then 3rd, then championship Final.
 if(r7){
   matches.push({round:'7th Place Match',a:r7.winner.id,b:r7.loser.id,winner:r7.winner.id,loser:r7.loser.id,score:r7.score,method:r7.method,side:'Placement'});
   logBout(t,wt,'7th Place Match',r7,false)
 }
 if(r5){
   matches.push({round:'5th Place Match',a:r5.winner.id,b:r5.loser.id,winner:r5.winner.id,loser:r5.loser.id,score:r5.score,method:r5.method,side:'Placement'});
   logBout(t,wt,'5th Place Match',r5,false)
 }
 if(r3){
   matches.push({round:'3rd Place Match',a:r3.winner.id,b:r3.loser.id,winner:r3.winner.id,loser:r3.loser.id,score:r3.score,method:r3.method,side:'Placement'});
   logBout(t,wt,'3rd Place Match',r3,false)
 }

 if(finalStored)matches.push(finalStored);

 // Exact unique folkstyle places.
 if(r3){
   placements=[champ,runner,r3.winner,r3.loser];
   if(r5)placements.push(r5.winner,r5.loser);
   if(r7)placements.push(r7.winner,r7.loser)
 }
 placements=placements.filter(Boolean).slice(0,8);

 placements.forEach((w,i)=>{
   if(!w)return;
   let tm=w.team;
   t.teamPoints[tm]=(t.teamPoints[tm]||0)+ncaaPlacementPoints(i+1)
 });

 return {
   matches,
   placements:placements.map(w=>w?.id||null),
   seeds:Object.fromEntries(entrants.map((w,i)=>[w.id,i+1])),
   topology:{
     fixedSeedSlots:fixedSeedBracketOrder(size),
     fixedWinnerPaths:true,
     fixedLoserPaths:true,
     reseeding:false
   }
 }
}

function uwwRoundName(fieldSize){

}

function simulateUWWBracket(t,wt,entrants){
 let matches=[],size=nextPow2(Math.max(2,entrants.length)),cur=seededOrder(entrants,size,'free'),lostTo={};

 // Simulate championship side only through the semifinals.
 // The two finalists are held back so the medal session can ALWAYS finish:
 // Bronze 1 -> Bronze 2 -> Gold Medal Match.
 for(let ri=0;cur.length>2;ri++){
   let currentSize=cur.length,rn=uwwRoundName(currentSize),next=[];
   for(let i=0;i<cur.length;i+=2){
     let a=cur[i],b=cur[i+1];

     if(a&&!b){
       matches.push({round:rn,a:a.id,b:null,winner:a.id,loser:null,score:'BYE',method:'Bye',side:'Championship'});
       next.push(a);continue
     }
     if(b&&!a){
       matches.push({round:rn,a:null,b:b.id,winner:b.id,loser:null,score:'BYE',method:'Bye',side:'Championship'});
       next.push(b);continue
     }
     if(!a&&!b)continue;

     let r=simBout(a,b,'free');
     matches.push({round:rn,a:a.id,b:b.id,winner:r.winner?.id||null,loser:r.loser?.id||null,score:r.score,method:r.method,side:'Championship'});
     if(r.loser&&r.winner){
       lostTo[r.winner.id]=lostTo[r.winner.id]||[];
       lostTo[r.winner.id].push(r.loser)
     }
     if(r.winner)next.push(r.winner);
     if(r.winner&&r.loser)logBout(t,wt,rn,r,true)
   }
   cur=next
 }

 let finalists=cur.filter(Boolean),
     bronzeW=[],bronzeL=[],
     bronzeMatches=[];

 // Complete both repechage paths before the medal matches.
 // Each finalist's pre-final victims form that finalist-side repechage path.
 finalists.forEach((finalist,side)=>{
   if(!finalist)return;
   let chain=[...(lostTo[finalist.id]||[])];
   if(!chain.length)return;

   let survivor=chain[0];
   for(let i=1;i<chain.length;i++){
     let r=simBout(survivor,chain[i],'free'),rn=`Repechage ${side+1}.${i}`;
     matches.push({round:rn,a:survivor.id,b:chain[i].id,winner:r.winner?.id,loser:r.loser?.id,score:r.score,method:r.method,side:'Repechage'});
     if(r.winner&&r.loser)logBout(t,wt,rn,r,false);
     survivor=r.winner||survivor
   }

   let semiLoser=chain[chain.length-1],
       opp=survivor.id===semiLoser.id?(chain[chain.length-2]||survivor):semiLoser;

   if(opp&&opp.id!==survivor.id){
     let r=simBout(survivor,opp,'free'),rn=`Bronze Medal Match ${side+1}`;
     bronzeMatches.push({round:rn,a:survivor.id,b:opp.id,winner:r.winner?.id,loser:r.loser?.id,score:r.score,method:r.method,side:'Medal Matches',_result:r});
     if(r.winner)bronzeW.push(r.winner);
     if(r.loser)bronzeL.push(r.loser)
   }else{
     // Defensive fallback for an unusually short repechage path.
     bronzeW.push(survivor)
   }
 });

 // Guarantee TWO bronze medal bout slots immediately before the final whenever
 // the field topology supplies two valid medal bouts.
 bronzeMatches.sort((a,b)=>String(a.round).localeCompare(String(b.round)));
 bronzeMatches.forEach(m=>{
   matches.push({round:m.round,a:m.a,b:m.b,winner:m.winner,loser:m.loser,score:m.score,method:m.method,side:m.side});
   if(m._result?.winner&&m._result?.loser)logBout(t,wt,m.round,m._result,false)
 });

 // GOLD MEDAL MATCH IS ALWAYS THE FINAL BOUT OF THE WEIGHT.
 let champ=null,runner=null;
 if(finalists.length===2){
   let r=simBout(finalists[0],finalists[1],'free'),rn='Gold Medal Match';
   matches.push({round:rn,a:finalists[0].id,b:finalists[1].id,winner:r.winner?.id,loser:r.loser?.id,score:r.score,method:r.method,side:'Medal Matches'});
   if(r.winner&&r.loser)logBout(t,wt,rn,r,true);
   champ=r.winner||null;runner=r.loser||null
 }else{
   champ=finalists[0]||null
 }

 let placements=[champ,runner,...bronzeW,...bronzeL].filter(Boolean);
 placements.forEach((w,i)=>{
   let place=i===0?1:i===1?2:i<=3?3:i<=5?5:i+1;
   if(!['usopen','u23us','u20us'].includes(t.id)){
     let national=intl.find(x=>x.name===w.country),
         tm=national?.id||w.intlTeam||null;
     if(tm)t.teamPoints[tm]=(t.teamPoints[tm]||0)+uwwPlacementPoints(place)
   }
 });
 return {
   matches,
   placements:placements.map(w=>w.id),
   seeds:Object.fromEntries(entrants.map((w,i)=>[w.id,i+1])),
   fieldSize:entrants.length,
   bracketSize:size,
   topology:{
     fixedSeedSlots:fixedSeedBracketOrder(size),
     fixedWinnerPaths:true,
     fixedLoserPaths:true,
     reseeding:false,
     medalSessionOrder:['Bronze Medal Match 1','Bronze Medal Match 2','Gold Medal Match']
   }
 }
}

function folkBracketRoundSessions(t,wt){
 let b=t.brackets?.[wt];
 if(!b?.matches)return [];
 let unique=(side)=>[...new Set(b.matches.filter(m=>m.side===side).map(m=>`${m.side} — ${m.round}`))],
     champ=unique('Championship'),
     cons=unique('Wrestlebacks'),
     placement=unique('Placement');

 if(t.style!=='folk')return [...champ,...cons,...placement].map(k=>[k]);

 let finalKey=champ.find(k=>/ — Final$/.test(k))||null,
     front=champ.filter(k=>k!==finalKey),
     sessions=[],ci=0;

 // Opening frontside round first.
 if(front.length)sessions.push([front[0]]);

 // Beginning with the next championship round, pair one ready consolation round
 // with each frontside round. For a standard 16-man bracket this gives:
 // R16 / then QF+C1 / then SF+C2.
 for(let i=1;i<front.length;i++){
   let s=[front[i]];
   if(ci<cons.length)s.push(cons[ci++]);
   sessions.push(s)
 }

 // Remaining consolation rounds are sequentially dependent and therefore each
 // become their own session.
 while(ci<cons.length)sessions.push([cons[ci++]]);

 // Place matches all occur before the championship Final, in mat-order:
 // 7th -> 5th -> 3rd.
 let orderedPlacement=[];
 ['7th Place Match','5th Place Match','3rd Place Match'].forEach(label=>{
   let k=placement.find(x=>x.endsWith(` — ${label}`));
   if(k)orderedPlacement.push(k)
 });
 if(orderedPlacement.length)sessions.push(orderedPlacement);

 // The championship Final is ALWAYS last.
 if(finalKey)sessions.push([finalKey]);
 return sessions
}


function folkBracketSessionLabel(t,wt,index){
 let s=folkBracketRoundSessions(t,wt)[index]||[];
 return s.map(k=>k.replace(/^.*? — /,'')).join(' + ')||'Next Session'
}

function bracketRoundOrder(t,wt){
 let b=t.brackets?.[wt];
 if(!b||!b.matches)return [];
 let seen=[];
 b.matches.forEach(m=>{let key=m.side+' — '+m.round;if(!seen.includes(key))seen.push(key)});
 return seen
}
function ensureTournamentProgress(t){
 t.progress=t.progress||{};
 WTS.forEach(wt=>{
   if(!t.progress[wt])t.progress[wt]={generated:false,shownRounds:0,complete:false};
   let p=t.progress[wt],b=t.brackets?.[wt];
   if(b){
     p.generated=true;
     // If this weight was already marked complete by synchronized simulation,
     // always expose every stored session when the user later opens the event.
     if(p.complete){
       let sessions=t.style==='folk'
         ?folkBracketRoundSessions(t,wt)
         :bracketRoundOrder(t,wt).map(k=>[k]);
       p.shownRounds=Math.max(p.shownRounds||0,sessions.length)
     }
   }
 });
 // Repair stale event-level completion flags from synchronized/background sims.
 if(WTS.every(wt=>t.progress[wt]?.complete))t.simulated=true
}

function squadEligibleWeights(t,w){
 if(!w||!isCompetitionAvailable(w,t.style==='folk'?'folk':'free'))return [];
 if(t.style!=='folk'&&!squadAgeOK(t,w))return [];
 return (w.weights||[]).map(Number).filter(wt=>WTS.includes(wt))
}


function currentCollegeAssignedWeight(w){
 if(!w||w.team!==G.school)return null;
 // Saved college lineup is the source of truth.
 G.depthChart=normalizeExclusiveDepthChart(G.depthChart||{},G.school);
 for(let wt of WTS){
   let ids=G.depthChart[wt]||[];
   if(ids[0]===w.id)return Number(wt)
 }
 // Defensive fallback: if he is not the starter, preserve whichever weight
 // he currently occupies in the saved depth chart.
 for(let wt of WTS){
   if((G.depthChart[wt]||[]).includes(w.id))return Number(wt)
 }
 return null
}
function currentRtcAssignedWeight(t,w){
 if(!w)return null;
 let mode=t?.id==='u20us'?'u20':t?.id==='u23us'?'u23':'senior',
     chart=typeof lineupChart==='function'?lineupChart(mode):null;
 if(!chart)return null;
 for(let wt of WTS){
   let ids=chart[wt]||[];
   if(ids[0]===w.id)return Number(wt)
 }
 for(let wt of WTS){
   if((chart[wt]||[]).includes(w.id))return Number(wt)
 }
 return null
}
function currentSquadDefaultWeight(t,w){
 let opts=squadEligibleWeights(t,w);if(!opts.length)return null;
 let preferred=t.style==='folk'?currentCollegeAssignedWeight(w):currentRtcAssignedWeight(t,w);
 return opts.includes(Number(preferred))?Number(preferred):opts[0]
}

function ensureSquadWeightAssignments(t){
 ensureSquad(t);
 let firstSetup=!t.squadWeightAssignmentsInitialized;
 t.squadWeightAssignments=t.squadWeightAssignments||{};

 // First guarantee that one wrestler is never selected at two different weights.
 let selectedAt=new Map();
 WTS.forEach(wt=>{
   let clean=[];
   (t.squad[wt]||[]).forEach(id=>{
     if(selectedAt.has(id))return;
     selectedAt.set(id,wt);clean.push(id)
   });
   t.squad[wt]=clean
 });

 let pool=t.style==='folk'
   ?myRoster().filter(w=>isCompetitionAvailable(w,'folk'))
   :rtcSquadPool(t);

 pool.forEach(w=>{
   let opts=squadEligibleWeights(t,w);
   if(!opts.length)return;
   let selected=selectedAt.get(w.id),
       current=Number(t.squadWeightAssignments[w.id]);

   // Checked/selected wrestlers always display at the weight where they are entered.
   if(selected!=null&&opts.includes(Number(selected))){
     t.squadWeightAssignments[w.id]=Number(selected)
   }else if(!firstSetup&&opts.includes(current)){
     // After the squad screen has been opened, preserve any manual ←/→ move.
     t.squadWeightAssignments[w.id]=current
   }else{
     // First time this tournament's squad screen opens: mirror the user's
     // current saved college/RTC lineup assignment whenever possible.
     t.squadWeightAssignments[w.id]=currentSquadDefaultWeight(t,w)
   }
 });
 t.squadWeightAssignmentsInitialized=true
}

function switchSquadWeight(id,currentWt){
 let t=getEvent();
 if(!t||t.squadSubmitted)return;
 ensureSquad(t);ensureSquadWeightAssignments(t);

 let w=wrestlerById(id);if(!w)return;
 let opts=squadEligibleWeights(t,w);
 if(opts.length<2)return;

 currentWt=Number(currentWt);
 let current=Number(t.squadWeightAssignments[id]);
 if(!opts.includes(current))current=currentWt;
 let idx=opts.indexOf(current);
 let target=opts[(idx+1)%opts.length];

 // If he is already checked/entered, move that tournament entry too.
 let selected=false;
 WTS.forEach(wt=>{
   let arr=t.squad[wt]||[];
   if(arr.includes(id))selected=true;
   t.squad[wt]=arr.filter(x=>x!==id)
 });
 if(selected){
   t.squad[target]=t.squad[target]||[];
   t.squad[target].push(id)
 }

 t.squadWeightAssignments[id]=target;
 saveGame();
 eventPage()
}

function moveSquadWeight(id,currentWt){
 switchSquadWeight(id,currentWt)
}

function squadWeightArrow(t,w,currentWt){
 let opts=squadEligibleWeights(t,w);
 if(opts.length<2)return '';
 let current=Number(currentWt),target=opts.find(x=>x!==current);
 if(target==null)return '';
 return WTS.indexOf(target)>WTS.indexOf(current)?'→':'←'
}

function submitSquad(){

 WTS.forEach(wt=>{

const NCAA_AUTO_ALLOCATIONS={'BIG TEN':6,'BIG12':6,'PAC12':5,'ACC':5,'EIWA':4,'SEC':3,'MAC':1};


function ncaaAllocationTotal(){return Object.values(NCAA_AUTO_ALLOCATIONS).reduce((a,b)=>a+b,0)}

function conferenceWildcardStore(year=G.year){
 G.conferenceWildcards=G.conferenceWildcards||{};
 G.conferenceWildcards[year]=G.conferenceWildcards[year]||{};
 return G.conferenceWildcards[year]
}
function teamConferenceStarters(teamId){
 let out={};
 WTS.forEach(wt=>out[wt]=conferenceStarterAtWeight(teamId,wt));
 return out
}
function eligibleConferenceWildcardChoices(teamId){
 let starters=teamConferenceStarters(teamId),starterIds=new Set(Object.values(starters).filter(Boolean).map(w=>w.id));
 return rosterByTeam(teamId)
   .filter(w=>!starterIds.has(w.id)&&isCompetitionAvailable(w,'folk')&&!w.redshirtActive)
   .flatMap(w=>(w.weights||[]).filter(wt=>WTS.includes(wt)).map(wt=>({w,weight:wt})))
}
function autoConferenceWildcard(teamId,conf=null,year=G.year){
 let choices=eligibleConferenceWildcardChoices(teamId);
 if(!choices.length)return null;
 let conference=conf||colleges.find(c=>c.id===teamId)?.conf;
 // Prefer quality, but also value weights where the backup has a better path through the field.
 let scored=choices.map(x=>{
   let opp=colleges.filter(c=>c.conf===conference&&c.id!==teamId)
     .map(c=>conferenceStarterAtWeight(c.id,x.weight)).filter(Boolean);
   let avg=opp.length?opp.reduce((s,w)=>s+(w.folk||0),0)/opp.length:75;
   let path=(x.w.folk||0)-avg;
   return {...x,score:collegeSeedScore(x.w)+path*.85+rnd(-1,1)}
 }).sort((a,b)=>b.score-a.score);
 let best=scored[0];
 return best?{wrestlerId:best.w.id,weight:best.weight,auto:true}:null
}
function getConferenceWildcard(teamId,year=G.year){
 let store=conferenceWildcardStore(year),saved=store[teamId];
 if(saved){
   let w=wrestlerById(saved.wrestlerId);
   let starterIds=new Set(Object.values(teamConferenceStarters(teamId)).filter(Boolean).map(x=>x.id));
   if(w&&w.team===teamId&&!starterIds.has(w.id)&&w.weights?.includes(Number(saved.weight))&&isCompetitionAvailable(w,'folk')&&!w.redshirtActive)return saved
 }
 if(teamId===G.school)return null;
 let c=colleges.find(x=>x.id===teamId),auto=autoConferenceWildcard(teamId,c?.conf,year);
 if(auto)store[teamId]=auto;
 return auto
}
function setConferenceWildcardValue(value){
 let currentEvent=getEvent();
 if(currentEvent?.id==='conf'&&Object.values(currentEvent.progress||{}).some(x=>x?.generated)){
   showAdvanceBlocker('Conference brackets have already been generated, so the wildcard is locked.','Wildcard Locked');
   return
 }
 let store=conferenceWildcardStore(G.year);
 if(!value){delete store[G.school];saveGame();if(getEvent()?.id==='conf')eventPage();else collegeLineup();return}
 let [id,wt]=String(value).split('|');
 let w=wrestlerById(id),weight=Number(wt);
 if(!w||w.team!==G.school||!w.weights?.includes(weight)||w.redshirtActive)return;
 let starters=teamConferenceStarters(G.school);
 if(Object.values(starters).some(x=>x?.id===w.id))return;
 store[G.school]={wrestlerId:w.id,weight,auto:false};
 saveGame();if(getEvent()?.id==='conf')eventPage();else collegeLineup()
}

function canonicalConference(conf){
 let s=String(conf||'').trim().toUpperCase().replace(/[\s_-]+/g,' ');
 if(s==='BIG TEN'||s==='BIG10'||s==='B1G')return 'BIG TEN';
 if(s==='BIG 12'||s==='BIG12')return 'BIG12';
 if(s==='PAC 12'||s==='PAC12'||s==='PACIFIC 12')return 'PAC12';
 return s
}
function conferenceAllocationSpots(conf){
 return NCAA_AUTO_ALLOCATIONS[canonicalConference(conf)]||0
}
function invalidateNcaaWeightSelection(year,wt){
 let q=G.ncaaQualification?.[year];
 if(!q)return;
 if(q.weights)delete q.weights[wt];
 q.announced=false
}
function syncConferenceChampionshipWeight(year,wt){
 G.ncaaQualification=G.ncaaQualification||{};
 G.ncaaQualification[year]=G.ncaaQualification[year]||{weights:{},announced:false};
 let q=G.ncaaQualification[year];
 q.conferenceResults=q.conferenceResults||{};
 Object.keys(NCAA_AUTO_ALLOCATIONS).forEach(conf=>{
   delete q.conferenceResults[`${canonicalConference(conf)}-${wt}`];
   conferenceChampionshipFinish(conf,wt,year)
 });
 invalidateNcaaWeightSelection(year,wt)
}

function conferenceEntrantsForWeight(conf,wt,year=currentSeasonStartYear()){
 conf=canonicalConference(conf);let entrants=[],seen=new Set();
 colleges.filter(c=>canonicalConference(c.conf)===conf).forEach(c=>{
   let starter=conferenceStarterAtWeight(c.id,wt);
   if(starter&&!seen.has(starter.id)){entrants.push(starter);seen.add(starter.id)}
 });
 return entrants.sort((a,b)=>collegeSeedScore(b)-collegeSeedScore(a))
}



function conferenceStarterAtWeight(teamId,wt){
 if(teamId===G.school){
   let ids=G.depthChart?.[wt]||[];
   let w=ids.map(wrestlerById).find(x=>x&&x.team===teamId&&x.weights?.includes(wt)&&isCompetitionAvailable(x,'folk'));
   if(w)return w
 }
 let id=optimizedCollegeStarterMap(teamId)[wt];
 return id?wrestlerById(id):null
}


function gaussianNoise(){
 let u=0,v=0;
 while(u===0)u=Math.random();
 while(v===0)v=Math.random();
 return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)
}

function conferenceChampionshipFinish(conf,wt,year){
 conf=canonicalConference(conf);
 G.ncaaQualification=G.ncaaQualification||{};
 G.ncaaQualification[year]=G.ncaaQualification[year]||{weights:{},announced:false};
 let q=G.ncaaQualification[year],key=`${conf}-${wt}`;
 q.conferenceResults=q.conferenceResults||{};
 if(q.conferenceResults[key])return q.conferenceResults[key];

 let teams=colleges.filter(c=>canonicalConference(c.conf)===conf),
     entrants=conferenceEntrantsForWeight(conf,wt,year);

 // Use the actual on-screen conference championship whenever that weight has been completed.
 let actual=Object.values(G.tournaments||{}).find(ev=>
   ev?.id==='conf' &&
   eventSeasonStartYear(ev)===year &&
   canonicalConference(ev.conference||'')===conf &&
   ev.brackets?.[wt]?.placements?.length
 );
 let placed=[];
 if(actual && (actual.progress?.[wt]?.complete || actual.simulated)){
   placed=(actual.brackets[wt].placements||[]).map(wrestlerById).filter(Boolean)
     .filter(w=>w.team&&teams.some(c=>c.id===w.team))
 }

 if(!placed.length && entrants.length){
   // Every other conference is simulated as an actual folkstyle championship bracket,
   // not as a résumé sort. This keeps all conference championships synchronized under the hood.
   let shadow={id:'conf_shadow',style:'folk',conference:conf,noSeventhPlace:false,teamPoints:{}},
       bracket=simulateFolkBracket(shadow,wt,[...entrants],false);
   placed=(bracket?.placements||[]).map(x=>typeof x==='object'?x:wrestlerById(x)).filter(Boolean)
 }
 if(!placed.length)placed=[...entrants];

 q.conferenceResults[key]=placed.map((w,i)=>({
   wrestlerId:w.id,teamId:w.team,place:i+1,conference:conf,weight:wt
 }));
 return q.conferenceResults[key]
}


function folkSeasonLogs(w,seasonYear=currentSeasonStartYear()){
 return (w?.matchHistory||[]).filter(m=>matchSeasonStartYear(m)===seasonYear&&matchStyle(m)==='folk')
}

function wrestlerResumeMetrics(w,year=currentSeasonStartYear()){
 let logs=folkSeasonLogs(w,year),
     wins=logs.filter(m=>m.result==='W').length,
     losses=logs.filter(m=>m.result==='L').length,
     total=wins+losses,
     qualityWins=0,eliteWins=0,badLosses=0,
     oppOvrTotal=0,oppPctTotal=0,oppCount=0;

 logs.forEach(m=>{
   let o=wrestlerById(m.opponentId);if(!o)return;
   let oppOvr=Number(m.opponentOvr??o.folk??70),
       oppRec=styleSeasonRecord(o,'folk',year),
       oppPct=oppRec.total?oppRec.pct:.5;

   oppOvrTotal+=oppOvr;
   oppPctTotal+=oppPct;
   oppCount++;

   if(m.result==='W'&&oppOvr>=82)qualityWins++;
   if(m.result==='W'&&oppOvr>=90)eliteWins++;
   if(m.result==='L'&&oppOvr<76)badLosses++
 });

 return {
   wins,losses,total,pct:total?wins/total:.5,
   qualityWins,eliteWins,badLosses,
   avgOppOvr:oppCount?oppOvrTotal/oppCount:70,
   avgOppPct:oppCount?oppPctTotal/oppCount:.5
 }
}

function conferenceFinishBonus(place){
 return ({1:15,2:11,3:8,4:6,5:4.5,6:3,7:2,8:1})[place]||0
}
function wildCardResumeScore(r,year=currentSeasonStartYear()){
 let base=ncaaSeedResumeScore(r,year),
     // Missing the AQ line matters, but a clearly superior résumé can still win a WC.
     nearCutBonus=({1:6,2:5,3:4,4:3,5:2,6:1})[r.place]||0;
 return base+nearCutBonus
}

function headToHeadEdge(a,b,year=currentSeasonStartYear()){
 let logs=folkSeasonLogs(a,year).filter(m=>m.opponentId===b.id);
 let aw=logs.filter(m=>m.result==='W').length,al=logs.filter(m=>m.result==='L').length;
 return aw-al
}



function ncaaSeedResumeScore(entry,year=currentSeasonStartYear()){
 let w=entry?.w||wrestlerById(entry?.wrestlerId);
 if(!w)return -9999;
 let m=wrestlerResumeMetrics(w,year),
     confPlace=entry.place??entry.conferencePlace??99,
     confBonus=({1:10,2:7,3:5,4:3.5,5:2.2,6:1.2,7:.6,8:.2})[confPlace]||0,
     schedule=((m.avgOppOvr-75)*.34)+((m.avgOppPct-.5)*18);

 // NCAA seeding should reward the season actually wrestled:
 // win percentage and few losses dominate, then conference finish,
 // quality wins and schedule strength. Raw match volume is capped.
 return m.pct*100
   +Math.min(m.wins,35)*.28
   -m.losses*1.10
   +m.qualityWins*1.25
   +m.eliteWins*1.15
   -m.badLosses*2.25
   +confBonus
   +schedule
}

function ncaaNationalResumeScore(entry,year=G.year){
 return ncaaSeedResumeScore(entry,year)
}

function ncaaSeedComparator(a,b,year=currentSeasonStartYear()){
 let as=ncaaSeedResumeScore(a,year),
     bs=ncaaSeedResumeScore(b,year),
     diff=as-bs;

 // Resume is primary. Only when two wrestlers are genuinely close does
 // head-to-head break the tie.
 if(Math.abs(diff)<=3.0){
   let aw=a.w||wrestlerById(a.wrestlerId),
       bw=b.w||wrestlerById(b.wrestlerId),
       h=headToHeadEdge(aw,bw,year);
   if(h!==0)return -h
 }
 if(Math.abs(diff)>.001)return bs-as;

 // Rare deep tiebreakers: better conference finish, then fewer losses, then more wins.
 let am=wrestlerResumeMetrics(a.w||wrestlerById(a.wrestlerId),year),
     bm=wrestlerResumeMetrics(b.w||wrestlerById(b.wrestlerId),year),
     ap=a.place??a.conferencePlace??99,
     bp=b.place??b.conferencePlace??99;
 return ap-bp || am.losses-bm.losses || bm.wins-am.wins
}

function ensureNcaaSelection(year=currentSeasonStartYear()){
 G.ncaaQualification=G.ncaaQualification||{};
 G.ncaaQualification[year]=G.ncaaQualification[year]||{weights:{},announced:false};
 let q=G.ncaaQualification[year];

 WTS.forEach(wt=>{
   if(q.weights[wt]?.field?.length===33 && (q.weights[wt]?.wildCards||[]).length===3)return;

   let autos=[],nonQualifiers=[];
   Object.entries(NCAA_AUTO_ALLOCATIONS).forEach(([conf,spots])=>{
     conf=canonicalConference(conf);
     let results=conferenceChampionshipFinish(conf,wt,year);
     results.forEach(r=>(r.place<=spots?autos:nonQualifiers).push({...r,status:r.place<=spots?'Automatic':'Non-Qualifier'}))
   });

   let wildcardBoard=nonQualifiers.map(r=>({...r,resume:wildCardResumeScore(r,year)}))
     .sort((a,b)=>b.resume-a.resume||a.place-b.place);
   let wild=wildcardBoard.slice(0,3).map(r=>({...r,status:'Wild Card'})),
       firstOut=wildcardBoard.slice(3,6).map(r=>({...r,status:'First Out'}));

   let field=[...autos,...wild].map(r=>({...r,w:wrestlerById(r.wrestlerId)})).filter(x=>x.w);
   field.sort((a,b)=>ncaaSeedComparator(a,b,year));
   field.forEach((x,i)=>x.seed=i+1);

   q.weights[wt]={
     autos:autos.map(x=>({...x})),
     wildCards:wild.map(x=>({...x})),
     firstOut:firstOut.map(x=>({...x})),
     field:field.map(x=>({
       wrestlerId:x.wrestlerId,teamId:x.teamId,conference:x.conference,
       conferencePlace:x.place,status:x.status,seed:x.seed,
       resume:ncaaNationalResumeScore(x,year)
     }))
   }
 });
 q.announced=true;q.announcementYear=year;
 return q
}




function ncaaFieldForWeight(wt,year=G.year){
 let q=ensureNcaaSelection(year),f=[...(q.weights?.[wt]?.field||[])];
 // Official NCAA seeds are authoritative here; national rankings are display-only.
 return f.sort((a,b)=>a.seed-b.seed).map(x=>wrestlerById(x.wrestlerId)).filter(Boolean)
}


function ordinalPlace(n){
 n=Number(n)||0;
 if(n===1)return 'Champ';

 let suffix=(mod100>=11&&mod100<=13)?'th':mod10===1?'st':mod10===2?'nd':mod10===3?'rd':'th';

function cappedFolkTournamentWeightAssignments(t,cap=15){
 let cacheKey=`folkCap${cap}Assignments`;
 if(t[cacheKey])return t[cacheKey];

 let byWt=Object.fromEntries(WTS.map(wt=>[wt,[]]));
 let teamIds=(t.participatingTeams&&t.participatingTeams.length)?t.participatingTeams:[G.school];

 teamIds.forEach(teamId=>{
   let roster=rosterByTeam(teamId).filter(w=>isCompetitionAvailable(w,'folk'));
   let starters=optimizedCollegeStarterMap(teamId),selected=[],used=new Set();

   WTS.forEach(wt=>{
     let id=starters[wt];
     if(id&&!used.has(id)){let w=wrestlerById(id);if(w){selected.push(w);used.add(id)}}
   });
   roster.filter(w=>!used.has(w.id)).sort((a,b)=>(b.folk||0)-(a.folk||0)).slice(0,Math.max(0,cap-selected.length)).forEach(w=>selected.push(w));

   let roomCount=Object.fromEntries(WTS.map(wt=>[wt,0]));
   selected.forEach(w=>{
     let opts=(w.weights||[]).map(Number).filter(wt=>WTS.includes(wt));if(!opts.length)return;
     let startWt=Object.entries(starters).find(([wt,id])=>id===w.id)?.[0];
     let choice=startWt?Number(startWt):[...opts].sort((a,b)=>roomCount[a]-roomCount[b]||opts.indexOf(a)-opts.indexOf(b))[0];
     byWt[choice].push(w.id);roomCount[choice]++
   })
 });
 t[cacheKey]=byWt;return byWt
}
function cappedFolkTournamentEntrants(t,wt,cap=15){

}

function isUsOpenEvent(t){return !!t&&['u20us','u23us','usopen'].includes(t.id)}

function ensureProgressiveUsOpenBracket(t,wt){
 ensureTournamentProgress(t);
 wt=Number(wt);
 prepareUsOpenField(t);

 let ids=t._usOpenFieldByWeight?.[wt]||[];

 // A stored progressive state is valid only if it actually contains the current field.
 let stored=t._usOpenProgressive?.[wt],
     bracket=t.brackets?.[wt],
     storedCount=stored?.current?.filter(Boolean).length||0,
     hasMatches=(bracket?.matches||[]).length>0;

 if(stored&&bracket&&(storedCount>0||hasMatches||stored.stage==='complete')){
   return stored
 }

 // Repair a stale/empty generated state.
 t._usOpenProgressive=t._usOpenProgressive||{};
 t.brackets=t.brackets||{};
 delete t._usOpenProgressive[wt];
 delete t.brackets[wt];

 let entrants=usOpenFieldForWeight(t,wt),
     size=nextPow2(Math.max(2,entrants.length)),
     seeded=[...entrants].sort((a,b)=>usOpenFastSeedScore(t,b)-usOpenFastSeedScore(t,a)),
     order=placeSeeds(seeded,size,w=>usOpenFastSeedScore(t,w)),
     seeds=Object.fromEntries(seeded.map((w,i)=>[w.id,i+1]));

 t.brackets[wt]={
   matches:[],placements:[],seeds,fieldSize:entrants.length,bracketSize:size,
   topology:{
     fixedSeedSlots:fixedSeedBracketOrder(size),fixedWinnerPaths:true,fixedLoserPaths:true,
     reseeding:false,medalSessionOrder:['Bronze Medal Match 1','Bronze Medal Match 2','Gold Medal Match']
   }
 };

 t._usOpenProgressive[wt]={
   stage:'championship',
   current:order.map(w=>w?.id||null),
   lostTo:{},
   roundIndex:0,
   finalists:[],
   bronzeW:[],bronzeL:[]
 };

 t.progress[wt]={generated:true,shownRounds:0,complete:false};
 return t._usOpenProgressive[wt]
}

function simulateUsOpenChampionshipRound(t,wt,state){
 let ids=state.current||[];
 if(ids.filter(Boolean).length<=2){
   state.finalists=ids.filter(Boolean);
   state.stage='medals';
   return false
 }
 let rn=uwwRoundName(ids.length),next=[];
 for(let i=0;i<ids.length;i+=2){
   let a=ids[i]?wrestlerById(ids[i]):null,
       b=ids[i+1]?wrestlerById(ids[i+1]):null;

   if(a&&!b){
     t.brackets[wt].matches.push({round:rn,a:a.id,b:null,winner:a.id,loser:null,score:'BYE',method:'Bye',side:'Championship'});
     next.push(a.id);continue
   }
   if(b&&!a){
     t.brackets[wt].matches.push({round:rn,a:null,b:b.id,winner:b.id,loser:null,score:'BYE',method:'Bye',side:'Championship'});
     next.push(b.id);continue
   }
   if(!a&&!b){next.push(null);continue}

   let r=simBout(a,b,'free');
   t.brackets[wt].matches.push({round:rn,a:a.id,b:b.id,winner:r.winner?.id||null,loser:r.loser?.id||null,score:r.score,method:r.method,side:'Championship'});
   if(r.winner&&r.loser){
     state.lostTo[r.winner.id]=state.lostTo[r.winner.id]||[];
     state.lostTo[r.winner.id].push(r.loser.id);
     logBout(t,wt,rn,r,true)
   }
   next.push(r.winner?.id||null)
 }
 state.current=next;
 state.roundIndex++;
 if(next.filter(Boolean).length<=2){
   state.finalists=next.filter(Boolean);
   state.stage='medals'
 }
 return true
}

function simulateUsOpenMedalSession(t,wt,state){
 let finalists=(state.finalists||[]).map(wrestlerById).filter(Boolean),
     bronzeW=[],bronzeL=[],
     bronzeMatches=[];

 finalists.forEach((finalist,side)=>{
   let chain=(state.lostTo[finalist.id]||[]).map(wrestlerById).filter(Boolean);
   if(!chain.length)return;
   let survivor=chain[0];

   for(let i=1;i<chain.length;i++){
     let opponent=chain[i],
         r=simBout(survivor,opponent,'free'),
         rn=`Repechage ${side+1}.${i}`;
     t.brackets[wt].matches.push({round:rn,a:survivor.id,b:opponent.id,winner:r.winner?.id||null,loser:r.loser?.id||null,score:r.score,method:r.method,side:'Repechage'});
     if(r.winner&&r.loser)logBout(t,wt,rn,r,false);
     survivor=r.winner||survivor
   }

   let semiLoser=chain[chain.length-1],
       opp=survivor.id===semiLoser.id?(chain[chain.length-2]||survivor):semiLoser;

   if(opp&&opp.id!==survivor.id){
     let r=simBout(survivor,opp,'free'),
         rn=`Bronze Medal Match ${side+1}`;
     bronzeMatches.push({rn,r,a:survivor,b:opp});
     if(r.winner)bronzeW.push(r.winner);
     if(r.loser)bronzeL.push(r.loser)
   }else if(survivor){
     bronzeW.push(survivor)
   }
 });

 bronzeMatches.forEach(x=>{
   let {rn,r,a,b}=x;
   t.brackets[wt].matches.push({round:rn,a:a.id,b:b.id,winner:r.winner?.id||null,loser:r.loser?.id||null,score:r.score,method:r.method,side:'Medal Matches'});
   if(r.winner&&r.loser)logBout(t,wt,rn,r,false)
 });

 let champ=null,runner=null;
 if(finalists.length===2){
   let r=simBout(finalists[0],finalists[1],'free'),rn='Gold Medal Match';
   t.brackets[wt].matches.push({round:rn,a:finalists[0].id,b:finalists[1].id,winner:r.winner?.id||null,loser:r.loser?.id||null,score:r.score,method:r.method,side:'Medal Matches'});
   if(r.winner&&r.loser)logBout(t,wt,rn,r,true);
   champ=r.winner||null;runner=r.loser||null
 }else champ=finalists[0]||null;

 let placements=[champ,runner,...bronzeW,...bronzeL].filter(Boolean);
 t.brackets[wt].placements=placements.map(w=>w.id);
 state.stage='complete';
 t.progress[wt].complete=true;
 t.progress[wt].shownRounds=bracketRoundOrder(t,wt).length;

 if(t.brackets[wt]?.placements?.[0]){
   let usa=intl.find(c=>c.name==='USA'),winner=wrestlerById(t.brackets[wt].placements[0]);
   if(usa&&winner)setNationalStarter(usa.id,t.level,wt,winner)
 }
 recomputeUSOpenRTCPoints(t);
 maybeSyncTournamentAccolades(t)
}

function simulateUsOpenNextSession(t,wt){
 wt=Number(wt);
 let started=performance.now?.()||Date.now();

 prepareUsOpenField(t);
 let fieldCount=(t._usOpenFieldByWeight?.[wt]||[]).length;
 if(fieldCount<2){
   throw new Error(`${t.name} ${wt} lbs has only ${fieldCount} eligible entrant${fieldCount===1?'':'s'}. The U.S. Open field generation needs repair before this weight can be simulated.`)
 }

 let state=ensureProgressiveUsOpenBracket(t,wt);
 if(state.stage==='complete')return;

 let before=(t.brackets?.[wt]?.matches||[]).length;

 if(state.stage==='championship'){
   simulateUsOpenChampionshipRound(t,wt,state)
 }else if(state.stage==='medals'){
   simulateUsOpenMedalSession(t,wt,state)
 }

 let after=(t.brackets?.[wt]?.matches||[]).length;
 if(after===before&&state.stage!=='complete'){
   // One automatic repair attempt for stale state.
   delete t._usOpenProgressive?.[wt];
   delete t.brackets?.[wt];
   t.progress[wt]={generated:false,shownRounds:0,complete:false};
   state=ensureProgressiveUsOpenBracket(t,wt);
   simulateUsOpenChampionshipRound(t,wt,state)
 }

 t.progress[wt].shownRounds=bracketRoundOrder(t,wt).length;
 t.simulated=WTS.every(x=>t.progress[x]?.complete);
 PERF.metrics.lastUsOpenSessionMs=(performance.now?.()||Date.now())-started;
 saveGame()
}

function simulateUsOpenEntireWeight(t,wt){
 let guard=0,state=ensureProgressiveUsOpenBracket(t,wt);
 while(state.stage!=='complete'&&guard++<20){
   simulateUsOpenNextSession(t,wt);
   state=t._usOpenProgressive[wt]
 }
}

function generateWeightBracket(t,wt){
 let __genStart=performance.now?.()||Date.now();
 ensureTournamentProgress(t);
 if(t.brackets[wt]){t.progress[wt].generated=true;return}
 let entrants;
 if(t.style==='folk'){
   if(t.id==='ncaa')entrants=ncaaFieldForWeight(wt,t.year);
   else if(t.id==='conf'){
     entrants=conferenceEntrantsForWeight(t.conference||team().conf,wt,t.year)
   }else if(t.id==='ist1'||t.id==='ist2'||t.id==='decclassic'){
     entrants=cappedTournamentEntrantsWithUserSquad(t,wt,15)
   }else{
     entrants=oneEntryFolkTournamentEntrants(t,wt,64)
   }

   // Absolute final defense: no wrestler can occur twice in the same bracket field.
   let seen=new Set();
   entrants=(entrants||[]).filter(w=>w&&!seen.has(w.id)&&(seen.add(w.id),true));

function exclusiveCollegeDualStarterMap(teamId){
 let roster=rosterByTeam(teamId).filter(w=>isCompetitionAvailable(w,'folk')),
     out={},used=new Set();

 if(teamId===G.school){
   // Respect the user's saved depth chart, but normalize old/duplicate data defensively.
   G.depthChart=normalizeExclusiveDepthChart(G.depthChart||{},teamId);

   WTS.forEach(wt=>{
     let w=(G.depthChart[wt]||[])
       .map(wrestlerById)
       .find(x=>x&&x.team===teamId&&!used.has(x.id)&&isCompetitionAvailable(x,'folk')&&(x.weights||[]).map(Number).includes(Number(wt)));
     if(w){out[wt]=w.id;used.add(w.id)}
   });

   // If a weight is genuinely open, fill it with the best remaining eligible wrestler
   // without ever reusing somebody already starting elsewhere.
   WTS.forEach(wt=>{
     if(out[wt])return;
     let w=roster
       .filter(x=>!used.has(x.id)&&(x.weights||[]).map(Number).includes(Number(wt)))
       .sort((a,b)=>(b.folk||0)-(a.folk||0))[0];
     if(w){out[wt]=w.id;used.add(w.id)}
   })
 }else{
   // AI uses the global lineup optimizer, which already assigns each wrestler once.
   let opt=optimizedCollegeStarterMap(teamId);
   WTS.forEach(wt=>{
     let id=opt[wt],w=id?wrestlerById(id):null;
     if(w&&!used.has(w.id)){out[wt]=w.id;used.add(w.id)}
   })
 }
 return out
}

 });

}

 }).sort((a,b)=>b.avg-a.avg||b.filled-a.filled||b.prestige-a.prestige).map(x=>x.id)
}
function previousNcaaSeedOrder(year){
 // 2026 has no prior NCAA tournament in a new dynasty, so use current team rankings.
 if(year<=2026)return {order:currentCollegeTeamRankingOrder(),basis:'2026 Current Team Rankings'};

 let ncaa=Object.values(G.tournaments||{}).find(t=>t.id==='ncaa'&&t.year===year-1&&t.simulated);
 if(!ncaa||!ncaa.teamPoints)return {order:currentCollegeTeamRankingOrder(),basis:`Current Team Rankings (no ${year-1} NCAA team-score data found)`};

 let points=ncaa.teamPoints||{};
 let scorers=colleges.filter(c=>(points[c.id]||0)>0).map(c=>({id:c.id,pts:Number(points[c.id]||0),tie:Math.random()}))
   .sort((a,b)=>b.pts-a.pts||a.tie-b.tie);

 // Every team that scored zero at the previous NCAA tournament is randomized at the bottom.
 let nonScorers=colleges.filter(c=>!(points[c.id]>0)).map(c=>c.id);
 for(let i=nonScorers.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[nonScorers[i],nonScorers[j]]=[nonScorers[j],nonScorers[i]]}

 return {
   order:[...scorers.map(x=>x.id),...nonScorers],
   basis:`${year-1} NCAA Team Score`,
   previousYear:year-1,
   scores:Object.fromEntries(scorers.map(x=>[x.id,x.pts])),
   scoringTeams:scorers.length
 }
}


function dualNationalsWrestlerPoints(t){
 let pts={},seen=new Set();
 let addGame=g=>{
   if(!g||g.bye)return;
   (g.matches||[]).forEach(m=>{
     let key=`${g.label||''}|${m.wt}|${m.a||''}|${m.b||''}`;
     if(seen.has(key))return;seen.add(key);
     let winner=wrestlerById(m.winner);if(!winner)return;
     let value=(m.method==='Double Forfeit')?0:
       (m.method==='Fall'||m.method==='Forfeit'||m.method==='MFOR')?6:
       m.method==='TF'?5:m.method==='Major'?4:3;
     pts[winner.id]=(pts[winner.id]||0)+value
   })
 };
 if(t.dualNatState?.rounds?.length){
   t.dualNatState.rounds.forEach(rd=>(rd.games||[]).forEach(addGame))
 }else{
   (t.dualBracket||[]).forEach(rd=>(rd||[]).forEach(addGame));
   (t.dualPlacementMatches||[]).forEach(addGame)
 }
 return pts
}

function awardDualNationalsHonors(t){

 // Every wrestler on a top-eight team gets that team placement on his career accolades.
 (t.dualPlacements||[]).slice(0,8).forEach((teamId,i)=>{
   let place=i+1;
   rosterByTeam(teamId).forEach(w=>{
     addAccolade(w,{
       year:t.year,event:t.name,place,
       type:'Dual Nationals Team Placement',
       title:`Dual National Championship — ${folkPlaceLabel(place)} Team`,
       team:teamId
     })
   })
 });

 // Ironman = most dual meet team points personally scored throughout the entire tournament.
 let scores=dualNationalsWrestlerPoints(t),
     best=Math.max(0,...Object.values(scores)),
     winners=Object.entries(scores).filter(([,p])=>p===best&&p>0).map(([id])=>wrestlerById(id)).filter(Boolean);

 t.dualIronman={points:best,wrestlerIds:winners.map(w=>w.id)};
 winners.forEach(w=>{
   addAccolade(w,{
     year:t.year,event:t.name,type:'Individual Award',
     title:winners.length>1?'Co-Dual Meet National Tournament Ironman Award':'Dual Meet National Tournament Ironman Award',
     points:best
   })
 });
}


function dualNatSeedOrder(n){
 let order=[1,2];
 while(order.length<n){
   let size=order.length*2,next=[];
   order.forEach(x=>{next.push(x);next.push(size+1-x)});
   order=next
 }
 return order
}

function dualNationalQualifierRows(year=currentSeasonStartYear(),excludeEventKey=null){
 let standings=dualRecordSeedOrder(year,excludeEventKey),
     byId=new Map(standings.map(x=>[x.id,x])),
     conferenceChamps=[],
     selected=new Set();

 [...new Set(colleges.map(c=>c.conf))].forEach(conf=>{
   let best=standings.find(r=>colleges.find(c=>c.id===r.id)?.conf===conf);
   if(best){conferenceChamps.push({...best,qualification:`${conf} Automatic Qualifier`});selected.add(best.id)}
 });

 let atLarge=standings
   .filter(r=>!selected.has(r.id))
   .slice(0,Math.max(0,16-conferenceChamps.length))
   .map((r,i)=>({...r,qualification:`At-Large #${i+1}`}));

 let field=[...conferenceChamps,...atLarge];

 // Seeding ignores AQ/at-large status. All 16 seeds are purely current dual standings.
 field.sort((a,b)=>standings.findIndex(x=>x.id===a.id)-standings.findIndex(x=>x.id===b.id));
 return field.slice(0,16)
}

 t.dualSeedBasis='16-Team Field: each conference #1 in current dual standings + 9 best remaining teams; all seeds 1-16 by overall dual standings';
 t.dualSeeds=Object.fromEntries(seeded.map((id,i)=>[id,i+1]));

 }]));

 t.dualNatState={

   rounds:[{
     label:'Championship — Round of 16',
